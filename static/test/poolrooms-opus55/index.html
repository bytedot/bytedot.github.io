<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* Full-bleed WebGL scene; a single veil layer for start / pause. Deliberately dark-only. */

@media (prefers-reduced-motion: reduce) { #veil { transition: none; } }

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';

// ───────────────────────────── constants & small helpers ─────────────────────────────
const VS = 0.25;                     // voxel size (m)
const GX = 480, GY = 72, GZ = 480;   // voxel grid dims
const OX = -60, OY = -4, OZ = -60;   // world position of voxel (0,0,0) corner
const GRID_MIN = [OX, OY, OZ], GRID_MAX = [OX + GX * VS, OY + GY * VS, OZ + GZ * VS];
const FLOOR_VY = Math.round((0 - OY) / VS); // voxel row whose bottom is world y = 0
const WATER_Y = 0.3;                 // the flooded level of the whole complex & the endless sea
const EYE = 1.6, BODY = 1.7;         // eye height / body height for a 1.7 m person
const SUN_DIR = new THREE.Vector3(-0.5, 0.72, 0.48).normalize(); // direction *towards* the sun
const SUN_IRR = 7.0;                 // perpendicular sun irradiance (scene units)
const PAD = 2;                       // lightmap chart padding in texels

const DEBUG = /[?&]debug/.test(location.search);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const v3 = (x, y, z) => [x, y, z];
const vadd = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const vsub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const vscl = (a, s) => [a[0] * s, a[1] * s, a[2] * s];
const vdot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const vcross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const vlen = (a) => Math.hypot(a[0], a[1], a[2]);
const vnorm = (a) => { const l = vlen(a) || 1; return [a[0] / l, a[1] / l, a[2] / l]; };

const statusEl = document.getElementById('status');
function setStatus(t) { if (statusEl) statusEl.textContent = t; }
// next display frame, or a short timer when the page is in the background (rAF pauses there)
const nextFrame = () => new Promise((r) => { let done = false; const f = () => { if (!done) { done = true; r(); } }; requestAnimationFrame(f); setTimeout(f, 100); });

// ───────────────────────────── voxel world & level layout ─────────────────────────────
const MAT = { AIR: 0, WHITE: 1, POOL: 2, ACCENT: 3, CREAM: 4, LIGHT: 5, POOLLIGHT: 6, HIDDEN: 7, SMALL: 8, LAMP: 9, STEEL: 10 };
// albedo (linear), roughness, tile size, grout width, style (0 square, 1 mosaic, 2 large, 3 emissive), emission
const MATERIALS = [
  { a: [0, 0, 0], r: 1, ts: 1, gw: 0, st: 0, e: [0, 0, 0] },                               // 0 air (unused)
  { a: [0.80, 0.81, 0.78], r: 0.07, ts: 0.15, gw: 0.0045, st: 0, e: [0, 0, 0] },          // 1 white 15 cm
  { a: [0.36, 0.66, 0.71], r: 0.08, ts: 0.05, gw: 0.0028, st: 1, e: [0, 0, 0] },          // 2 pool mosaic
  { a: [0.045, 0.15, 0.32], r: 0.06, ts: 0.15, gw: 0.0045, st: 0, e: [0, 0, 0] },         // 3 deep-blue accent
  { a: [0.74, 0.71, 0.64], r: 0.13, ts: 0.30, gw: 0.005, st: 2, e: [0, 0, 0] },           // 4 cream 30 cm
  { a: [0.9, 0.9, 0.9], r: 0.5, ts: 1, gw: 0, st: 3, e: [13.0, 12.6, 11.8] },             // 5 ceiling light
  { a: [0.9, 0.9, 0.9], r: 0.5, ts: 1, gw: 0, st: 3, e: [1.5, 4.4, 5.4] },              // 6 underwater light
  { a: [0.80, 0.81, 0.78], r: 0.07, ts: 0.15, gw: 0.0045, st: 0, e: [0, 0, 0] },          // 7 hidden (never drawn)
  { a: [0.81, 0.82, 0.80], r: 0.07, ts: 0.075, gw: 0.0035, st: 0, e: [0, 0, 0] },         // 8 small white 7.5 cm
  { a: [0.9, 0.9, 0.9], r: 0.5, ts: 1, gw: 0, st: 3, e: [2.6, 3.0, 3.3] },                // 9 dim tunnel lamp
  { a: [0.02, 0.02, 0.02], r: 0.07, ts: 1, gw: 0, st: 4, e: [0, 0, 0] },                  // 10 polished steel
];

const vox = new Uint8Array(GX * GY * GZ);
const SY = GX * GZ;

function vr(a0, a1, o, n) {
  return [Math.max(0, Math.round((a0 - o) / VS)), Math.min(n, Math.round((a1 - o) / VS))];
}
function forRows(x0, y0, z0, x1, y1, z1, f) {
  const [ix0, ix1] = vr(x0, x1, OX, GX), [iy0, iy1] = vr(y0, y1, OY, GY), [iz0, iz1] = vr(z0, z1, OZ, GZ);
  if (ix1 <= ix0) return;
  for (let y = iy0; y < iy1; y++) for (let z = iz0; z < iz1; z++) f(y * SY + z * GX + ix0, y * SY + z * GX + ix1);
}
function fill(x0, y0, z0, x1, y1, z1, m) { forRows(x0, y0, z0, x1, y1, z1, (a, b) => vox.fill(m, a, b)); }
function carve(x0, y0, z0, x1, y1, z1) { fill(x0, y0, z0, x1, y1, z1, 0); }
function paint(x0, y0, z0, x1, y1, z1, m) {
  forRows(x0, y0, z0, x1, y1, z1, (a, b) => { for (let i = a; i < b; i++) { const v = vox[i]; if (v !== 0 && v !== MAT.HIDDEN) vox[i] = m; } });
}
function hideSolid(x0, y0, z0, x1, y1, z1) {
  forRows(x0, y0, z0, x1, y1, z1, (a, b) => { for (let i = a; i < b; i++) if (vox[i] !== 0) vox[i] = MAT.HIDDEN; });
}
function getV(ix, iy, iz) {
  if (iy < 0) return MAT.WHITE;
  if (iy >= GY) return 0;
  if (ix < 0 || iz < 0 || ix >= GX || iz >= GZ) return iy < FLOOR_VY ? MAT.WHITE : 0;
  return vox[iy * SY + iz * GX + ix];
}

// parametric (non-grid) architecture: drawn as smooth geometry, collided via hidden voxels
const shapes = { columns: [], tubes: [], arches: [], ladders: [] };

function column(cx, cz, r, y0, y1) {
  shapes.columns.push({ cx, cz, r, y0, y1 });
  const [ix0, ix1] = vr(cx - r, cx + r, OX, GX), [iz0, iz1] = vr(cz - r, cz + r, OZ, GZ), [iy0, iy1] = vr(y0, y1, OY, GY);
  for (let z = iz0; z < iz1; z++) for (let x = ix0; x < ix1; x++) {
    const wx0 = OX + x * VS - cx, wx1 = wx0 + VS, wz0 = OZ + z * VS - cz, wz1 = wz0 + VS;
    const fx = Math.max(Math.abs(wx0), Math.abs(wx1)), fz = Math.max(Math.abs(wz0), Math.abs(wz1));
    if (fx * fx + fz * fz > r * r) continue;              // only voxels fully inside the shaft
    for (let y = iy0; y < iy1; y++) vox[y * SY + z * GX + x] = MAT.HIDDEN;
  }
}
// round tiled tube along +x, bottom tangent at cy - R
function tube(x0, x1, cz, cy, R) {
  shapes.tubes.push({ x0, x1, cz, cy, R });
  fill(x0, cy - R, cz - R, x1, cy + R, cz + R, MAT.HIDDEN);
  carve(x0, cy - R, cz - 0.5, x1, cy - R + 2.25, cz + 0.5); // walkable channel (collision only)
}
// semicircular arch through a wall. axis: 'x' or 'z' = passage direction; c = centre across the passage
function arch(axis, c, t0, t1, w, base, spring) {
  const R = w / 2;
  shapes.arches.push({ axis, c, t0, t1, R, base, spring });
  if (axis === 'z') { carve(c - R, base, t0, c + R, spring, t1); hideSolid(c - R, spring, t0, c + R, spring + R, t1); }
  else { carve(t0, base, c - R, t1, spring, c + R); hideSolid(t0, spring, c - R, t1, spring + R, c + R); }
}

// water surfaces: horizontal planes clipped to rectangles [x0,z0,x1,z1]; floor = lowest bottom below
const WATER_BODIES = [
  { y: WATER_Y, rect: [-4000, -4000, 4000, 4000], floor: -8 },
  { y: 4.95, rect: [-10, 29, 40, 31], floor: 4.7 },
  { y: 0.65, rect: [-33, 43, -29, 47], floor: 0.2 },
];

// atmosphere / sound zones (first match wins). fog = haze extinction per metre
const ZONES = [
  { name: 'atrium', box: [-16, -3, -4, 16, 11.5, 24], fog: 0.009, reverb: 0.95, size: 1.0 },
  { name: 'hall', box: [-44, -2, -40, 16, 4.8, -6], fog: 0.016, reverb: 0.85, size: 0.8 },
  { name: 'tube', box: [16, -1, 6.5, 42, 2.8, 9.5], fog: 0.007, reverb: 0.9, size: 0.35 },
  { name: 'chamber', box: [26, -2, 4, 34, 4.6, 12], fog: 0.008, reverb: 0.8, size: 0.4 },
  { name: 'nightpool', box: [42, -3, -6, 58, 7.2, 20], fog: 0.006, reverb: 0.9, size: 0.75 },
  { name: 'stairs', box: [44, 0, 20, 54, 9.2, 34], fog: 0.008, reverb: 0.8, size: 0.6 },
  { name: 'gallery', box: [-14, 4.5, 26, 52, 9.2, 34], fog: 0.007, reverb: 0.75, size: 0.6 },
];
const OUTDOOR_FOG = 0.0012;
function zoneAt(x, y, z) {
  for (const zn of ZONES) { const b = zn.box; if (x >= b[0] && x <= b[3] && y >= b[1] && y <= b[4] && z >= b[2] && z <= b[5]) return zn; }
  return null;
}

function buildLevel() {
  // bedrock under the whole grid: floor top at y = 0
  fill(OX, OY, OZ, GRID_MAX[0], 0, GRID_MAX[2], MAT.WHITE);

  // building masses
  fill(-46, 0, -42, 18, 5.5, -4, MAT.WHITE);   // pillar hall
  fill(-18, 0, -6, 18, 12, 26, MAT.WHITE);     // atrium
  fill(18, 0, -2, 42, 5, 18, MAT.WHITE);       // tunnels & chamber
  fill(40, 0, -8, 60, 8, 22, MAT.WHITE);       // night pool
  fill(-18, 0, 24, 54, 10, 36, MAT.WHITE);     // upper gallery
  fill(44, 0, 20, 54, 10, 36, MAT.WHITE);      // stairwell

  // ── A: the atrium (bright, skylit)
  carve(-16, 0, -4, 16, 11, 24);
  carve(-9, -2.25, 3, 7, 0, 13);
  for (let k = 0; k < 8; k++) fill(-9 + 0.5 * k, -2.25, 5, -9 + 0.5 * (k + 1), -0.25 * (k + 1), 11, MAT.POOL);
  paint(-9.25, -2.5, 2.75, 7.25, 0, 13.25, MAT.POOL);
  paint(-9.25, -0.25, 2.75, 7.25, 0, 13.25, MAT.ACCENT);
  for (const z of [5.5, 8.0, 10.5]) paint(-4.5, -2.5, z, 6.5, -2.25, z + 0.25, MAT.ACCENT);
  for (const x of [-11, -4, 3, 10]) for (const z of [4, 14]) carve(x - 1.25, 11, z - 1.25, x + 1.25, 12.5, z + 1.25);
  for (const x of [-12, -6, 0, 6, 12]) for (const z of [-1, 21]) column(x, z, 0.55, 0, 11);
  for (const x of [-8, 0, 8]) arch('z', x, -6, -4, 3, 0, 2.5);          // into the pillar hall
  for (const z of [6, 16]) arch('x', z, -18, -16, 2.5, 0, 2.25);        // out to the sea

  // ── tunnels and the small chamber between atrium and night pool (dim)
  carve(26, 0, 4, 34, 4.5, 12);
  carve(28, -1.5, 6, 32, 0, 10);
  paint(27.75, -1.75, 5.75, 32.25, 0, 10.25, MAT.POOL);
  carve(29.5, 4.5, 7.5, 30.5, 4.75, 8.5); paint(29.5, 4.75, 7.5, 30.5, 5.0, 8.5, MAT.LAMP);
  tube(16, 26, 8, 1.25, 1.25);
  tube(34, 42, 8, 1.25, 1.25);

  // ── D: the night pool (dark room, lit from under the water)
  carve(42, 0.5, -6, 58, 7, 20);
  carve(45, -2.5, -2, 55, 0.5, 16);
  for (let k = 0; k < 11; k++) fill(45, -2.5, -2 + 0.5 * k, 48, 0.25 - 0.25 * k, -2 + 0.5 * (k + 1), MAT.POOL);
  paint(44.75, -2.75, -2.25, 55.25, 0.5, 16.25, MAT.POOL);
  paint(44.75, 0.25, -2.25, 55.25, 0.5, 16.25, MAT.ACCENT);
  for (const z of [7, 10, 13]) paint(44.75, -1.25, z - 0.5, 45, -0.75, z + 0.5, MAT.POOLLIGHT);
  for (const z of [0, 3.5, 7, 10, 13]) paint(55, -1.25, z - 0.5, 55.25, -0.75, z + 0.5, MAT.POOLLIGHT);
  for (const x of [47.5, 50, 52.5]) paint(x - 0.5, -1.25, 16, x + 0.5, -0.75, 16.25, MAT.POOLLIGHT);
  carve(42, 0, 6.75, 43, 0.5, 9.25);
  carve(43, 0.25, 6.75, 43.5, 0.5, 9.25);

  // ── E: stairwell rising from the night pool deck into the gallery
  carve(46, 0.5, 20, 52, 9, 31.5);
  for (let k = 0; k < 18; k++) fill(46, 0.5, 22 + 0.5 * k, 52, 0.5 + 0.25 * (k + 1), 22 + 0.5 * (k + 1), MAT.WHITE);

  // ── G: upper gallery with sea windows and a long reflecting channel
  carve(-14, 5, 26, 52, 9, 34);
  fill(45.75, 5, 26, 46, 6, 30.75, MAT.WHITE);
  paint(-14, 4.75, 26, 46, 5, 34, MAT.CREAM);
  carve(-10, 4.75, 29, 40, 5, 31);
  paint(-10.25, 4.5, 28.75, 40.25, 5, 31.25, MAT.ACCENT);
  for (const x of [-10, -4, 2, 8, 14]) arch('z', x, 24, 26, 3, 6.0, 7.25);   // balcony views into the atrium
  for (let x = -11; x <= 49; x += 6) carve(x - 1, 6.0, 34, x + 1, 8.5, 36);   // sea windows
  carve(-18, 6.0, 27.5, -14, 8.5, 32.5);

  // ── B: the pillar hall (misty, panel-lit, opens west onto the sea)
  carve(-44, 0, -40, 16, 4.5, -6);
  fill(-20.5, 0, -30.5, -4.5, 0.25, -19.5, MAT.WHITE);
  fill(-20, 0.25, -30, -5, 0.5, -20, MAT.WHITE);
  carve(-36, -1.5, -34, -26, 0, -26);
  for (let i = 0; i <= 10; i++) for (let j = 0; j <= 5; j++) {
    const px = -39 + 5 * i, pz = -36 + 5 * j;
    fill(px - 0.5, -3, pz - 0.5, px + 0.5, 4.5, pz + 0.5, MAT.WHITE);
  }
  paint(-36.25, -1.75, -34.25, -25.75, 0, -25.75, MAT.POOL);
  for (let i = 0; i < 10; i++) for (let j = 0; j < 5; j++) {
    const cx = -36.5 + 5 * i, cz = -33.5 + 5 * j;
    carve(cx - 0.5, 4.5, cz - 0.5, cx + 0.5, 4.75, cz + 0.5);
    paint(cx - 0.5, 4.75, cz - 0.5, cx + 0.5, 5.0, cz + 0.5, MAT.LIGHT);
  }
  for (const z0 of [-38, -32, -26, -20, -14]) carve(-46, 0, z0, -44, 3.75, z0 + 4);

  // stainless ladders: [x, z, deckY, dirX, dirZ, depth]
  shapes.ladders.push([7, 6.0, 0, -1, 0, 1.9], [7, 10.0, 0, -1, 0, 1.9], [55, 9.5, 0.5, -1, 0, 2.4], [50.5, 16, 0.5, 0, -1, 2.4], [-26, -30, 0, -1, 0, 1.3], [30, 10, 0, 0, -1, 1.3]);

  // ── follies standing in the open sea
  fill(-54.25, 0, -1.75, -53.75, 3.5, -1.25, MAT.WHITE);           // a lone doorframe
  fill(-54.25, 0, 1.25, -53.75, 3.5, 1.75, MAT.WHITE);
  fill(-54.25, 3.0, -1.75, -53.75, 3.5, 1.75, MAT.WHITE);
  fill(-36, 3.5, 40, -26, 4.0, 50, MAT.WHITE);                       // pavilion roof
  for (const [x, z] of [[-35.5, 40.5], [-26.5, 40.5], [-35.5, 49.5], [-26.5, 49.5]]) fill(x - 0.25, 0, z - 0.25, x + 0.25, 3.5, z + 0.25, MAT.WHITE);
  fill(-34, 0, 42, -28, 0.75, 48, MAT.WHITE);                        // raised basin
  carve(-33, 0.25, 43, -29, 0.75, 47);
  paint(-33.25, 0, 42.75, -28.75, 0.75, 47.25, MAT.POOL);
  for (let k = 0; k < 16; k++) fill(16 + 0.5 * k, 0, 44, 16 + 0.5 * (k + 1), 0.25 * (k + 1), 46.5, MAT.WHITE); // stairs to nowhere
  fill(-56, 0, -56, -52, 12, -52, MAT.WHITE);                        // a tall tiled tower
  for (let z = 40; z <= 56; z += 4) fill(-1, 0, z - 0.5, 0, 6, z + 0.5, MAT.SMALL); // pillars marching south
}

// ───────────────────────────── surface patches ─────────────────────────────
// Every visible surface is a planar patch: parallelogram (o, U, V) or triangle (o, o+U, o+V).
// The same list feeds the raster mesh, the lightmap atlas and the ray-tracing BVH.
const PF_TRI = 1, PF_ANALYTIC = 2, PF_EMISSIVE = 4;
const patches = [];
const SOLIDS = []; // AABBs outside the voxel grid (for collision): [x0,y0,z0,x1,y1,z1]

function addPatch(o, U, V, mat, flags, extra) {
  const n = vnorm(vcross(U, V));
  const p = { o, U, V, n, mat, flags: flags | (MATERIALS[mat].st === 3 ? PF_EMISSIVE : 0), vn: null, tuv: null, tan: null, lm: null };
  if (extra) Object.assign(p, extra);
  patches.push(p);
  return p;
}
function addRectFacing(o, U, V, want, mat, flags, extra) {
  if (vdot(vcross(U, V), want) < 0) { const t = U; U = V; V = t; if (extra) swapExtra(extra); }
  return addPatch(o, U, V, mat, flags, extra);
}
function swapExtra(ex) {
  // corner order c0=o, c1=o+U, c2=o+U+V, c3=o+V  →  swapping U/V swaps c1 and c3
  for (const k of ['vn', 'tuv', 'tan']) if (ex[k]) { const a = ex[k]; const t = a[1]; a[1] = a[3]; a[3] = t; }
}
function addTriFacing(a, b, c, want, mat, flags) {
  let U = vsub(b, a), V = vsub(c, a);
  if (vdot(vcross(U, V), want) < 0) { const t = U; U = V; V = t; }
  return addPatch(a, U, V, mat, flags | PF_TRI);
}

function meshVoxels() {
  const dims = [GX, GY, GZ], strides = [1, SY, GX], org = [OX, OY, OZ];
  for (let d = 0; d < 3; d++) {
    const u = (d + 1) % 3, v = (d + 2) % 3;
    const nu = dims[u], nv = dims[v], nd = dims[d];
    const su = strides[u], sv = strides[v], sd = strides[d];
    const mask = new Uint8Array(nu * nv);
    const eU = [0, 0, 0], eV = [0, 0, 0], eD = [0, 0, 0];
    eU[u] = 1; eV[v] = 1; eD[d] = 1;
    for (const sgn of [1, -1]) {
      for (let s = 0; s <= nd; s++) {
        const pd = org[d] + s * VS;
        const hiddenTop = d === 1 && sgn > 0 && pd > 7.01;       // roofs: never seen, but they cast sun shadows
        if (d === 1 && sgn < 0 && pd < -3.99) continue;
        const la = sgn > 0 ? s - 1 : s, lb = sgn > 0 ? s : s - 1;
        const ina = la >= 0 && la < nd, inb = lb >= 0 && lb < nd;
        let any = false;
        for (let j = 0; j < nv; j++) {
          const row = j * nu;
          for (let i = 0; i < nu; i++) {
            const base = i * su + j * sv;
            const yv = d === 1 ? -1 : (u === 1 ? i : j);
            let a, b;
            if (ina) a = vox[base + la * sd]; else a = d === 1 ? (la < 0 ? 1 : 0) : (yv < FLOOR_VY ? 1 : 0);
            if (a === 0 || a === MAT.HIDDEN) { mask[row + i] = 0; continue; }
            if (inb) b = vox[base + lb * sd]; else b = d === 1 ? (lb < 0 ? 1 : 0) : (yv < FLOOR_VY ? 1 : 0);
            if (b === 0) { mask[row + i] = a; any = true; } else mask[row + i] = 0;
          }
        }
        if (!any) continue;
        for (let j = 0; j < nv; j++) {
          for (let i = 0; i < nu;) {
            const m = mask[i + j * nu];
            if (!m) { i++; continue; }
            let w = 1;
            while (i + w < nu && mask[i + w + j * nu] === m) w++;
            let h = 1;
            outer: while (j + h < nv) {
              for (let k = 0; k < w; k++) if (mask[i + k + (j + h) * nu] !== m) break outer;
              h++;
            }
            for (let jj = 0; jj < h; jj++) mask.fill(0, i + (j + jj) * nu, i + w + (j + jj) * nu);
            const o = [0, 0, 0];
            o[d] = pd; o[u] = org[u] + i * VS; o[v] = org[v] + j * VS;
            const U = vscl(eU, w * VS), V = vscl(eV, h * VS);
            const fl = hiddenTop ? PF_ANALYTIC : 0;
            if (sgn > 0) addPatch(o, U, V, m, fl); else addPatch(o, V, U, m, fl);
            i += w;
          }
        }
      }
    }
  }
}

function tileWrap(len, ts) { return Math.max(1, Math.round(len / ts)) * ts / len; }

function meshColumns() {
  const N = 20;
  for (const c of shapes.columns) {
    const ts = MATERIALS[MAT.SMALL].ts, k = tileWrap(2 * Math.PI * c.r, ts);
    for (let i = 0; i < N; i++) {
      const a0 = (2 * Math.PI * i) / N, a1 = (2 * Math.PI * (i + 1)) / N;
      const p0 = [c.cx + c.r * Math.cos(a0), c.y0, c.cz + c.r * Math.sin(a0)];
      const p1 = [c.cx + c.r * Math.cos(a1), c.y0, c.cz + c.r * Math.sin(a1)];
      const n0 = [Math.cos(a0), 0, Math.sin(a0)], n1 = [Math.cos(a1), 0, Math.sin(a1)];
      const t0 = [-Math.sin(a0), 0, Math.cos(a0), -1], t1 = [-Math.sin(a1), 0, Math.cos(a1), -1];
      const u0 = c.r * a0 * k, u1 = c.r * a1 * k, H = c.y1 - c.y0;
      // corners: c0=p0 bottom, c1=p0 top, c2=p1 top, c3=p1 bottom  (U = up, V = around)
      addPatch(p0, [0, H, 0], vsub(p1, p0), MAT.SMALL, 0, {
        vn: [n0, n0, n1, n1], tuv: [[u0, c.y0], [u0, c.y1], [u1, c.y1], [u1, c.y0]], tan: [t0, t0, t1, t1],
      });
    }
  }
}

function quadrantFans(center, R, a0, a1, corner, segs, toWorld, want, mat) {
  for (let i = 0; i < segs; i++) {
    const t0 = a0 + ((a1 - a0) * i) / segs, t1 = a0 + ((a1 - a0) * (i + 1)) / segs;
    const p0 = toWorld(center[0] + R * Math.cos(t0), center[1] + R * Math.sin(t0));
    const p1 = toWorld(center[0] + R * Math.cos(t1), center[1] + R * Math.sin(t1));
    addTriFacing(toWorld(corner[0], corner[1]), p0, p1, want, mat, 0);
  }
}

function meshTubes() {
  const N = 24, mat = MAT.SMALL, ts = MATERIALS[mat].ts;
  for (const t of shapes.tubes) {
    const k = tileWrap(2 * Math.PI * t.R, ts);
    const lamps = [];
    for (let x = t.x0 + 3; x < t.x1 - 2.0; x += 6) lamps.push([x - 0.4, x + 0.4]);
    for (let i = 0; i < N; i++) {
      const a0 = (2 * Math.PI * i) / N, a1 = (2 * Math.PI * (i + 1)) / N;
      const P = (a, x) => [x, t.cy + t.R * Math.sin(a), t.cz + t.R * Math.cos(a)];
      const nA = (a) => [0, -Math.sin(a), -Math.cos(a)];
      const tA = (a) => [0, Math.cos(a), -Math.sin(a), 1];
      const top = i === 5 || i === 6;
      // split along x into lamp / plain pieces
      const cuts = [t.x0];
      if (top) for (const l of lamps) cuts.push(l[0], l[1]);
      cuts.push(t.x1);
      for (let c = 0; c < cuts.length - 1; c++) {
        const xa = cuts[c], xb = cuts[c + 1];
        if (xb - xa < 1e-3) continue;
        const lamp = top && c % 2 === 1;
        const u0 = t.R * a0 * k, u1 = t.R * a1 * k;
        // corners: c0 = (a0, xa), c1 = (a1, xa), c2 = (a1, xb), c3 = (a0, xb)  (U = around, V = along x)
        addPatch(P(a0, xa), vsub(P(a1, xa), P(a0, xa)), [xb - xa, 0, 0], lamp ? MAT.LAMP : mat, 0, {
          vn: [nA(a0), nA(a1), nA(a1), nA(a0)], tuv: [[u0, xa], [u1, xa], [u1, xb], [u0, xb]], tan: [tA(a0), tA(a1), tA(a1), tA(a0)],
        });
      }
    }
    for (const [xp, f] of [[t.x0, -1], [t.x1, 1]]) {
      const toW = (z, y) => [xp, y, z];
      const c = [t.cz, t.cy], R = t.R, q = N / 4;
      quadrantFans(c, R, 0, Math.PI / 2, [t.cz + R, t.cy + R], q, toW, [f, 0, 0], MAT.WHITE);
      quadrantFans(c, R, Math.PI / 2, Math.PI, [t.cz - R, t.cy + R], q, toW, [f, 0, 0], MAT.WHITE);
      quadrantFans(c, R, Math.PI, 1.5 * Math.PI, [t.cz - R, t.cy - R], q, toW, [f, 0, 0], MAT.WHITE);
      quadrantFans(c, R, 1.5 * Math.PI, 2 * Math.PI, [t.cz + R, t.cy - R], q, toW, [f, 0, 0], MAT.WHITE);
    }
  }
}

function meshArches() {
  const N = 16, mat = MAT.WHITE, ts = MATERIALS[mat].ts;
  for (const a of shapes.arches) {
    const R = a.R, k = tileWrap(Math.PI * R, ts), L = a.t1 - a.t0;
    const toW = a.axis === 'z' ? (s, y, t) => [s, y, t] : (s, y, t) => [t, y, s];
    const along = a.axis === 'z' ? [0, 0, L] : [L, 0, 0];
    for (let i = 0; i < N; i++) {
      const th0 = (Math.PI * i) / N, th1 = (Math.PI * (i + 1)) / N;
      const q0 = toW(a.c + R * Math.cos(th0), a.spring + R * Math.sin(th0), a.t0);
      const q1 = toW(a.c + R * Math.cos(th1), a.spring + R * Math.sin(th1), a.t0);
      const inw = (th) => vnorm(toW(-Math.cos(th), -Math.sin(th), 0));
      const arcT = (th) => vnorm(toW(-Math.sin(th), Math.cos(th), 0));
      const n0 = inw(th0), n1 = inw(th1);
      const v0 = R * th0 * k, v1 = R * th1 * k;
      const tanA = vnorm(along);
      const sgnOf = (n, b) => (vdot(vcross(n, tanA), b) >= 0 ? 1 : -1);
      // corners: c0=(th0,t0) c1=(th0,t1) c2=(th1,t1) c3=(th1,t0)  (U = along, V = arc)
      const ex = {
        vn: [n0, n0, n1, n1],
        tuv: [[a.t0, v0], [a.t1, v0], [a.t1, v1], [a.t0, v1]],
        tan: [[...tanA, sgnOf(n0, arcT(th0))], [...tanA, sgnOf(n0, arcT(th0))], [...tanA, sgnOf(n1, arcT(th1))], [...tanA, sgnOf(n1, arcT(th1))]],
      };
      const want = vnorm(vadd(n0, n1));
      addRectFacing(q0, along, vsub(q1, q0), want, mat, 0, ex);
    }
    for (const [tp, f] of [[a.t0, -1], [a.t1, 1]]) {
      const toW2 = (s, y) => toW(s, y, tp);
      const want = a.axis === 'z' ? [0, 0, f] : [f, 0, 0];
      quadrantFans([a.c, a.spring], R, 0, Math.PI / 2, [a.c + R, a.spring + R], N / 2, toW2, want, mat);
      quadrantFans([a.c, a.spring], R, Math.PI / 2, Math.PI, [a.c - R, a.spring + R], N / 2, toW2, want, mat);
    }
  }
}

function tubeAlong(path, r, sides, mat, flags) {
  // frames along a polyline; each ring-to-ring side is one (nearly planar) patch
  const rings = [];
  let n1 = null;
  for (let i = 0; i < path.length; i++) {
    const a = path[Math.max(0, i - 1)], b = path[Math.min(path.length - 1, i + 1)];
    const t = vnorm(vsub(b, a));
    if (!n1) n1 = vnorm(vcross(t, Math.abs(t[1]) < 0.9 ? [0, 1, 0] : [1, 0, 0]));
    n1 = vnorm(vsub(n1, vscl(t, vdot(n1, t))));   // parallel transport keeps the tube from twisting
    const n2 = vcross(t, n1);
    const ring = [];
    for (let k = 0; k <= sides; k++) { const ang = (2 * Math.PI * k) / sides; ring.push(vadd(vscl(n1, Math.cos(ang)), vscl(n2, Math.sin(ang)))); }
    rings.push(ring);
  }
  for (let i = 0; i < path.length - 1; i++) for (let k = 0; k < sides; k++) {
    const o = vadd(path[i], vscl(rings[i][k], r)), p1 = vadd(path[i], vscl(rings[i][k + 1], r)), p3 = vadd(path[i + 1], vscl(rings[i + 1][k], r));
    const ex = { vn: [rings[i][k], rings[i][k + 1], rings[i + 1][k + 1], rings[i + 1][k]], tuv: [[0, 0], [1, 0], [1, 1], [0, 1]], tan: null };
    addRectFacing(o, vsub(p1, o), vsub(p3, o), vnorm(vadd(rings[i][k], rings[i][k + 1])), mat, flags, ex);
  }
}
function meshLadders() {
  for (const [x, z, dy, dx, dz, depth] of shapes.ladders) {
    const side = [-dz, 0, dx];
    const P = (h, v, s) => [x + dx * h + side[0] * s, dy + v, z + dz * h + side[2] * s];
    for (const s of [-0.28, 0.28]) {
      const path = [];
      path.push(P(0.16, -depth, s), P(0.16, -depth * 0.5, s), P(0.16, 0.2, s), P(0.16, 0.5, s));
      for (let i = 1; i < 8; i++) { const a = (Math.PI * i) / 8; path.push(P(-0.1 + 0.26 * Math.cos(a), 0.5 + 0.26 * Math.sin(a), s)); }
      path.push(P(-0.36, 0.5, s), P(-0.36, 0.25, s), P(-0.36, 0.0, s));
      tubeAlong(path, 0.024, 8, MAT.STEEL, PF_ANALYTIC);
    }
    for (let k = 1; k <= 3; k++) {
      const v = -0.3 * k;
      if (v < -depth + 0.15) break;
      tubeAlong([P(0.12, v, -0.28), P(0.12, v, 0.28)], 0.016, 6, MAT.STEEL, PF_ANALYTIC);
    }
  }
}

function addBox(x0, y0, z0, x1, y1, z1, mat, flags) {
  const L = x1 - x0, H = y1 - y0, D = z1 - z0;
  addPatch([x0, y1, z0], [0, 0, D], [L, 0, 0], mat, flags);            // top    (+y)
  addPatch([x1, y0, z0], [0, H, 0], [0, 0, D], mat, flags);            // +x
  addPatch([x0, y0, z0], [0, 0, D], [0, H, 0], mat, flags);            // -x
  addPatch([x0, y0, z1], [L, 0, 0], [0, H, 0], mat, flags);            // +z
  addPatch([x0, y0, z0], [0, H, 0], [L, 0, 0], mat, flags);            // -z
  SOLIDS.push([x0, y0, z0, x1, y1, z1]);
}

// a sparse, hazy horizon of tiled monoliths standing in the endless shallow sea
function buildHorizon() {
  const rnd = mulberry32(7331);
  const F = PF_ANALYTIC, W = MAT.WHITE;
  const spots = [];
  for (let i = 0; i < 44; i++) {
    const ang = rnd() * Math.PI * 2, r = 105 + Math.pow(rnd(), 0.8) * 1300;
    const x = Math.cos(ang) * r, z = Math.sin(ang) * r;
    if (spots.some((s) => Math.hypot(s[0] - x, s[1] - z) < 40 + r * 0.06)) continue;
    spots.push([x, z]);
    const far = clamp((r - 100) / 1300, 0, 1), kind = rnd();
    if (kind < 0.42) {
      const w = 3 + rnd() * 5, d = 3 + rnd() * 5, h = 14 + rnd() * (25 + 60 * far);
      addBox(x - w / 2, 0, z - d / 2, x + w / 2, h, z + d / 2, W, F);
    } else if (kind < 0.66) {
      const span = 10 + rnd() * 12, h = 12 + rnd() * 16, t = 2 + rnd() * 1.5, rot = rnd() < 0.5;
      const P = (a, b, c, e, f, g) => (rot ? addBox(x + c, b, z + a, x + g, e, z + f, W, F) : addBox(x + a, b, z + c, x + f, e, z + g, W, F));
      P(-span / 2 - t, 0, -t / 2, -span / 2, h, t / 2);
      P(span / 2, 0, -t / 2, span / 2 + t, h, t / 2);
      P(-span / 2 - t, h, -t / 2, span / 2 + t, h + t, t / 2);
    } else if (kind < 0.86) {
      const n = 4 + Math.floor(rnd() * 8), bay = 6 + rnd() * 4, h = 6 + rnd() * 8, open = h * 0.62, rot = rnd() < 0.5;
      const P = (a, b, c, e, f, g) => (rot ? addBox(x + c, b, z + a, x + g, e, z + f, W, F) : addBox(x + a, b, z + c, x + f, e, z + g, W, F));
      const len = n * bay;
      for (let k = 0; k <= n; k++) P(-len / 2 + k * bay - 0.9, 0, -1, -len / 2 + k * bay + 0.9, open, 1);
      P(-len / 2 - 0.9, open, -1, len / 2 + 0.9, h, 1);
    } else {
      const steps = 5 + Math.floor(rnd() * 6), s0 = 14 + rnd() * 18, sh = 1.6 + rnd() * 1.8;
      for (let k = 0; k < steps; k++) {
        const hw = s0 * (1 - k / steps) / 2;
        addBox(x - hw, k * sh, z - hw, x + hw, (k + 1) * sh, z + hw, W, F);
      }
    }
  }
  // endless tiled sea floor around the voxel grid
  const E = 3200, g0 = GRID_MIN[0], g1 = GRID_MAX[0], h0 = GRID_MIN[2], h1 = GRID_MAX[2];
  const floorRect = (x0, z0, x1, z1) => addPatch([x0, 0, z0], [0, 0, z1 - z0], [x1 - x0, 0, 0], W, F);
  floorRect(-E, -E, E, h0);
  floorRect(-E, h1, E, E);
  floorRect(-E, h0, g0, h1);
  floorRect(g1, h0, E, h1);
}

function buildPatches() {
  meshVoxels();
  meshColumns();
  meshTubes();
  meshArches();
  meshLadders();
  buildHorizon();
}

// ───────────────────────────── BVH (multiple threaded BVH, 6 orderings) ─────────────────────────────
// Stackless traversal for WebGL: each node stores a miss link; the child order is pre-baked
// for each dominant ray direction (±x, ±y, ±z) so traversal is near-first without a stack.
const NODE_TEX_W = 2048, PATCH_TEX_W = 2048, PATCH_TEXELS = 8;

function patchBounds(p) {
  const pts = [p.o, vadd(p.o, p.U), vadd(p.o, p.V)];
  if (!(p.flags & PF_TRI)) pts.push(vadd(vadd(p.o, p.U), p.V));
  const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
  for (const q of pts) for (let k = 0; k < 3; k++) { mn[k] = Math.min(mn[k], q[k]); mx[k] = Math.max(mx[k], q[k]); }
  for (let k = 0; k < 3; k++) { mn[k] -= 1e-3; mx[k] += 1e-3; }
  return [mn, mx];
}

function buildBVH() {
  const N = patches.length;
  const bmn = new Float32Array(N * 3), bmx = new Float32Array(N * 3), cen = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) {
    const [mn, mx] = patchBounds(patches[i]);
    for (let k = 0; k < 3; k++) { bmn[i * 3 + k] = mn[k]; bmx[i * 3 + k] = mx[k]; cen[i * 3 + k] = (mn[k] + mx[k]) * 0.5; }
  }
  const idx = new Int32Array(N); for (let i = 0; i < N; i++) idx[i] = i;
  const nodes = []; // {mn, mx, l, r, start, count, c}
  const BINS = 16, MAXLEAF = 4;
  const area = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], dz = b[2] - a[2]; return 2 * (dx * dy + dy * dz + dz * dx); };

  function build(start, end, depth) {
    const mn = [Infinity, Infinity, Infinity], mx = [-Infinity, -Infinity, -Infinity];
    const cmn = [Infinity, Infinity, Infinity], cmx = [-Infinity, -Infinity, -Infinity];
    for (let i = start; i < end; i++) {
      const p = idx[i];
      for (let k = 0; k < 3; k++) {
        mn[k] = Math.min(mn[k], bmn[p * 3 + k]); mx[k] = Math.max(mx[k], bmx[p * 3 + k]);
        cmn[k] = Math.min(cmn[k], cen[p * 3 + k]); cmx[k] = Math.max(cmx[k], cen[p * 3 + k]);
      }
    }
    const node = { mn, mx, l: -1, r: -1, start, count: end - start, c: [(mn[0] + mx[0]) / 2, (mn[1] + mx[1]) / 2, (mn[2] + mx[2]) / 2] };
    const id = nodes.length; nodes.push(node);
    const n = end - start;
    if (n <= MAXLEAF || depth > 40) return id;
    // binned SAH
    let best = Infinity, bestAxis = -1, bestSplit = 0;
    for (let ax = 0; ax < 3; ax++) {
      const ext = cmx[ax] - cmn[ax];
      if (ext < 1e-6) continue;
      const cnt = new Int32Array(BINS), bmin = [], bmax = [];
      for (let b = 0; b < BINS; b++) { bmin.push([Infinity, Infinity, Infinity]); bmax.push([-Infinity, -Infinity, -Infinity]); }
      for (let i = start; i < end; i++) {
        const p = idx[i];
        let b = Math.floor(((cen[p * 3 + ax] - cmn[ax]) / ext) * BINS); if (b >= BINS) b = BINS - 1;
        cnt[b]++;
        for (let k = 0; k < 3; k++) { bmin[b][k] = Math.min(bmin[b][k], bmn[p * 3 + k]); bmax[b][k] = Math.max(bmax[b][k], bmx[p * 3 + k]); }
      }
      const la = new Float64Array(BINS), lc = new Int32Array(BINS);
      let amn = [Infinity, Infinity, Infinity], amx = [-Infinity, -Infinity, -Infinity], c = 0;
      for (let b = 0; b < BINS - 1; b++) {
        c += cnt[b];
        for (let k = 0; k < 3; k++) { amn[k] = Math.min(amn[k], bmin[b][k]); amx[k] = Math.max(amx[k], bmax[b][k]); }
        lc[b] = c; la[b] = c ? area(amn, amx) : 0;
      }
      amn = [Infinity, Infinity, Infinity]; amx = [-Infinity, -Infinity, -Infinity]; c = 0;
      for (let b = BINS - 1; b > 0; b--) {
        c += cnt[b];
        for (let k = 0; k < 3; k++) { amn[k] = Math.min(amn[k], bmin[b][k]); amx[k] = Math.max(amx[k], bmax[b][k]); }
        const cost = la[b - 1] * lc[b - 1] + (c ? area(amn, amx) * c : 0);
        if (lc[b - 1] > 0 && c > 0 && cost < best) { best = cost; bestAxis = ax; bestSplit = b; }
      }
    }
    let mid;
    if (bestAxis < 0) {
      mid = (start + end) >> 1;
    } else {
      const ext = cmx[bestAxis] - cmn[bestAxis];
      let i = start, j = end - 1;
      while (i <= j) {
        const p = idx[i];
        let b = Math.floor(((cen[p * 3 + bestAxis] - cmn[bestAxis]) / ext) * BINS); if (b >= BINS) b = BINS - 1;
        if (b < bestSplit) i++; else { const t = idx[i]; idx[i] = idx[j]; idx[j] = t; j--; }
      }
      mid = i;
      if (mid === start || mid === end) mid = (start + end) >> 1;
    }
    node.l = build(start, mid, depth + 1);
    node.r = build(mid, end, depth + 1);
    node.count = 0;
    return id;
  }
  build(0, N, 0);

  // reorder patches to BVH leaf order
  const reordered = new Array(N);
  for (let i = 0; i < N; i++) reordered[i] = patches[idx[i]];
  for (let i = 0; i < N; i++) patches[i] = reordered[i];

  // subtree sizes
  const size = new Int32Array(nodes.length);
  (function sz(i) { const n = nodes[i]; size[i] = n.l < 0 ? 1 : 1 + sz(n.l) + sz(n.r); return size[i]; })(0);

  const NC = nodes.length;
  const data = new Float32Array(6 * NC * 8);
  for (let o = 0; o < 6; o++) {
    const ax = o >> 1, neg = o & 1;
    let w = o * NC;
    const emit = (i, miss) => {
      const n = nodes[i], at = w++, b = at * 8;

const LM = { W: 2048, H: 0, density: 0, texels: 0, indexTex: null };

    for (let i = 0; i < n; i++) { const w = Math.random() * 2 - 1; b0 = 0.997 * b0 + w * 0.029; b1 = 0.985 * b1 + w * 0.032; b2 = 0.95 * b2 + w * 0.048; d[i] = (b0 + b1 + b2 + w * 0.02) * 1.6; }
    return b;
  }
  ir(dur, bright) {
    const ctx = this.ctx, sr = ctx.sampleRate, n = Math.floor(sr * dur), b = ctx.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {
      const d = b.getChannelData(c); let lp = 0;
      for (let i = 0; i < n; i++) {
        const t = i / sr, env = Math.pow(1 - t / dur, 2.2) * Math.exp(-t * 1.2);
        const k = Math.min(0.96, 0.15 + (t / dur) * (1.4 - bright));
        lp = lp * k + (Math.random() * 2 - 1) * (1 - k);
        d[i] = lp * env * (t < 0.012 ? t / 0.012 : 1);
      }
      for (let e = 0; e < 7; e++) { const at = Math.floor(sr * (0.012 + Math.random() * 0.07)); d[at] += (Math.random() - 0.5) * 0.6; }
    }
    return b;
  }
  burst(t0, { dur, f0, f1, q, gain, type = 'bandpass', wet = 0.6, pan = 0 }) {
    const ctx = this.ctx, s = ctx.createBufferSource();
    s.buffer = this.noiseShort || (this.noiseShort = this.noiseBuf(1.2));
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.Q.value = q;
    fl.frequency.setValueAtTime(f0, t0); fl.frequency.exponentialRampToValueAtTime(Math.max(40, f1), t0 + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + Math.min(0.012, dur * 0.2)); g.gain.exponentialRampToValueAtTime(0.0008, t0 + dur);
    const p = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    s.connect(fl); fl.connect(g);
    let out = g; if (p) { p.pan.value = pan; g.connect(p); out = p; }
    out.connect(this.dry); const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(this.send);
    s.start(t0, Math.random() * 0.8); s.stop(t0 + dur + 0.05);
  }
  tone(t0, { f0, f1, dur, gain, wet = 0.7, node = null }) {
    const ctx = this.ctx, o = ctx.createOscillator(); o.type = 'sine';
    o.frequency.setValueAtTime(f0, t0); o.frequency.exponentialRampToValueAtTime(f1, t0 + dur);
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(gain, t0 + 0.004); g.gain.exponentialRampToValueAtTime(0.0005, t0 + dur);
    o.connect(g);
    const out = node || g;
    if (node) g.connect(node);
    out.connect(this.dry); const w = ctx.createGain(); w.gain.value = wet; out.connect(w); w.connect(this.send);
    o.start(t0); o.stop(t0 + dur + 0.05);
  }
  footstep(e) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime + 0.005, pan = (Math.random() - 0.5) * 0.25, sp = clamp(e.speed / 1.45, 0.4, 1.8);
    if (e.climb) { this.burst(t, { dur: 0.7, f0: 1400, f1: 300, q: 0.6, gain: 0.22, wet: 0.5 }); return; }
    if (e.swim) { this.burst(t, { dur: 0.55, f0: 900, f1: 260, q: 0.5, gain: 0.07 * sp, type: 'lowpass', wet: 0.5, pan }); return; }
    if (e.depth > 0.5) {
      this.burst(t, { dur: 0.42, f0: 900, f1: 260, q: 0.7, gain: 0.09 * sp, wet: 0.55, pan });
      this.burst(t + 0.06, { dur: 0.3, f0: 2200, f1: 600, q: 0.9, gain: 0.03 * sp, wet: 0.6, pan });
    } else if (e.depth > 0.02) {
      this.burst(t, { dur: 0.2, f0: 2600, f1: 700, q: 0.8, gain: 0.075 * sp, wet: 0.6, pan });
      this.tone(t + 0.01, { f0: 340 + Math.random() * 80, f1: 160, dur: 0.07, gain: 0.025 * sp, wet: 0.5 });
    } else {
      this.burst(t, { dur: 0.05, f0: 1900 + Math.random() * 500, f1: 900, q: 1.3, gain: 0.05 * sp, wet: 0.75, pan });
      this.tone(t, { f0: 110, f1: 70, dur: 0.06, gain: 0.05 * sp, wet: 0.3 });
    }
  }
  drip(rel) {
    const ctx = this.ctx, t = ctx.currentTime + 0.01;
    const pn = ctx.createPanner(); pn.panningModel = 'HRTF'; pn.distanceModel = 'inverse'; pn.refDistance = 2; pn.rolloffFactor = 0.9;
    if (pn.positionX) { pn.positionX.value = rel[0]; pn.positionY.value = rel[1]; pn.positionZ.value = rel[2]; } else pn.setPosition(rel[0], rel[1], rel[2]);
    const f = 1500 + Math.random() * 1300;
    this.tone(t, { f0: f, f1: f * 0.55, dur: 0.09, gain: 0.05, wet: 1.4, node: pn });
    this.tone(t + 0.035, { f0: f * 1.6, f1: f * 1.1, dur: 0.05, gain: 0.012, wet: 1.4, node: pn });
  }
  update(dt, cam, player, zone, outdoor) {
    const ctx = this.ctx; if (!ctx) return;
    const t = ctx.currentTime; // emitters are placed in listener space, so the listener stays at its default pose
    const under = player.headUnder;
    const size = zone ? zone.size : 0.0, wet = zone ? zone.reverb : 0.12;
    const tc = 0.6;
    this.hallG.gain.setTargetAtTime(wet * size * 0.9, t, tc);
    this.roomG.gain.setTargetAtTime(wet * (1 - size) * 0.8 + (outdoor ? 0.03 : 0), t, tc);
    this.lp.frequency.setTargetAtTime(under ? 420 : 16000, t, under ? 0.05 : 0.25);
    this.rumble.g.gain.setTargetAtTime(under ? 0.35 : 0, t, 0.2);
    this.air.g.gain.setTargetAtTime(outdoor ? 0.02 : 0.05, t, 1.0);
    this.wind.g.gain.setTargetAtTime(outdoor ? 0.05 : 0.0, t, 1.5);
    this.hum.gain.setTargetAtTime(zone && (zone.name === 'nightpool' || zone.name === 'tube' || zone.name === 'chamber') ? 0.0035 : 0.0008, t, 1.5);
    this.lapPhase += dt * (0.35 + Math.sin(t * 0.13) * 0.1);
    const lapA = 0.018 + 0.016 * Math.max(0, Math.sin(this.lapPhase * 2.1) * Math.sin(this.lapPhase * 0.77 + 1.3));
    this.lap.g.gain.setTargetAtTime(lapA * (outdoor ? 0.6 : 1), t, 0.3);
    this.lap.fl.frequency.setTargetAtTime(420 + 260 * Math.sin(this.lapPhase * 1.3), t, 0.4);
    this.wind.fl.frequency.setTargetAtTime(330 + 150 * Math.sin(t * 0.21), t, 1.0);
    this.nextDrip -= dt;
    if (this.nextDrip <= 0) {
      this.nextDrip = (outdoor ? 9 : 2.2) + Math.random() * (outdoor ? 14 : 5.5);
      const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 11;
      const wx = cam.position.x + Math.cos(a) * r, wz = cam.position.z + Math.sin(a) * r;
      const wl = waterLevelAt(wx, cam.position.y - EYE, wz);
      if (wl !== null && !solidAt(wx, wl + 0.05, wz) && !outdoor) {
        const rel = new THREE.Vector3(wx, wl, wz).sub(cam.position).applyQuaternion(cam.quaternion.clone().invert());
        this.drip([rel.x, rel.y, rel.z]);
        if (this.onDrip) this.onDrip(wx, wz, wl);
      }
    }
  }
}

// ───────────────────────────── boot & loop ─────────────────────────────
async function main() {
  const canvas = document.getElementById('view');
  const veil = document.getElementById('veil'), keysEl = document.getElementById('keys');
  let gl;
  try {
    gl = new THREE.WebGLRenderer({ canvas, antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance', preserveDrawingBuffer: DEBUG });
  } catch (e) { setStatus('此浏览器无法启用 WebGL 2'); return; }
  if (!gl.capabilities.isWebGL2 || !gl.extensions.has('EXT_color_buffer_float')) { setStatus('需要支持 WebGL 2 浮点渲染的浏览器'); return; }
  gl.setPixelRatio(1);
  gl.autoClear = false;

  const tick = DEBUG ? () => Promise.resolve() : nextFrame;
  const t0 = performance.now();
  const prof = {};
  const timed = (name, f) => { const s = performance.now(); const r = f(); prof[name] = Math.round(performance.now() - s); return r; };
  setStatus('正在铺设瓷砖'); await tick();
  timed('level', buildLevel);
  timed('voxelMesh', meshVoxels);
  timed('shapes', () => { meshColumns(); meshTubes(); meshArches(); meshLadders(); buildHorizon(); });
  setStatus('正在测量空间'); await tick();
  const bvh = timed('bvh', buildBVH);
  timed('atlas', packAtlas);
  const patchTex = timed('pack', packPatches);
  const geometry = timed('raster', buildRasterGeometry);
  console.log('[poolrooms] cpu', prof);
  SU.uNodes.value = bvh.tex; SU.uNodeCount.value = bvh.nodeCount; SU.uPatches.value = patchTex;
  SU.uLMSize.value.set(LM.W, LM.H);
  const stats = { patches: patches.length, nodes: bvh.nodeCount, lm: `${LM.W}x${LM.H}`, density: LM.density.toFixed(2), cpuMs: Math.round(performance.now() - t0) };
  console.log('[poolrooms]', stats);

  const fitSize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 1.25);
    let w = Math.max(320, Math.floor(canvas.clientWidth * dpr)), h = Math.max(200, Math.floor(canvas.clientHeight * dpr));
    gl.setSize(w, h, false);
    const cap = 1920 * 1080 * 1.05, px = w * h;
    const k = px > cap ? Math.sqrt(cap / px) : 1;
    return [w * k, h * k];
  };
  setStatus('正在投下阳光'); await tick();
  const shadows = renderShadowMaps(gl, geometry);
  SU.uShadow.value = shadows[0].tex; SU.uShadowM.value.copy(shadows[0].M);
  SU.uShadow2.value = shadows[1].tex; SU.uShadowM2.value.copy(shadows[1].M);
  computeSkyLight(gl);
  const fr = new FrameRenderer(gl, geometry);
  const sc = shadows[0].cam;
  fr.mainMat.uniforms.uShInfo.value.set(1 / shadows[0].tex.image.width, shadows[0].texel, sc.far - sc.near, 0);
  const baker = new Baker(gl);
  const ripples = new Ripples(gl);
  const player = new Player();
  const audio = new Ambience();
  player.onStep = (e) => audio.footstep(e);
  player.onRipple = (x, z, s, wl) => ripples.add(x, z, s, wl);
  audio.onDrip = (x, z, wl) => ripples.add(x, z, 1.4, wl);

  const camParam = /[?&]cam=([-\d.,]+)/.exec(location.search);
  if (camParam) {
    const v = camParam[1].split(',').map(Number);
    player.pos.set(v[0], v[1], v[2]); player.camY = v[1] + EYE;
    if (v.length > 3) player.yaw = v[3]; if (v.length > 4) player.pitch = v[4];
  }
  window.__pool = { player, fr, baker, LM, patches, stats, ripples, audio, SU, VOL, WATERU, THREE };

  // GI: run the propagation phase before revealing the world
  // batches are paced by GPU fences, so the bake neither stalls the page nor waits on display refresh
  const glc = gl.getContext();
  let batch = 4;
  while (baker.iter < baker.PHASE1) {
    const s0 = performance.now();
    baker.runTiles(batch);
    const sync = glc.fenceSync(glc.SYNC_GPU_COMMANDS_COMPLETE, 0);
    glc.flush();
    if (DEBUG) glc.finish();
    else while (glc.clientWaitSync(sync, 0, 0) === glc.TIMEOUT_EXPIRED) await new Promise((r) => setTimeout(r, 3));
    glc.deleteSync(sync);
    const ms = performance.now() - s0;
    batch = ms < 60 ? Math.min(batch + 2, 64) : Math.max(1, batch - 2);
    setStatus(`正在计算光照  ${Math.min(99, Math.round(baker.progress * 100))}%`);
  }
  stats.bakeMs = Math.round(performance.now() - t0);
  console.log('[poolrooms] ready', stats);

  // ── interaction
  let active = false, locked = false, dragLook = false, fade = 0, started = false;
  const showVeil = (text) => { setStatus(text); keysEl.hidden = false; veil.classList.remove('gone'); };
  const hideVeil = () => veil.classList.add('gone');
  veil.classList.remove('boot');
  showVeil('点击进入');
  const enter = () => {
    audio.start();
    started = true;
    try {
      const p = canvas.requestPointerLock && canvas.requestPointerLock();
      if (p && p.catch) p.catch(() => { dragLook = true; active = true; hideVeil(); });
    } catch (e) { dragLook = true; }
    if (!canvas.requestPointerLock) dragLook = true;
    if (dragLook) { active = true; hideVeil(); }
  };
  veil.addEventListener('click', enter);
  window.__pool.enter = () => { started = true; active = true; dragLook = true; fade = 1; hideVeil(); };
  window.__pool.prof = prof;
  document.addEventListener('pointerlockchange', () => {
    locked = document.pointerLockElement === canvas;
    if (locked) { active = true; dragLook = false; hideVeil(); }
    else if (!dragLook) { active = false; player.keys.clear(); showVeil('点击继续'); }
  });
  document.addEventListener('pointerlockerror', () => { dragLook = true; active = true; hideVeil(); });
  document.addEventListener('mousemove', (e) => {
    if (locked) player.look(e.movementX || 0, e.movementY || 0);
    else if (dragLook && (e.buttons & 1)) player.look((e.movementX || 0) * 1.4, (e.movementY || 0) * 1.4);
  });
  canvas.addEventListener('mousedown', () => { if (started && !locked && !dragLook) enter(); });
  const blockKeys = new Set(['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight']);
  window.addEventListener('keydown', (e) => {
    if (blockKeys.has(e.code)) e.preventDefault();
    if (e.code === 'KeyF' && !e.repeat) {
      try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (err) { /* optional */ }
    }
    if (active) player.key(e.code, true);
  });
  window.addEventListener('keyup', (e) => player.key(e.code, false));
  window.addEventListener('blur', () => player.keys.clear());

  // ── frame loop with gentle dynamic resolution
  let scale = 1, slow = 0, fast = 0, prev = performance.now(), avg = 16, time = 0, settle = 0;
  const applySize = () => { const [w, h] = fitSize(); fr.resize(Math.max(160, Math.round(w * scale)), Math.max(90, Math.round(h * scale))); };
  applySize();
  window.addEventListener('resize', applySize);
  const step = (dt) => {
    time += dt;
    avg += (dt * 1000 - avg) * 0.05;
    if (active) player.update(dt);
    player.applyCamera(fr.camera, time);
    SU.uTime.value = time;
    const wl = waterLevelAt(player.pos.x, player.pos.y, player.pos.z);
    ripples.update(dt, player.pos.x, player.pos.z, wl);
    if (!baker.done) baker.runTiles(avg < 20 ? 2 : 1);
    if (started) fade = Math.min(1, fade + dt / 2.5); else fade = Math.min(0.55, fade + dt / 3);
    fr.render(dt, fade);
    const zn = zoneAt(fr.camera.position.x, fr.camera.position.y, fr.camera.position.z);
    audio.update(dt, fr.camera, player, zn, !zn);
    // resolution governor (ignores the bake period)
    settle += dt;
    if (!DEBUG && baker.done && settle > 2) {
      if (avg > 24) slow += dt; else slow = 0;
      if (avg < 13) fast += dt; else fast = 0;
      if (slow > 1.5 && fr.reflScale > 0.5) { fr.reflScale = 0.5; slow = 0; settle = 0; fr.resize(fr.W, fr.H, true); }
      else if (slow > 1.5 && scale > 0.5) { scale = Math.max(0.5, scale * 0.85); slow = 0; settle = 0; applySize(); }
      if (fast > 4 && scale < 1) { scale = Math.min(1, scale * 1.1); fast = 0; settle = 0; applySize(); }
    }
    stats.fps = Math.round(1000 / avg); stats.scale = scale; stats.res = `${fr.W}x${fr.H}`; stats.bake = baker.iter;
  };
  const loop = () => {
    const now = performance.now();
    const dt = Math.min((now - prev) / 1000, 0.1); prev = now;
    step(dt);
    requestAnimationFrame(loop);
  };
  window.__pool.frame = (n = 1, dt = 1 / 60) => { for (let i = 0; i < n; i++) step(dt); gl.getContext().finish(); };
  if (DEBUG) {
    window.__L = () => { const px = new Float32Array(4); gl.readRenderTargetPixels(fr.expRT[fr.expCur], 0, 0, 1, 1, px); return +Math.pow(2, px[0]).toFixed(4); };
    window.__bake = (n) => { const g = gl.getContext(); while (baker.iter < n && !baker.done) { baker.runTiles(16); g.finish(); } return baker.iter; };
    window.__shot = async (x, y, z, yaw, pitch, n = 60) => {
      const p = player; p.pos.set(x, y, z); p.camY = y + EYE; p.yaw = yaw; p.pitch = pitch; p.vel.set(0, 0, 0);
      fr.reset = true; fr.expInit = 2; window.__pool.enter(); window.__pool.frame(n);
      await new Promise((r) => setTimeout(r, 500)); window.__pool.frame(1);
      return window.__L();
    };
  }
  requestAnimationFrame(loop);
}
main().catch((e) => { console.error(e); setStatus('启动失败：' + (e && e.message ? e.message : e)); });
</script>
