function makeBeam(scene, lh) {
  const L = 95, geo = new THREE.CylinderGeometry(12, 0.5, L, 28, 1, true);
  geo.rotateZ(-Math.PI / 2); geo.translate(L / 2, 0, 0);
  const mat = new THREE.ShaderMaterial({
    uniforms: Object.assign({ uAmt: { value: 0 }, uL: { value: L } }, sharedUniforms()),
    vertexShader: /* glsl */`varying vec3 vP; varying vec3 vN; varying float vD; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vP = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vD = position.x; gl_Position = projectionMatrix * viewMatrix * w; }`,
    fragmentShader: /* glsl */`
      ${GLSL_UNI}${GLSL_FUNCS}
      uniform float uAmt; uniform float uL; varying vec3 vP; varying vec3 vN; varying float vD;
      void main(){
        float rc = bottleR(vP.x); if (dot(vP.yz, vP.yz) > rc * rc) discard;
        vec3 V = normalize(cameraPosition - vP);
        float rim = pow(abs(dot(normalize(vN), V)), 1.3);
        // Interpolation can put vD slightly past uL at the tip. A negative
        // base makes pow return NaN, which bloom spreads into black blocks.
        float fall = pow(clamp(1.0 - vD / uL, 0.0, 1.0), 1.6);
        float a = rim * fall * uAmt;
        gl_FragColor = vec4(vec3(1.0, 0.93, 0.72) * a * 1.8, a);
      }`,
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide,
  });
  const piv = new THREE.Group(); piv.position.set(lh.x, lh.y, lh.z);
  const m1 = new THREE.Mesh(geo, mat), m2 = new THREE.Mesh(geo, mat); m2.rotation.y = Math.PI;
  for (const m of [m1, m2]) { m.layers.set(1); m.renderOrder = 9; m.frustumCulled = false; piv.add(m); }
  scene.add(piv);
  const spot = new THREE.SpotLight(0xfff0c0, 0, 110, 0.2, 0.9, 1.2);
  spot.position.set(lh.x, lh.y, lh.z); scene.add(spot, spot.target);
  const lamp = new THREE.PointLight(0xffe8a0, 0, 46, 2); lamp.position.set(lh.x, lh.y, lh.z); scene.add(lamp);
  return {
    update(dt, t, night) {
      const ang = t * 0.9; piv.rotation.y = ang;
      const amt = clamp(0.12 + night * 1.1 + GAME.storm * 0.5, 0, 1.3);
      mat.uniforms.uAmt.value = amt * 0.5;
      spot.target.position.set(lh.x + Math.cos(ang) * 40, lh.y - 8, lh.z - Math.sin(ang) * 40);
      spot.intensity = (night * 1500 + 40 * GAME.storm * 20);
      lamp.intensity = night * 220 + 20;
    },
  };
}

function makeCloudVox(seed, nPuffs, spanX) {
  seedRng(seed);
  const v = new Vox(-14, -6, -9, 14, 7, 9);
  const base = -2;
  for (let k = 0; k < nPuffs; k++) {
    const t = k / (nPuffs - 1) - 0.5;
    const cx = t * spanX + (rnd() - 0.5) * 2, cy = base + 1.5 + (1 - Math.abs(t) * 1.6) * (1.5 + rnd() * 2.2), cz = (rnd() - 0.5) * 6;
    const rx = 3 + rnd() * 2.8, ry = 2 + rnd() * 2, rz = 3 + rnd() * 2.2;
    v.ell(cx, cy, cz, rx, ry, rz, (x, y, z) => {
      const f = clamp((y - base) / 6, 0, 1);
      return jit(mixc(0xc4d3e6, 0xffffff, Math.pow(f, 0.8)), 0.025, x, y, z);
    });
  }
  v.boxDel(-14, -6, -9, 14, base - 1, 9);               // flat bottoms
  // soften the underside: re-add a thin darker base layer
  for (let x = -14; x <= 14; x++) for (let z = -9; z <= 9; z++) if (v.has(x, base, z)) v.set(x, base, z, jit(0xa9bad0, 0.03, x, base, z));
  return v;
}

function makeSunVox() {
  const v = new Vox(-5, -5, -5, 5, 5, 5);
  v.ball(0, 0, 0, 3.6, (x, y, z) => mixc(0xffe27a, 0xfff6c8, 1 - Math.hypot(x, y, z) / 4), 7);
  return v;
}
function makeMoonVox() {
  const v = new Vox(-5, -5, -5, 5, 5, 5);
  v.ball(0, 0, 0, 3.4, (x, y, z) => { const c = ihash(x, y, z) > 0.86 ? 0xa9b3c8 : 0xdfe6f2; return c; }, 6);
  for (let i = 0; i < 5; i++) { const a = rnd() * TAU, b = rnd() * 0.8 + 0.2; v.set(Math.cos(a) * 2.6 * b, Math.sin(a) * 2.6 * b, 3, 0x9aa5bc, 6); v.set(Math.cos(a) * 2.6 * b + 1, Math.sin(a) * 2.6 * b, 3, 0x9aa5bc, 6); }
  return v;
}

function makeBalloonVox() {
  const v = new Vox(-8, -13, -8, 8, 10, 8);
  const pal = [0xe84a5f, 0xffd447, 0xf7f3e8, 0x2ec4b6, 0xe84a5f, 0xff9f1c];
  v.ell(0, 3, 0, 5.4, 6.6, 5.4, (x, y, z) => { const a = Math.floor((Math.atan2(z, x) + Math.PI) / (TAU / 12)); return jit(pal[a % pal.length], 0.03, x, y, z); });
  v.ellDel(0, -4.6, 0, 3.6, 3.0, 3.6);                                  // taper the bottom of the envelope into a skirt
  for (let a = 0; a < 360; a += 20) { const t = a * Math.PI / 180; v.set(Math.cos(t) * 2.2, -2.5, Math.sin(t) * 2.2, 0x6a4a2c); }
  for (const [dx, dz] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) v.line(dx * 2.0, -2.6, dz * 2.0, dx * 1.3, -8.2, dz * 1.3, 0x3a2c20);
  for (let x = -2; x <= 2; x++) for (let z = -2; z <= 2; z++) { const edge = Math.abs(x) === 2 || Math.abs(z) === 2; v.put(x, -10, z, 0x8a5a33); if (edge) { v.put(x, -9, z, jit(0xb0804a, 0.08, x, 0, z)); v.put(x, -8, z, 0x8a5a33); } }
  v.set(0, -6, 0, 0xffb347, 7); v.set(0, -5, 0, 0xffe08a, 7);          // burner flame
  return v;
}

    const t = rnd(); const c = t < 0.15 ? [1.0, 0.8, 0.55] : t < 0.4 ? [0.7, 0.82, 1.0] : [1, 1, 1];
    col.set(c, i * 3); siz[i] = 1.2 + rnd() * rnd() * 3.2; ph[i] = rnd() * 6.28;

  sg.setAttribute('aSize', new THREE.BufferAttribute(siz, 1)); sg.setAttribute('aPh', new THREE.BufferAttribute(ph, 1));

      varying vec3 vC; varying float vA;
      void main(){

// ---------------------------------------------------------------------------
// Sea serpent: surfaces when the weather turns. A chain of grid-snapped voxel blocks riding a travelling
// sine wave; humps that break the surface leave wakes and spray, and it dives away from the ship.
// ---------------------------------------------------------------------------
class Serpent {
  constructor(scene) {
    this.N = 30;
    const box = new THREE.BoxGeometry(1, 1, 1);
    box.setAttribute('aFx', new THREE.BufferAttribute(new Float32Array(24 * 2), 2));
    const mat = makeVoxMat({ noVC: true, clip: true, uw: true });
    this.mesh = new THREE.InstancedMesh(box, mat, this.N + 12);
    this.mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array((this.N + 12) * 3).fill(1), 3);
    this.mesh.frustumCulled = false; this.mesh.castShadow = true; this.mesh.count = 0;
    this.mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(this.mesh);
    this.u = 1.6; this.vis = 0; this.ph = 0; this.dive = 0; this.x0 = 0; this.z0 = 0;
    this.pos = new Float32Array(this.N * 3);
    // body colours: teal -> deep green with a pale belly stripe pattern
    const c = this.mesh.instanceColor.array;
    for (let i = 0; i < this.N; i++) {
      const f = i / this.N, base = mixc(0x35c2b0, 0x1d7a4e, f), col = i % 2 ? base : shade(base, 1.22);
      c[i * 3] = SRGB_LUT[cR(col)]; c[i * 3 + 1] = SRGB_LUT[cG(col)]; c[i * 3 + 2] = SRGB_LUT[cB(col)];
    }
  }
  curve(a, out) {                                    // the serpent's patrol: a wide ellipse around the sea
    out.x = -8 + Math.cos(a) * 25; out.z = Math.sin(a) * 19.5;
  }
  update(dt, t) {
    const target = GAME.storm > 0.35 ? 1 : 0;
    this.vis += (target - this.vis) * Math.min(1, dt * 0.45);
    if (this.vis < 0.02) { this.mesh.count = 0; return; }
    const ship = WORLD.ship, water = WORLD.water, fx = WORLD.fx;
    this.u -= dt * 0.1;                                // counter-clockwise against the ship's loop
    this.ph += dt * 2.6;
    // dive when the ship is close to the head
    const head = { x: 0, z: 0 }; this.curve(this.u, head);
    let wantDive = 0;
    if (ship) { const d = Math.hypot(head.x - ship.pos.x, head.z - ship.pos.z); if (d < 16) wantDive = 1; }
    this.dive += (wantDive - this.dive) * Math.min(1, dt * 1.2);
    const a = this.mesh.instanceMatrix.array, p = { x: 0, z: 0 };
    let n = 0;
    for (let i = 0; i < this.N; i++) {
      this.curve(this.u + i * 0.085, p);
      const hump = Math.sin(this.ph - i * 0.62);
      let y = SEA_Y + 0.2 + water.height(p.x, p.z) * 0.8 + hump * 2.9 - this.dive * 7.5;
      const bed = SEA_Y - water.depthAt(p.x, p.z) + 2;
      if (y < bed) y = bed;
      const size = (i === 0 ? 4.4 : lerp(3.7, 1.4, Math.pow(i / this.N, 0.8))) * this.vis;
      const x = Math.round(p.x), z = Math.round(p.z), yy = Math.round(y);
      a[n * 16] = size; a[n * 16 + 5] = size; a[n * 16 + 10] = size; a[n * 16 + 1] = a[n * 16 + 2] = a[n * 16 + 3] = a[n * 16 + 4] = a[n * 16 + 6] = a[n * 16 + 7] = a[n * 16 + 8] = a[n * 16 + 9] = a[n * 16 + 11] = 0;
      a[n * 16 + 12] = x; a[n * 16 + 13] = yy; a[n * 16 + 14] = z; a[n * 16 + 15] = 1;
      this.pos[i * 3] = x; this.pos[i * 3 + 1] = y; this.pos[i * 3 + 2] = z;
      n++;
      // dorsal spikes on every third segment
      if (i % 3 === 1 && i > 1 && n < this.N + 10) {
        const s2 = size * 0.55;
        a[n * 16] = s2; a[n * 16 + 5] = s2 * 1.6; a[n * 16 + 10] = s2; a[n * 16 + 1] = a[n * 16 + 2] = a[n * 16 + 3] = a[n * 16 + 4] = a[n * 16 + 6] = a[n * 16 + 7] = a[n * 16 + 8] = a[n * 16 + 9] = a[n * 16 + 11] = 0;
        a[n * 16 + 12] = x; a[n * 16 + 13] = yy + size * 0.8; a[n * 16 + 14] = z; a[n * 16 + 15] = 1;
        const c = this.mesh.instanceColor.array; c[n * 3] = 0.9; c[n * 3 + 1] = 0.75; c[n * 3 + 2] = 0.2;
        n++;
      }
      // humps that break the surface leave a wake and a little spray
      if (water && water.isWater(p.x, p.z) && y + size * 0.5 > SEA_Y && this.vis > 0.5) {
        water.splat(p.x, p.z, 0.035 * dt * 60 * hump); water.addFoam(p.x, p.z, dt * 2.2);
        if (fx && Math.random() < dt * 1.5) fx.spray(p.x, SEA_Y + 0.5, p.z, (Math.random() - 0.5) * 2, 2 + Math.random() * 2, (Math.random() - 0.5) * 2, 1, 0.45);
      }
    }
    // head details: horns and glowing eyes
    const hx = this.pos[0], hy = Math.round(this.pos[1]), hz = this.pos[2];
    const c = this.mesh.instanceColor.array;
    const nx = this.pos[3] - hx, nz = this.pos[5] - hz, nl = Math.hypot(nx, nz) || 1;
    const fxv = -nx / nl, fzv = -nz / nl, rx = -fzv, rz = fxv;           // forward & right (in the horizontal plane)
    const put = (px, py, pz, s, r, g, b) => {
      if (n >= this.N + 12) return;
      a[n * 16] = s * this.vis; a[n * 16 + 5] = s * this.vis; a[n * 16 + 10] = s * this.vis; a[n * 16 + 1] = a[n * 16 + 2] = a[n * 16 + 3] = a[n * 16 + 4] = a[n * 16 + 6] = a[n * 16 + 7] = a[n * 16 + 8] = a[n * 16 + 9] = a[n * 16 + 11] = 0;
      a[n * 16 + 12] = Math.round(px); a[n * 16 + 13] = Math.round(py); a[n * 16 + 14] = Math.round(pz); a[n * 16 + 15] = 1;
      c[n * 3] = r; c[n * 3 + 1] = g; c[n * 3 + 2] = b; n++;
    };
    for (const s of [-1, 1]) {
      put(hx + fxv * 1.6 + rx * 1.3 * s, hy + 1.6, hz + fzv * 1.6 + rz * 1.3 * s, 0.9, 1.0, 0.12, 0.08);      // eyes
      put(hx + rx * 1.0 * s - fxv * 0.4, hy + 2.7, hz + rz * 1.0 * s - fzv * 0.4, 0.8, 0.95, 0.85, 0.3);      // horns
    }
    put(hx + fxv * 2.5, hy - 0.4, hz + fzv * 2.5, 1.4, 0.2, 0.6, 0.5);                                         // snout
    this.mesh.count = n;
    this.mesh.instanceMatrix.needsUpdate = true; this.mesh.instanceColor.needsUpdate = true;
  }
}

async function buildSerpent(scene) {
  const s = new Serpent(scene);
  WORLD.serpent = s;
  updaters.push((dt, t) => s.update(dt, t));
}

// ---------------------------------------------------------------------------
// UI wiring: buttons, keyboard, click-to-splash
// ---------------------------------------------------------------------------
function setupInteraction(rig, canvas) {
  const all = (sel) => [...document.querySelectorAll(sel)];
  const timeBtns = all('[data-time]'), seaBtns = all('[data-sea]');
  const bCycle = $('#b-cycle'), bOrbit = $('#b-orbit'), bTour = $('#b-tour'), bFollow = $('#b-follow'), bFire = $('#b-fire');

  const refresh = () => {
    // highlight nearest time preset only while it is actually near
    timeBtns.forEach((b) => {
      const t = parseFloat(b.dataset.time); let d = Math.abs(((GAME.timeOfDay - t + 12) % 24 + 24) % 24 - 12);
      b.classList.toggle('on', !GAME.cycle && d < 1.2);
    });
    seaBtns.forEach((b) => b.classList.toggle('on', parseInt(b.dataset.sea, 10) === GAME.sea));
    bCycle.classList.toggle('on', GAME.cycle);
    bOrbit.classList.toggle('on', GAME.camMode === 'drift');
    bTour.classList.toggle('on', GAME.camMode === 'tour');
    bFollow.classList.toggle('on', GAME.camMode === 'follow');
  };
  timeBtns.forEach((b) => b.addEventListener('click', () => { GAME.todTarget = parseFloat(b.dataset.time); GAME.cycle = false; refresh(); }));
  bCycle.addEventListener('click', () => { GAME.cycle = !GAME.cycle; GAME.todTarget = null; refresh(); });
  seaBtns.forEach((b) => b.addEventListener('click', () => { GAME.sea = parseInt(b.dataset.sea, 10); refresh(); }));
  const setCam = (m) => { GAME.camMode = (GAME.camMode === m && m !== 'drift') ? 'drift' : m; if (GAME.camMode === 'drift') rig.idle = 0; refresh(); };
  bOrbit.addEventListener('click', () => { GAME.camMode = 'drift'; rig.idle = 3; refresh(); });
  bTour.addEventListener('click', () => setCam('tour'));
  bFollow.addEventListener('click', () => setCam('follow'));
  bFire.addEventListener('click', () => { if (WORLD.ship) WORLD.ship.fire(); });
  const bShake = $('#b-shake'); if (bShake) bShake.addEventListener('click', () => WORLD.shake && WORLD.shake());
  const bSound = $('#b-sound'); if (bSound) bSound.addEventListener('click', () => { bSound.classList.toggle('on', !!audioToggle()); });

  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.code === 'Space') { e.preventDefault(); if (WORLD.ship) WORLD.ship.fire(); }
    else if (e.key === 't' || e.key === 'T') setCam('tour');
    else if (e.key === 'f' || e.key === 'F') setCam('follow');
    else if (e.key === 'c' || e.key === 'C') { GAME.cycle = !GAME.cycle; GAME.todTarget = null; refresh(); }
    else if (e.key === '1') { GAME.sea = 0; refresh(); } else if (e.key === '2') { GAME.sea = 1; refresh(); } else if (e.key === '3') { GAME.sea = 2; refresh(); }
    else if (e.key === 'i' || e.key === 'I') { GAME.showStats = !GAME.showStats; $('#stats').textContent = ''; }
    else if (e.key === 'r' || e.key === 'R') rig.reset();
    else if (e.key === 's' || e.key === 'S') { if (WORLD.shake) WORLD.shake(); }
    else if (e.key === 'm' || e.key === 'M') { const b = $('#b-sound'); if (b) b.classList.toggle('on', !!audioToggle()); }
  });

  // click the sea: raycast to the still-water plane
  const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), -SEA_Y), hit = new THREE.Vector3();
  rig.onClick = (e) => {
    const r = canvas.getBoundingClientRect();
    ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, WORLD.camera);
    if (ray.ray.intersectPlane(plane, hit) && WORLD.water) WORLD.water.poke(hit.x, hit.z);
  };
  // keep keyboard shortcuts (Space!) from re-triggering a focused button
  document.addEventListener('click', (e) => { const b = e.target.closest && e.target.closest('button'); if (b) b.blur(); });
  refresh();
  setInterval(refresh, 500);
}

  // compile every shader variant and render a few frames behind the loading screen so the reveal is smooth
  setLoad('Compiling shaders…', 0.97); await nextFrame();
  try { if (renderer.compileAsync) await Promise.race([renderer.compileAsync(scene, camera), new Promise((r) => setTimeout(r, 9000))]); } catch (e) { /* fine: first frames will compile */ }
  for (let k = 0; k < 3; k++) { simStep(1 / 60); draw(); await nextFrame(); }
  window.__loadMs = Math.round(performance.now());
  setLoad('', 1);
  loadingEl.classList.add('done'); $('#ui').classList.add('show');
  clock.getDelta();
  if (!new URLSearchParams(location.search).has('nointro') && !new URLSearchParams(location.search).has('cam')) {
    INTRO.on = true; INTRO.t = 0; U.reveal.value = 0.04; rig.dist = rig.distG = 130; rig.el = rig.elG = 0.1; rig.az = rig.azG = 0.02;
  } else U.reveal.value = 9;
  requestAnimationFrame(frame);
}

main().catch((e) => { console.error(e); loadingMsg.textContent = 'Something went wrong: ' + (e && e.message ? e.message : e); });

</script>
<script>
(function () {
  var V = '0.160.0';
  var BASES = ['https://cdn.jsdelivr.net/npm/three@' + V, 'https://unpkg.com/three@' + V, 'https://fastly.jsdelivr.net/npm/three@' + V];
  function probe(base) {
    return new Promise(function (resolve) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; resolve(false); } }, 4500);
      fetch(base + '/build/three.module.js', { method: 'HEAD' }).then(
        function (r) { if (!done) { done = true; clearTimeout(timer); resolve(r.ok); } },
        function () { if (!done) { done = true; clearTimeout(timer); resolve(false); } });
    });
  }
  async function start() {
    var base = BASES[0];
    for (var i = 0; i < BASES.length; i++) { if (await probe(BASES[i])) { base = BASES[i]; break; } }
    var map = document.createElement('script');
    map.type = 'importmap';
    map.textContent = JSON.stringify({ imports: { 'three': base + '/build/three.module.js', 'three/addons/': base + '/examples/jsm/' } });
    document.head.appendChild(map);
    var app = document.createElement('script');
    app.type = 'module';
    app.textContent = document.getElementById('app-src').textContent;
    document.body.appendChild(app);
  }
  start();
})();
</script>
