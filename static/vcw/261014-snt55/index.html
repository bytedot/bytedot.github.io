<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ship in a Bottle — a voxel voyage</title>
<style>
  :root{
    --glass: rgba(14,20,30,.52);
    --edge: rgba(255,255,255,.17);
    --ink: #eaf2f8;
    --dim: rgba(234,242,248,.62);
    --accent: #ffcf6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#0a0e14;overflow:hidden;color:var(--ink);
    font:13px/1.25 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
  canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none;cursor:grab}
  canvas#c.drag{cursor:grabbing}

  #loading{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
    background:radial-gradient(120% 90% at 50% 40%,#16314a 0%,#0a0e14 70%);transition:opacity .9s ease, visibility .9s}
  #loading.done{opacity:0;visibility:hidden;pointer-events:none}
  #loading h1{margin:0;font:600 26px/1 Georgia,"Times New Roman",serif;letter-spacing:.32em;text-transform:uppercase;text-indent:.32em;color:#fff}
  #loading h2{margin:0;font:400 13px/1 Georgia,serif;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);opacity:.85}
  #loadmsg{min-height:18px;color:var(--dim);letter-spacing:.06em;text-align:center;max-width:80vw}
  #loadbar{width:min(320px,60vw);height:3px;background:rgba(255,255,255,.12);border-radius:3px;overflow:hidden}
  #loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#4fd1c5,#ffcf6b);transition:width .25s ease}

  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;opacity:0;transition:opacity 1.2s ease .4s}
  #ui.show{opacity:1}
  #title{position:absolute;left:26px;top:22px;text-shadow:0 2px 14px rgba(0,0,0,.55)}
  #title h1{margin:0;font:600 19px/1 Georgia,"Times New Roman",serif;letter-spacing:.3em;text-transform:uppercase}
  #title p{margin:8px 0 0;color:var(--dim);letter-spacing:.05em;font-size:12px}
  #stats{position:absolute;right:22px;top:20px;color:var(--dim);font:11px/1.5 ui-monospace,Consolas,monospace;text-align:right;text-shadow:0 1px 6px #000;white-space:pre}

  #bar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
    width:max-content;max-width:calc(100vw - 24px);pointer-events:auto}
  .grp{display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:var(--glass);border:1px solid var(--edge);
    -webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);box-shadow:0 8px 30px rgba(0,0,0,.28)}
  .grp>span{padding:0 6px 0 12px;color:var(--dim);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase}
  button{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 12px;border-radius:999px;transition:background .2s,color .2s,transform .1s;white-space:nowrap;user-select:none}
  button:hover{background:rgba(255,255,255,.13)}
  button:active{transform:scale(.96)}
  button:focus-visible{outline:2px solid var(--accent)}
  button.on{background:var(--accent);color:#1d1606;font-weight:600}
  button.act{background:rgba(255,120,80,.9);color:#2a0d05;font-weight:700}
  #hint{position:absolute;left:26px;bottom:26px;color:var(--dim);font-size:11.5px;letter-spacing:.04em;line-height:1.7;text-shadow:0 1px 8px #000;pointer-events:none}
  #hint b{color:#fff;font-weight:600}
  @media (max-width:1180px){.grp>span{display:none}button{padding:7px 10px}}
  @media (max-width:900px){#hint{display:none}#title{left:16px;top:14px}#bar{bottom:10px}}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>

<div id="loading">
  <h2>a voxel diorama</h2>
  <h1>Ship in a Bottle</h1>
  <div id="loadbar"><i></i></div>
  <div id="loadmsg">Warming up the glassblower…</div>
</div>

<div id="ui">
  <div id="title"><h1>Ship in a Bottle</h1><p>a tiny, very stubborn ocean</p></div>
  <div id="stats"></div>
  <div id="hint"><b>Drag</b> orbit &nbsp;·&nbsp; <b>Scroll</b> zoom &nbsp;·&nbsp; <b>Right-drag</b> pan<br><b>Click the sea</b> to make a splash &nbsp;·&nbsp; <b>Space</b> fire the cannons &nbsp;·&nbsp; <b>S</b> shake the bottle &nbsp;·&nbsp; <b>M</b> sound</div>
  <div id="bar">
    <div class="grp" id="g-time"><span>Time</span>
      <button data-time="6.4">Dawn</button><button data-time="12">Noon</button><button data-time="17.9">Dusk</button><button data-time="23.2">Night</button><button id="b-cycle">Cycle</button>
    </div>
    <div class="grp" id="g-sea"><span>Sea</span>
      <button data-sea="0">Calm</button><button data-sea="1">Breezy</button><button data-sea="2">Storm</button>
    </div>
    <div class="grp" id="g-cam"><span>Camera</span>
      <button id="b-orbit">Drift</button><button id="b-tour">Tour</button><button id="b-follow">Follow ship</button>
    </div>
    <div class="grp"><button id="b-fire" class="act">Fire!</button><button id="b-shake">Shake</button><button id="b-sound" title="Ocean soundscape (off by default)">Sound</button></div>
  </div>
</div>

<!-- The application itself (a single ES module). It is kept as inert text here and started by the loader below,
     which first picks a reachable CDN for three.js and registers the import map for it. -->
<script id="app-src" type="text/plain">

// ======================================================================
// 00_boot.js
// ======================================================================
// =====================================================================================================
//  SHIP IN A BOTTLE — a voxel diorama rendered with WebGL2 (three.js r160, loaded from a CDN).
//  Single file, no build step: open it in Chrome (needs an internet connection for three.js).
//
//  What is simulated (all live, nothing is baked or pre-recorded):
//   · water    – a shallow-water wave solver on a 148x61 grid (+ analytic swell) whose heights are quantised
//                into voxel columns on the GPU; the hull, cannonballs, dolphins, the shark's fin, rain and your
//                clicks all push on it, and waves reflect off the glass and the islands
//   · the ship – a rigid body floating on ~380 buoyancy columns sampled against the live water surface,
//                driven by wind on its sails (heeling!), steered by a rudder-controlled autopilot
//   · life     – flocking fish (boids), jellyfish, a turtle, a shark, dolphins leaping on ballistic arcs,
//                gulls, crabs, flotsam with 5-point buoyancy, a storm-summoned sea serpent, swaying lanterns…
//
//  Controls:  drag = orbit · wheel = zoom · right-drag = pan · click the sea = splash
//             Space = fire cannons · S = shake the bottle · T = tour · F = follow ship · C = day/night cycle
//             1/2/3 = calm/breezy/storm · M = sound · I = fps · R = reset camera
//  Handy URL options:  ?t=23 (hour of day)  ?sea=2 (storm)  ?nointro  ?cam=az,el,dist,x,y,z
// =====================================================================================================

const $ = (s) => document.querySelector(s);
const loadingEl = $('#loading'), loadingMsg = $('#loadmsg'), loadingBar = $('#loadbar i');
const setLoad = (msg, p) => { if (msg != null) loadingMsg.textContent = msg; if (p != null) loadingBar.style.width = Math.round(p * 100) + '%'; };
// yield to the event loop so the loading text can repaint (setTimeout keeps working in background tabs, rAF does not)
const FAST_LOAD = new URLSearchParams(location.search).has('fast');   // debugging: skip the loading-screen yields
const nextFrame = () => (FAST_LOAD ? Promise.resolve() : new Promise((r) => setTimeout(r, 16)));

let THREE, EffectComposer, RenderPass, UnrealBloomPass, OutputPass, ShaderPass;
try {
  setLoad('Fetching three.js…', 0.03);
  THREE = await import('three');
  ({ EffectComposer } = await import('three/addons/postprocessing/EffectComposer.js'));
  ({ RenderPass } = await import('three/addons/postprocessing/RenderPass.js'));
  ({ UnrealBloomPass } = await import('three/addons/postprocessing/UnrealBloomPass.js'));
  ({ OutputPass } = await import('three/addons/postprocessing/OutputPass.js'));
  ({ ShaderPass } = await import('three/addons/postprocessing/ShaderPass.js'));
} catch (err) {
  console.error(err);
  loadingMsg.innerHTML = 'Could not load three.js from the CDN.<br>Check your internet connection and reload the page.';
  throw err;
}

// ======================================================================
// 10_util.js
// ======================================================================
// ---------------------------------------------------------------------------
// small math / noise / colour helpers
// ---------------------------------------------------------------------------
const TAU = Math.PI * 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const fract = (x) => x - Math.floor(x);
const sign = (x) => (x < 0 ? -1 : 1);
const wrapPi = (a) => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
let _rng = mulberry32(20241013);
const seedRng = (s) => { _rng = mulberry32(s); };
const rnd = () => _rng();
const rndR = (a, b) => a + (b - a) * _rng();
const rndI = (a, b) => Math.floor(a + (b - a + 1) * _rng());
const pick = (arr) => arr[Math.floor(_rng() * arr.length)];
// a separate generator for runtime (visual randomness that must not disturb the seeded world build)
const _rt = mulberry32(777);
const rrnd = () => _rt();

function ihash(x, y, z) {
  let h = Math.imul(x | 0, 0x27d4eb2d) ^ Math.imul(y | 0, 0x165667b1) ^ Math.imul(z | 0, 0x9e3779b1);
  h ^= h >>> 15; h = Math.imul(h, 0x85ebca6b); h ^= h >>> 13; h = Math.imul(h, 0xc2b2ae35); h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function vnoise(x, y, z = 0) {
  const xi = Math.floor(x), yi = Math.floor(y), zi = Math.floor(z);
  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const a = ihash(xi, yi, zi), b = ihash(xi + 1, yi, zi), c = ihash(xi, yi + 1, zi), d = ihash(xi + 1, yi + 1, zi);
  const e = ihash(xi, yi, zi + 1), f = ihash(xi + 1, yi, zi + 1), g = ihash(xi, yi + 1, zi + 1), h = ihash(xi + 1, yi + 1, zi + 1);
  const x1 = a + (b - a) * u, x2 = c + (d - c) * u, x3 = e + (f - e) * u, x4 = g + (h - g) * u;
  const y1 = x1 + (x2 - x1) * v, y2 = x3 + (x4 - x3) * v;
  return y1 + (y2 - y1) * w;
}
function fbm(x, y, z = 0, oct = 4) {
  let s = 0, a = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { s += a * vnoise(x * f, y * f, z * f + i * 17.3); n += a; a *= 0.5; f *= 2.03; }
  return s / n;
}

// ---- colours (packed 0xRRGGBB ints are the currency of the voxel code) ----
const rgb = (r, g, b) => (clamp(Math.round(r), 0, 255) << 16) | (clamp(Math.round(g), 0, 255) << 8) | clamp(Math.round(b), 0, 255);
const cR = (c) => (c >> 16) & 255, cG = (c) => (c >> 8) & 255, cB = (c) => c & 255;
const mixc = (a, b, t) => rgb(lerp(cR(a), cR(b), t), lerp(cG(a), cG(b), t), lerp(cB(a), cB(b), t));
const shade = (c, f) => rgb(cR(c) * f, cG(c) * f, cB(c) * f);
function hsl(h, s, l) {
  h = ((h % 1) + 1) % 1;
  const f = (n) => { const k = (n + h * 12) % 12; const a = s * Math.min(l, 1 - l); return l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)); };
  return rgb(f(0) * 255, f(8) * 255, f(4) * 255);
}
// per-voxel brightness jitter driven by position (stable between rebuilds)
const jit = (c, amt, x, y, z) => shade(c, 1 + (ihash(x, y, z) - 0.5) * 2 * amt);
const noisy = (c, amt = 0.08, seed = 0) => (x, y, z) => jit(c, amt, x + seed, y, z);
// colour ramp helper: stops = [[t, 0xrrggbb], ...]
function ramp(stops, t) {
  if (t <= stops[0][0]) return stops[0][1];
  for (let i = 1; i < stops.length; i++) {
    if (t <= stops[i][0]) return mixc(stops[i - 1][1], stops[i][1], (t - stops[i - 1][0]) / (stops[i][0] - stops[i - 1][0]));
  }
  return stops[stops.length - 1][1];
}

// ---- tiny vector helpers on plain arrays (used by build code, not per-frame code) ----
const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);

// ======================================================================
// 20_voxel.js
// ======================================================================
// ---------------------------------------------------------------------------
// Voxel model + mesher (hidden-face culling, per-vertex ambient occlusion)
// ---------------------------------------------------------------------------
const SRGB_LUT = new Float32Array(256);
for (let i = 0; i < 256; i++) { const c = i / 255; SRGB_LUT[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }

class Vox {
  // inclusive integer bounds; voxel (x,y,z) occupies the unit cube centred on that integer point
  constructor(x0, y0, z0, x1, y1, z1) {
    this.x0 = x0; this.y0 = y0; this.z0 = z0; this.x1 = x1; this.y1 = y1; this.z1 = z1;
    this.sx = x1 - x0 + 1; this.sy = y1 - y0 + 1; this.sz = z1 - z0 + 1;
    this.py = this.sy + 2; this.pz = this.sz + 2;               // 1-voxel empty padding on every side
    const n = (this.sx + 2) * this.py * this.pz;
    this.col = new Uint32Array(n);                                // 0 = empty, else 0x01000000 | rgb
    this.fx = new Uint8Array(n);                                  // low nibble = emissive, high nibble = sway weight
    this.count = 0;
  }
  ix(x, y, z) { return ((x - this.x0 + 1) * this.py + (y - this.y0 + 1)) * this.pz + (z - this.z0 + 1); }
  inb(x, y, z) { return x >= this.x0 && x <= this.x1 && y >= this.y0 && y <= this.y1 && z >= this.z0 && z <= this.z1; }
  // integer-coordinate write; colour may be a number or fn(x,y,z) (return a negative number to skip)
  put(x, y, z, c, e = 0, w = 0) {
    if (x < this.x0 || x > this.x1 || y < this.y0 || y > this.y1 || z < this.z0 || z > this.z1) return;
    if (typeof c === 'function') { c = c(x, y, z); if (c < 0) return; }
    const i = ((x - this.x0 + 1) * this.py + (y - this.y0 + 1)) * this.pz + (z - this.z0 + 1);
    if (!this.col[i]) this.count++;
    this.col[i] = 0x1000000 | c;
    this.fx[i] = (e & 15) | ((w & 15) << 4);
  }
  set(x, y, z, c, e = 0, w = 0) { this.put(Math.round(x), Math.round(y), Math.round(z), c, e, w); }
  del(x, y, z) {
    x = Math.round(x); y = Math.round(y); z = Math.round(z);
    if (!this.inb(x, y, z)) return;
    const i = this.ix(x, y, z);
    if (this.col[i]) { this.count--; this.col[i] = 0; this.fx[i] = 0; }
  }
  get(x, y, z) {
    x = Math.round(x); y = Math.round(y); z = Math.round(z);
    if (!this.inb(x, y, z)) return 0;
    return this.col[this.ix(x, y, z)];
  }
  has(x, y, z) { return this.get(x, y, z) !== 0; }

  box(x0, y0, z0, x1, y1, z1, c, e = 0, w = 0) {
    const ax = Math.round(Math.min(x0, x1)), bx = Math.round(Math.max(x0, x1));
    const ay = Math.round(Math.min(y0, y1)), by = Math.round(Math.max(y0, y1));
    const az = Math.round(Math.min(z0, z1)), bz = Math.round(Math.max(z0, z1));
    for (let x = ax; x <= bx; x++) for (let y = ay; y <= by; y++) for (let z = az; z <= bz; z++) this.put(x, y, z, c, e, w);
  }
  boxDel(x0, y0, z0, x1, y1, z1) {
    const ax = Math.round(Math.min(x0, x1)), bx = Math.round(Math.max(x0, x1));
    const ay = Math.round(Math.min(y0, y1)), by = Math.round(Math.max(y0, y1));
    const az = Math.round(Math.min(z0, z1)), bz = Math.round(Math.max(z0, z1));
    for (let x = ax; x <= bx; x++) for (let y = ay; y <= by; y++) for (let z = az; z <= bz; z++) this.del(x, y, z);
  }
  ell(cx, cy, cz, rx, ry, rz, c, e = 0, w = 0) {
    const slack = 1 + 0.3 / Math.max(0.5, Math.min(rx, ry, rz));
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++)
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
        for (let z = Math.floor(cz - rz - 1); z <= Math.ceil(cz + rz + 1); z++) {
          const dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz;
          if (dx * dx + dy * dy + dz * dz <= slack) this.put(x, y, z, c, e, w);
        }
  }
  ball(cx, cy, cz, r, c, e = 0, w = 0) { this.ell(cx, cy, cz, r, r, r, c, e, w); }
  ellDel(cx, cy, cz, rx, ry, rz) {
    const slack = 1 + 0.3 / Math.max(0.5, Math.min(rx, ry, rz));
    for (let x = Math.floor(cx - rx - 1); x <= Math.ceil(cx + rx + 1); x++)
      for (let y = Math.floor(cy - ry - 1); y <= Math.ceil(cy + ry + 1); y++)
        for (let z = Math.floor(cz - rz - 1); z <= Math.ceil(cz + rz + 1); z++) {
          const dx = (x - cx) / rx, dy = (y - cy) / ry, dz = (z - cz) / rz;
          if (dx * dx + dy * dy + dz * dz <= slack && this.inb(x, y, z)) this.del(x, y, z);
        }
  }
  ballDel(cx, cy, cz, r) { this.ellDel(cx, cy, cz, r, r, r); }
  cylY(cx, cz, r, y0, y1, c, e = 0, w = 0) {
    const r2 = r * r + 0.3;
    for (let y = Math.round(y0); y <= Math.round(y1); y++)
      for (let x = Math.floor(cx - r - 1); x <= Math.ceil(cx + r + 1); x++)
        for (let z = Math.floor(cz - r - 1); z <= Math.ceil(cz + r + 1); z++)
          if ((x - cx) * (x - cx) + (z - cz) * (z - cz) <= r2) this.put(x, y, z, c, e, w);
  }
  cylX(cy, cz, r, x0, x1, c, e = 0, w = 0) {
    const r2 = r * r + 0.3;
    for (let x = Math.round(x0); x <= Math.round(x1); x++)
      for (let y = Math.floor(cy - r - 1); y <= Math.ceil(cy + r + 1); y++)
        for (let z = Math.floor(cz - r - 1); z <= Math.ceil(cz + r + 1); z++)
          if ((y - cy) * (y - cy) + (z - cz) * (z - cz) <= r2) this.put(x, y, z, c, e, w);
  }
  cylZ(cx, cy, r, z0, z1, c, e = 0, w = 0) {
    const r2 = r * r + 0.3;
    for (let z = Math.round(z0); z <= Math.round(z1); z++)
      for (let x = Math.floor(cx - r - 1); x <= Math.ceil(cx + r + 1); x++)
        for (let y = Math.floor(cy - r - 1); y <= Math.ceil(cy + r + 1); y++)
          if ((x - cx) * (x - cx) + (y - cy) * (y - cy) <= r2) this.put(x, y, z, c, e, w);
  }
  // tapered capsule between two points (branches, tentacles, masts, ropes with thickness…)
  capsule(ax, ay, az, bx, by, bz, r0, r1, c, e = 0, w = 0) {
    const dx = bx - ax, dy = by - ay, dz = bz - az;
    const len2 = dx * dx + dy * dy + dz * dz || 1e-6;
    const rm = Math.max(r0, r1) + 1;
    for (let x = Math.floor(Math.min(ax, bx) - rm); x <= Math.ceil(Math.max(ax, bx) + rm); x++)
      for (let y = Math.floor(Math.min(ay, by) - rm); y <= Math.ceil(Math.max(ay, by) + rm); y++)
        for (let z = Math.floor(Math.min(az, bz) - rm); z <= Math.ceil(Math.max(az, bz) + rm); z++) {
          let t = ((x - ax) * dx + (y - ay) * dy + (z - az) * dz) / len2; t = t < 0 ? 0 : t > 1 ? 1 : t;
          const px = ax + dx * t - x, py = ay + dy * t - y, pz = az + dz * t - z;
          const r = r0 + (r1 - r0) * t;
          if (px * px + py * py + pz * pz <= r * r + 0.3) this.put(x, y, z, c, e, w);
        }
  }
  line(ax, ay, az, bx, by, bz, c, e = 0, w = 0) {
    const n = Math.ceil(Math.max(Math.abs(bx - ax), Math.abs(by - ay), Math.abs(bz - az)) * 2) + 1;
    for (let i = 0; i <= n; i++) {
      const t = i / n;
      this.set(ax + (bx - ax) * t, ay + (by - ay) * t, az + (bz - az) * t, c, e, w);
    }
  }
  // copy another model into this one. rot = quarter turns about +Y, flip mirrors Z (before rotation)
  stamp(src, ox, oy, oz, rot = 0, flip = false, skipEmpty = true) {
    const { sx, sy, sz } = src;
    for (let X = 0; X < sx; X++) for (let Y = 0; Y < sy; Y++) for (let Z = 0; Z < sz; Z++) {
      const i = ((X + 1) * src.py + (Y + 1)) * src.pz + (Z + 1);
      const c = src.col[i];
      if (!c) continue;
      let x = src.x0 + X, y = src.y0 + Y, z = src.z0 + Z;
      if (flip) z = -z;
      let rx = x, rz = z;
      switch (rot & 3) { case 1: rx = -z; rz = x; break; case 2: rx = -x; rz = -z; break; case 3: rx = z; rz = -x; break; }

      this.put(Math.round(ox + rx), Math.round(oy + y), Math.round(oz + rz), c & 0xffffff, f & 15, f >> 4);

}

// ---- mesher ----------------------------------------------------------------
const FACE_A = [0, 0, 1, 1, 2, 2], FACE_S = [1, -1, 1, -1, 1, -1];
const FACE_U = [1, 2, 2, 0, 0, 1], FACE_V = [2, 1, 0, 2, 1, 0];
const CU = [-1, 1, 1, -1], CV = [-1, -1, 1, 1];
const AO_DEF = [0.50, 0.68, 0.85, 1.0];

const SB = { cap: 0, pos: null, nor: null, col: null, fx: null, idx: null };
function ensureScratch(nv) {
  if (SB.cap >= nv) return;
  const cap = Math.max(nv, SB.cap * 2, 8192);
  SB.pos = new Float32Array(cap * 3); SB.nor = new Float32Array(cap * 3); SB.col = new Float32Array(cap * 3);
  SB.fx = new Float32Array(cap * 2); SB.idx = new Uint32Array(Math.ceil(cap * 1.5) + 8);
  SB.cap = cap;
}

// returns views onto shared scratch buffers (valid until the next call)
function meshVox(v, o = {}) {
  const col = v.col, fx = v.fx, py = v.py, pz = v.pz, sx = v.sx, sy = v.sy, sz = v.sz;
  const st = [py * pz, pz, 1];
  const aoT = o.ao === false ? [1, 1, 1, 1] : (o.ao || AO_DEF);
  const ox = o.ox || 0, oy = o.oy || 0, oz = o.oz || 0;
  const bright = o.bright || 1;
  const s0 = st[0], s1 = st[1];
  // pass 1: count visible faces
  let nf = 0;
  for (let X = 0; X < sx; X++) for (let Y = 0; Y < sy; Y++) {
    let i = ((X + 1) * py + (Y + 1)) * pz + 1;
    for (let Z = 0; Z < sz; Z++, i++) {
      if (!col[i]) continue;
      if (!col[i + s0]) nf++; if (!col[i - s0]) nf++;
      if (!col[i + s1]) nf++; if (!col[i - s1]) nf++;
      if (!col[i + 1]) nf++; if (!col[i - 1]) nf++;
    }
  }
  const nv = nf * 4;
  ensureScratch(nv);
  const P = SB.pos, N = SB.nor, C = SB.col, F = SB.fx, I = SB.idx;
  let vi = 0, ii = 0;
  const av = [0, 0, 0, 0], pp = [0, 0, 0];
  for (let X = 0; X < sx; X++) for (let Y = 0; Y < sy; Y++) {
    let i = ((X + 1) * py + (Y + 1)) * pz + 1;
    for (let Z = 0; Z < sz; Z++, i++) {
      const cc = col[i];
      if (!cc) continue;
      const cx = v.x0 + X - ox, cy = v.y0 + Y - oy, cz = v.z0 + Z - oz;
      const r0 = SRGB_LUT[(cc >> 16) & 255] * bright, g0 = SRGB_LUT[(cc >> 8) & 255] * bright, b0 = SRGB_LUT[cc & 255] * bright;
      const f = fx[i], em = (f & 7) / 7 + ((f & 8) ? 2 : 0), sw = (f >> 4) / 15;   // bit 3 of the emissive nibble = 'dry' (inside the sand, no water absorption)
      for (let fc = 0; fc < 6; fc++) {
        const A = FACE_A[fc], S = FACE_S[fc], U = FACE_U[fc], V = FACE_V[fc];
        const ni = i + S * st[A];
        if (col[ni]) continue;
        const us = st[U], vs = st[V];
        for (let k = 0; k < 4; k++) {
          const cu = CU[k], cv = CV[k];
          const a1 = col[ni + cu * us] ? 1 : 0, a2 = col[ni + cv * vs] ? 1 : 0, a3 = col[ni + cu * us + cv * vs] ? 1 : 0;
          av[k] = aoT[(a1 && a2) ? 0 : 3 - (a1 + a2 + a3)];
        }
        const base = vi;
        for (let k = 0; k < 4; k++) {
          const cu = CU[k], cv = CV[k];
          const o3 = vi * 3;
          pp[0] = cx; pp[1] = cy; pp[2] = cz;
          pp[A] += 0.5 * S; pp[U] += 0.5 * cu; pp[V] += 0.5 * cv;
          P[o3] = pp[0]; P[o3 + 1] = pp[1]; P[o3 + 2] = pp[2];
          N[o3] = 0; N[o3 + 1] = 0; N[o3 + 2] = 0; N[o3 + A] = S;
          const a = av[k];
          C[o3] = r0 * a; C[o3 + 1] = g0 * a; C[o3 + 2] = b0 * a;
          F[vi * 2] = em; F[vi * 2 + 1] = sw;
          vi++;
        }
        // split along the diagonal through the darker pair so AO gradients stay symmetric
        if (av[1] + av[3] < av[0] + av[2]) {
          I[ii++] = base + 1; I[ii++] = base + 2; I[ii++] = base + 3; I[ii++] = base + 1; I[ii++] = base + 3; I[ii++] = base;
        } else {
          I[ii++] = base; I[ii++] = base + 1; I[ii++] = base + 2; I[ii++] = base; I[ii++] = base + 2; I[ii++] = base + 3;
        }
      }
    }
  }
  return { nv: vi, ni: ii };
}

function voxGeometry(v, o = {}) {
  const r = meshVox(v, o);
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(SB.pos.slice(0, r.nv * 3), 3));
  g.setAttribute('normal', new THREE.BufferAttribute(SB.nor.slice(0, r.nv * 3), 3));
  g.setAttribute('color', new THREE.BufferAttribute(SB.col.slice(0, r.nv * 3), 3));
  g.setAttribute('aFx', new THREE.BufferAttribute(SB.fx.slice(0, r.nv * 2), 2));
  g.setIndex(new THREE.BufferAttribute(SB.idx.slice(0, r.ni), 1));
  g.computeBoundingSphere();
  g.userData.faces = r.ni / 6;
  return g;
}

// geometry that is re-meshed repeatedly (sails, flags, tentacles…)
class DynVox {
  constructor(capVerts = 4096) {
    this.geo = new THREE.BufferGeometry();
    this._alloc(capVerts);
  }
  _alloc(cap) {
    const g = this.geo;
    this.cap = cap;
    const mk = (name, n) => { const a = new THREE.BufferAttribute(new Float32Array(cap * n), n); a.setUsage(THREE.DynamicDrawUsage); g.setAttribute(name, a); return a; };
    this.aP = mk('position', 3); this.aN = mk('normal', 3); this.aC = mk('color', 3); this.aF = mk('aFx', 2);
    const ia = new THREE.BufferAttribute(new Uint32Array(Math.ceil(cap * 1.5)), 1); ia.setUsage(THREE.DynamicDrawUsage);
    g.setIndex(ia); this.aI = ia;
  }
  update(v, o = {}) {
    const r = meshVox(v, o);
    if (r.nv > this.cap) { this.geo.dispose(); this.geo = new THREE.BufferGeometry(); this._alloc(Math.ceil(r.nv * 1.5)); this.replaced = true; }
    this.aP.array.set(SB.pos.subarray(0, r.nv * 3)); this.aP.needsUpdate = true;
    this.aN.array.set(SB.nor.subarray(0, r.nv * 3)); this.aN.needsUpdate = true;
    this.aC.array.set(SB.col.subarray(0, r.nv * 3)); this.aC.needsUpdate = true;
    this.aF.array.set(SB.fx.subarray(0, r.nv * 2)); this.aF.needsUpdate = true;
    this.aI.array.set(SB.idx.subarray(0, r.ni)); this.aI.needsUpdate = true;
    this.geo.setDrawRange(0, r.ni);
    if (!this.geo.boundingSphere) this.geo.boundingSphere = new THREE.Sphere();
    this.geo.boundingSphere.set(new THREE.Vector3(o.bx || 0, o.by || 0, o.bz || 0), o.br || 60);
    return r;
  }
}

// World constants and the bottle's profile (shared by glass, clipping, terrain, physics)
// The bottle lies along the X axis (base at -X, neck at +X); its axis is y=0,z=0.
// One voxel == one metre.
// ---------------------------------------------------------------------------
const BT = {
  R: 32, wall: 1.7,
  xBase: -84, puntDepth: 4, puntR: 22, heelR: 27, cornerR: 5,
  xSh0: 26, xSh1: 62, rNeck: 10.2, xNeck1: 92, rNeck1: 9.6, xMouth: 103,
};

const WG = { x0: -82, z0: -30, nx: 148, nz: 61 };

// ---- profile polylines (x, r) -------------------------------------------------
function buildBottleProfiles() {
  const o = [];
  const xb = BT.xBase;
  const nP = 14;
  for (let i = 0; i <= nP; i++) { const r = BT.puntR * i / nP; o.push([xb + BT.puntDepth * (1 - (r / BT.puntR) ** 2), r]); }
  o.push([xb, (BT.puntR + BT.heelR) / 2]); o.push([xb, BT.heelR]);
  for (let i = 1; i <= 12; i++) { const a = Math.PI / 2 * i / 12; o.push([xb + BT.cornerR - BT.cornerR * Math.cos(a), BT.heelR + BT.cornerR * Math.sin(a)]); }
  o.push([BT.xSh0, BT.R]);
  const nS = 40;
  for (let i = 1; i <= nS; i++) {
    const u = i / nS, f = 0.5 * (1 + Math.cos(Math.PI * Math.pow(u, 0.85)));
    o.push([lerp(BT.xSh0, BT.xSh1, u), BT.rNeck + (BT.R - BT.rNeck) * f]);
  }
  const nN = 24;
  for (let i = 1; i <= nN; i++) {
    const u = i / nN, x = lerp(BT.xSh1, BT.xNeck1, u);
    o.push([x, lerp(BT.rNeck, BT.rNeck1, u) + 0.9 * Math.exp(-(((x - 78) / 1.6) ** 2))]);
  }
  const mainEnd = o.length;                  // everything up to here has an offset (inner) twin
  [[93, 10.6], [94.2, 11.7], [96.5, 12.3], [99, 12.3], [101, 11.7], [102.4, 10.4], [103, 8.8]].forEach((p) => o.push(p));

  // inner surface: offset along the inward normal
  const inner = [];
  for (let i = 0; i < mainEnd; i++) {
    const a = o[Math.max(0, i - 1)], b = o[Math.min(o.length - 1, i + 1)];
    let tx = b[0] - a[0], tr = b[1] - a[1]; const l = Math.hypot(tx, tr) || 1; tx /= l; tr /= l;
    const nx = -tr, nr = tx;                  // outward normal
    inner.push([o[i][0] - BT.wall * nx, Math.max(0, o[i][1] - BT.wall * nr)]);
  }
  inner[0][1] = 0;
  // inner lip down to the mouth opening
  [[93.6, 7.7], [96, 7.05], [100, 6.7], [103.2, 6.6]].forEach((p) => inner.push(p));
  return { outer: o, inner };
}
const PROFILE = buildBottleProfiles();
const MOUTH_RIM = [[103.4, 8.2], [103.55, 7.6], [103.4, 6.95]];

// largest radius of the cavity at a given x (monotone parts of the inner profile + corner), -1 if none
function rInAt(x) {
  const p = PROFILE.inner;
  let best = -1;
  for (let i = 0; i < p.length - 1; i++) {
    const a = p[i], b = p[i + 1];
    if ((x >= a[0] && x <= b[0]) || (x >= b[0] && x <= a[0])) {
      const dx = b[0] - a[0];
      const t = Math.abs(dx) < 1e-6 ? 0 : (x - a[0]) / dx;
      const r = a[1] + (b[1] - a[1]) * t;
      if (r > best) best = r;
    }
  }
  return best;
}
// true when point (x, rho) lies inside the empty part of the bottle
function inCavity(x, rho) {
  const rmax = rInAt(x);
  if (rho > rmax) return false;
  const xp = BT.xBase + BT.wall;
  if (x < xp + BT.puntDepth) {
    const t = (x - xp) / BT.puntDepth;
    if (t < 0) return false;
    if (rho < BT.puntR * Math.sqrt(Math.max(0, 1 - t))) return false;
  }
  return true;
}
// lookup table for fast radius queries in JS
const RIN_N = 1024;
const RIN_LUT = new Float32Array(RIN_N);
for (let i = 0; i < RIN_N; i++) RIN_LUT[i] = Math.max(0, rInAt(BX_MIN + (BX_MAX - BX_MIN) * (i + 0.5) / RIN_N));
function rIn(x) {
  const u = clamp((x - BX_MIN) / (BX_MAX - BX_MIN) * RIN_N - 0.5, 0, RIN_N - 1.001);
  const i = Math.floor(u);
  return lerp(RIN_LUT[i], RIN_LUT[i + 1], u - i);
}
// lowest interior y at column (x,z)  (the glass floor)
function glassFloor(x, z) {
  const r = rIn(x) - 0.25;
  return Math.abs(z) >= r ? Infinity : -Math.sqrt(r * r - z * z);
}

float vHash(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float bottleR(float x){
  float u = (x - uBottleRange.x) / (uBottleRange.y - uBottleRange.x);

vec4 waterAt(vec2 xz){
  vec2 uv = (xz - uWaterOrigin + 0.5) / uWaterSize;

const ENV = {
  top: { value: new THREE.Color(0.5, 0.65, 0.9) },
  hor: { value: new THREE.Color(0.7, 0.75, 0.85) },
  bot: { value: new THREE.Color(0.12, 0.08, 0.06) },
  win: { value: new THREE.Color(1.0, 0.95, 0.85) },
  key: { value: 1.0 },
  rim: { value: 1.0 },
};

function rOutAt(x) {
  const p = PROFILE.outer;
  for (let i = 0; i < p.length - 1; i++) {
    if (p[i][0] >= BT.xSh0 - 0.01 && x >= p[i][0] && x <= p[i + 1][0]) {
      const t = (x - p[i][0]) / (p[i + 1][0] - p[i][0] || 1);
      return lerp(p[i][1], p[i + 1][1], t);
    }
  }
  return x < BT.xSh0 ? BT.R : 0;
}

// ---- glass -----------------------------------------------------------------
const ETCH = { x0: -80, x1: 24 };           // x-range of the frosted band, mapped to texture u
function buildGlassGeometry() {
  const nOuter = PROFILE.outer.length + MOUTH_RIM.length;
  const prof = PROFILE.outer.concat(MOUTH_RIM, PROFILE.inner.slice().reverse());
  const seg = 160, nP = prof.length, row = seg + 1;
  const pos = new Float32Array(nP * row * 3), nor = new Float32Array(nP * row * 3), uv = new Float32Array(nP * row * 2), side = new Float32Array(nP * row);
  for (let i = 0; i < nP; i++) {
    const a = prof[Math.max(0, i - 1)], b = prof[Math.min(nP - 1, i + 1)];
    let tx = b[0] - a[0], tr = b[1] - a[1]; const l = Math.hypot(tx, tr) || 1; tx /= l; tr /= l;
    const nx = -tr, nr = tx;
    for (let j = 0; j <= seg; j++) {
      const ph = j / seg * TAU, cp = Math.cos(ph), sp = Math.sin(ph), k = i * row + j;
      pos[k * 3] = prof[i][0]; pos[k * 3 + 1] = prof[i][1] * cp; pos[k * 3 + 2] = prof[i][1] * sp;
      nor[k * 3] = nx; nor[k * 3 + 1] = nr * cp; nor[k * 3 + 2] = nr * sp;
      uv[k * 2] = (prof[i][0] - ETCH.x0) / (ETCH.x1 - ETCH.x0); uv[k * 2 + 1] = j / seg;
      side[k] = i < nOuter ? 1 : 0;
    }
  }
  const idx = [];
  for (let i = 0; i < nP - 1; i++) for (let j = 0; j < seg; j++) {
    const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
    idx.push(a, c, b, b, c, d);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  g.setAttribute('aSide', new THREE.BufferAttribute(side, 1));
  g.setIndex(idx);
  g.computeBoundingSphere();
  return g;
}

const GLSL_ENV = /* glsl */`
uniform vec3 uEnvTop; uniform vec3 uEnvHor; uniform vec3 uEnvBot; uniform vec3 uWinCol; uniform float uKey; uniform float uRim;
float rectMask(vec3 d, vec3 c, vec3 up, vec2 hs, float soft, out vec2 q){
  q = vec2(0.0);
  float k = dot(d, c);
  if (k <= 0.05) return 0.0;
  vec3 p = d / k - c;
  vec3 r = normalize(cross(up, c));
  vec3 u = cross(c, r);
  q = vec2(dot(p, r), dot(p, u));
  vec2 e = smoothstep(hs + soft, hs - soft, abs(q));
  return e.x * e.y;
}
vec3 envSample(vec3 d){
  vec3 col = mix(uEnvBot, uEnvHor, smoothstep(-0.55, 0.02, d.y));
  col = mix(col, uEnvTop, smoothstep(0.0, 0.85, d.y));
  vec2 q;
  col += uKey * 4.6 * rectMask(d, normalize(vec3(-0.35, 0.85, 0.40)), vec3(0.0, 1.0, 0.0), vec2(0.55, 0.26), 0.10, q) * vec3(1.0, 0.97, 0.92);
  col += uRim * 3.0 * rectMask(d, normalize(vec3(0.85, 0.30, -0.45)), vec3(0.0, 1.0, 0.0), vec2(0.10, 0.62), 0.06, q) * vec3(0.8, 0.9, 1.0);
  float w = rectMask(d, normalize(vec3(-0.92, 0.16, 0.30)), vec3(0.0, 1.0, 0.0), vec2(0.60, 0.46), 0.012, q);
  float pane = step(0.022, abs(q.x)) * step(0.022, abs(q.y - 0.04));
  col += uKey * 3.2 * w * pane * uWinCol;
  col += uKey * 1.4 * rectMask(d, normalize(vec3(0.25, 0.55, 0.80)), vec3(0.0, 1.0, 0.0), vec2(0.7, 0.07), 0.05, q) * vec3(1.0, 0.92, 0.8);
  return col;
}
`;

const UKEY = { value: 1.0 }, URIM = { value: 1.0 };
const etchTexRef = { value: null };
const glassMat = new THREE.ShaderMaterial({
  uniforms: Object.assign({
    uEnvTop: ENV.top, uEnvHor: ENV.hor, uEnvBot: ENV.bot, uWinCol: ENV.win, uKey: UKEY, uRim: URIM, uEtch: etchTexRef,
  }, sharedUniforms()),
  vertexShader: /* glsl */`
    attribute float aSide;
    varying vec3 vP; varying vec3 vN; varying vec2 vUv; varying float vSide;
    void main(){
      vec4 w = modelMatrix * vec4(position, 1.0);
      vP = w.xyz; vN = normalize(mat3(modelMatrix) * normal); vUv = uv; vSide = aSide;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: /* glsl */`
    uniform vec3 uSunDir; uniform vec3 uSunCol; uniform float uSkyLum; uniform float uTime; uniform sampler2D uEtch;
    ${GLSL_ENV}
    varying vec3 vP; varying vec3 vN; varying vec2 vUv; varying float vSide;
    void main(){
      vec3 V = normalize(cameraPosition - vP);
      vec3 N = normalize(vN);
      N = normalize(N + 0.010 * vec3(sin(vP.x * 0.61 + vP.z * 0.37), sin(vP.y * 0.83 + vP.x * 0.29), sin(vP.z * 0.77 - vP.y * 0.51)));
      if (dot(N, V) < 0.0) N = -N;
      float ndv = clamp(dot(N, V), 0.0, 1.0);
      float F = 0.04 + 0.96 * pow(1.0 - ndv, 5.0);
      vec3 R = reflect(-V, N);
      vec3 env = envSample(R);
      float sd = max(dot(R, uSunDir), 0.0);
      float sp = pow(sd, 1100.0) * 16.0 + pow(sd, 90.0) * 0.10;
      float edge = pow(1.0 - ndv, 2.4);
      vec3 tint = vec3(0.30, 0.64, 0.52);
      vec3 col = env * F * 0.45 + uSunCol * sp * (0.12 + F) + tint * edge * 0.07 * (0.3 + 0.7 * uSkyLum);
      float a = clamp(F * 0.5 + edge * 0.07 + 0.006, 0.0, 1.0);
      float et = texture2D(uEtch, vUv).r * vSide;
      col += et * (0.04 + 0.16 * env + 0.12 * uSkyLum);
      a = clamp(a + et * 0.08, 0.0, 1.0);
      gl_FragColor = vec4(col, a);
    }`,
  transparent: true, depthWrite: false, side: THREE.DoubleSide,
  blending: THREE.CustomBlending, blendEquation: THREE.AddEquation,
  blendSrc: THREE.OneFactor, blendDst: THREE.OneMinusSrcAlphaFactor,
  blendSrcAlpha: THREE.OneFactor, blendDstAlpha: THREE.OneMinusSrcAlphaFactor,
});

// frosted-glass etching, drawn once into a canvas (u along the bottle, v around it)
function makeEtchTexture() {
  const W = 2048, H = 1024;
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#fff'; g.strokeStyle = '#fff'; g.textAlign = 'center'; g.textBaseline = 'middle';
  // v = angle/2π around the bottle: 0 = top, 0.25 = front.  The band sits on the upper front of the glass.
  const cy = H * 0.108;
  g.font = '600 46px Georgia, "Times New Roman", serif';
  g.save(); g.translate(W * 0.5, cy); g.scale(1.0, 1.0);
  g.fillText('S . S .   F O R T U N A    ·    A N N O   1 7 2 1    ·    B O N   V O Y A G E', 0, 0);
  g.restore();
  g.lineWidth = 3;
  g.beginPath(); g.moveTo(W * 0.14, cy + 40); g.lineTo(W * 0.86, cy + 40); g.stroke();
  g.lineWidth = 1.5;
  g.beginPath(); g.moveTo(W * 0.16, cy + 50); g.lineTo(W * 0.84, cy + 50); g.stroke();
  // little waves + stars on both ends
  const wave = (x0, y0, dir) => { g.lineWidth = 2.5; for (let r = 0; r < 3; r++) { g.beginPath(); for (let i = 0; i <= 120; i++) { const x = x0 + dir * i * 2.2, y = y0 + r * 14 + Math.sin(i * 0.28 + r) * 5; if (i) g.lineTo(x, y); else g.moveTo(x, y); } g.stroke(); } };
  wave(W * 0.07, cy - 12, 1); wave(W * 0.93, cy - 12, -1);
  const star = (x, y, r) => { g.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, rr = i % 2 ? r * 0.38 : r; g.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } g.closePath(); g.fill(); };
  star(W * 0.5, cy - 52, 17);
  const t = new THREE.CanvasTexture(c);
  t.flipY = false; t.colorSpace = THREE.NoColorSpace; t.anisotropy = 8; t.wrapS = THREE.ClampToEdgeWrapping; t.wrapT = THREE.RepeatWrapping;
  return t;
}

// ---- cork / wax / twine / tag -------------------------------------------------
function buildCorkAssembly() {
  const v = new Vox(66, -22, -16, 116, 6, 16);
  const corkCol = (x, y, z) => { const n = vnoise(x * 0.7, y * 0.9, z * 0.9) * 0.5 + ihash(x, y, z) * 0.5; return rgb(190 + n * 40, 142 + n * 36, 92 + n * 28); };
  const waxCol = (x, y, z) => { const n = ihash(x, y, z); return rgb(176 + n * 18, 30 + n * 10, 28 + n * 8); };
  const twine = (x, y, z) => rgb(214 + ihash(x, y, z) * 16, 190 + ihash(z, y, x) * 14, 140 + ihash(y, x, z) * 14);
  // cork: slightly tapered, goes deep into the neck
  for (let x = 93; x <= 109; x++) v.cylX(0, 0, lerp(6.1, 6.7, (x - 93) / 16), x, x, corkCol);
  // wax skin over the lip and dripping down the neck
  const dripLen = (th) => 1.5 + 6.5 * Math.pow(Math.max(0, Math.sin(th * 3.0 + 0.6) * 0.5 + 0.5) * (0.5 + 0.5 * Math.sin(th * 7.0 + 2.0)), 1.2);
  for (let a = 0; a < 360; a += 2) {
    const th = a * Math.PI / 180, cs = Math.cos(th), sn = Math.sin(th), L = dripLen(th);
    for (let x = Math.floor(94 - L); x <= 103; x++) {
      const taper = x < 94 ? 0.5 * ((94 - x) / (L + 0.1)) : 0;
      const rr = rOutAt(Math.min(x, 103)) + 1.4 - taper;
      v.set(x, rr * cs, rr * sn, waxCol);
    }
    const rb = rOutAt(94 - L) + 0.9;
    v.set(94 - L - 0.6, rb * cs, rb * sn, waxCol);
  }
  // dome over the mouth
  for (let x = 104; x <= 112; x++) {
    const t = (x - 104) / 8.6;
    v.cylX(0, 0, 9.6 * Math.sqrt(Math.max(0, 1 - t * t)), x, x, waxCol);
  }
  // stamped ring on the seal
  const sealCol = (x, y, z) => rgb(118 + ihash(x, y, z) * 14, 14, 16);
  for (let y = -6; y <= 6; y++) for (let z = -6; z <= 6; z++) { const d = Math.hypot(y, z); if (d > 3.2 && d < 4.6) v.set(110, y, z, sealCol); }
  // twine around the neck
  for (let x = 72; x <= 77; x++) {
    const rr = rOutAt(x) + 0.95;
    for (let a = 0; a < 360; a += 2) {
      const th = a * Math.PI / 180, yy = rr * Math.cos(th), zz = rr * Math.sin(th), c = twine(x, Math.round(yy), Math.round(zz));
      v.set(x, yy, zz, ((x + Math.round(a / 15)) % 2) ? c : shade(c, 0.8));
    }
  }
  // knot, cord and a little parchment tag
  const rt = rOutAt(74.5) + 1.2;
  v.ball(74.5, -rt, 0, 1.3, twine);
  v.line(74.5, -rt - 1, 0, 74.5, -rt - 3, 0, twine);
  const paper = (x, y, z) => rgb(232 + ihash(x, y, z) * 14, 214 + ihash(y, z, x) * 14, 168 + ihash(z, x, y) * 14);
  v.box(72, -rt - 12, 0, 77, -rt - 4, 0, paper);
  v.box(72, -rt - 12, -1, 77, -rt - 4, -1, rgb(190, 160, 110));
  const ink = rgb(66, 44, 30);
  [[0, -9], [0, -8], [0, -7], [0, -6], [-1, -9], [1, -9], [-1, -6], [1, -6], [-2, -7], [2, -7], [0, -10]].forEach(([dx, dy]) => v.set(74.5 + dx, -rt + dy - 3, 1, ink));
  return v;
}

// ---- cradle ------------------------------------------------------------------
function buildCradle() {
  const yb = Math.round(TABLE_Y + 0.5);
  const v = new Vox(-3, yb, -42, 3, -10, 42);
  for (let y = yb; y <= -12; y++) for (let z = -40; z <= 40; z++) for (let x = -3; x <= 3; x++) {
    const zmax = 38 - 0.10 * (y - yb) - Math.max(0, (y - yb) - 20) * 0.45;
    if (Math.abs(z) > zmax) continue;
    const d = Math.hypot(y, z);
    if (d < BT.R + 0.9) continue;                         // the notch the bottle rests in
    const grain = fbm(y * 0.45, z * 0.07, x * 0.5, 3);
    const wood = rgb(86 + grain * 44, 54 + grain * 28, 34 + grain * 20);
    let c = wood;
    if (d < BT.R + 2.4) c = rgb(212 + ihash(x, y, z) * 18, 160 + ihash(z, y, x) * 14, 58);   // brass liner along the notch
    else if (Math.abs(x) === 3) c = shade(wood, 1.12);
    v.put(x, y, z, c);
  }
  for (const zc of [-24, 24]) v.ellDel(0, yb + 3.5, zc, 9, 3.4, 7.4);
  return v;
}

const BG = {

function buildBackdrop() {
  const m = new THREE.ShaderMaterial({
    uniforms: { uTop: BG.top, uMid: BG.mid, uBot: BG.bot, uBokeh: BG.bokeh, uBokehAmt: BG.bokehAmt, uTime: U.time },
    vertexShader: /* glsl */`varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: /* glsl */`
      uniform vec3 uTop; uniform vec3 uMid; uniform vec3 uBot; uniform vec3 uBokeh; uniform float uBokehAmt; uniform float uTime;
      varying vec3 vDir;
      float h21(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
      void main(){
        vec3 d = normalize(vDir);
        float y = d.y;
        vec3 col = mix(uBot, uMid, smoothstep(-0.55, 0.10, y));
        col = mix(col, uTop, smoothstep(0.05, 0.95, y));
        vec2 sph = vec2(atan(d.z, d.x), asin(clamp(y, -1.0, 1.0)));
        for (int L = 0; L < 3; L++) {
          float sc = L == 0 ? 6.0 : (L == 1 ? 11.0 : 19.0);
          vec2 g = sph * sc + float(L) * 3.7;
          vec2 id = floor(g); vec2 f = fract(g) - 0.5;
          float hh = h21(id + float(L) * 17.0);
          if (hh > 0.52) {
            vec2 o = (vec2(h21(id + 3.1), h21(id + 7.7)) - 0.5) * 0.45;
            float r = 0.16 + 0.22 * h21(id + 1.7);
            float dd = length(f - o);
            float disc = smoothstep(r, r * 0.86, dd);
            float rim = smoothstep(r * 0.55, r, dd) * disc;
            float tw = 0.75 + 0.25 * sin(uTime * (0.3 + hh) + hh * 40.0);
            vec3 tint = mix(uBokeh, vec3(1.0, 0.55, 0.35), h21(id + 9.3) * 0.6);
            col += tint * (disc * 0.5 + rim * 0.5) * uBokehAmt * tw * smoothstep(-0.25, 0.25, y + 0.12);
          }
        }
        gl_FragColor = vec4(col, 1.0);
      }`,
    side: THREE.BackSide, depthWrite: false, depthTest: false,
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(900, 48, 24), m);
  mesh.renderOrder = -100; mesh.frustumCulled = false; mesh.layers.set(1);
  return mesh;
}

const ISL_A = { cx: -60, cz: 1, rx: 17.5, rz: 15 };     // tropical island (left / base end)
const ISL_B = { cx: 37, cz: -3, rx: 10, rz: 12 };       // lighthouse rock (right / shoulder end)

  { x: -30, z: 20, r: 9, h: 6.2 }, { x: 4, z: 21, r: 8, h: 5.6 }, { x: -14, z: -21, r: 11, h: 6.4 },
  { x: 21, z: -20, r: 7, h: 5.2 }, { x: -41, z: -21, r: 6.5, h: 5.2 }, { x: -38, z: 22, r: 6, h: 5.4 },
  { x: 14, z: 5, r: 7, h: 3.4 }, { x: -5, z: -5, r: 8, h: 2.6 },

function profileInterp(pts, d) {
  if (d <= pts[0][0]) return pts[0][1];
  for (let i = 1; i < pts.length; i++) {
    if (d <= pts[i][0]) {
      const t = (d - pts[i - 1][0]) / (pts[i][0] - pts[i - 1][0]), s = t * t * (3 - 2 * t);
      return lerp(pts[i - 1][1], pts[i][1], s * 0.6 + t * 0.4);

  return pts[pts.length - 1][1];
}
const PROF_A = [[0, 9.8], [0.3, 9.0], [0.55, 6.6], [0.75, 3.6], [0.88, 2.0], [0.97, 0.9], [1.06, -0.8], [1.22, -4.0], [1.45, -9.5], [1.7, -12.5], [2.2, -14]];
const PROF_B = [[0, 3.7], [0.45, 3.5], [0.72, 2.7], [0.9, 1.5], [1.0, 0.2], [1.12, -2.6], [1.35, -8.5], [1.65, -12.5], [2.2, -14]];
function islandAHeight(x, z) {
  const dx = (x - ISL_A.cx) / ISL_A.rx, dz = (z - ISL_A.cz) / ISL_A.rz;
  const d = Math.sqrt(dx * dx + dz * dz) * (1 + 0.28 * (fbm(x * 0.07 + 3, z * 0.07, 0, 3) - 0.5));
  let h = SEA_Y + profileInterp(PROF_A, d);
  h += (fbm(x * 0.2, z * 0.2, 5, 2) - 0.5) * 1.6 * sstep(0.2, 0.9, 1 - d * 0.5);
  // second gentle hill on the back side (where the skull rock sits)
  const hx = (x - (ISL_A.cx - 2)) / 7.5, hz = (z - (ISL_A.cz - 6.5)) / 6;
  const hf = 1 - Math.pow(Math.sqrt(hx * hx + hz * hz), 1.5);
  if (hf > 0) h = Math.max(h, SEA_Y + 11.2 * hf);
  return h;
}
function islandBHeight(x, z) {
  const dx = (x - ISL_B.cx) / ISL_B.rx, dz = (z - ISL_B.cz) / ISL_B.rz;
  const d = Math.sqrt(dx * dx + dz * dz) * (1 + 0.32 * (fbm(x * 0.11 + 8, z * 0.11, 0, 3) - 0.5));
  let h = SEA_Y + profileInterp(PROF_B, d);
  h += (fbm(x * 0.35, z * 0.35, 2, 2) - 0.5) * 1.6 * sstep(1.3, 0.2, d);
  const q = Math.round(h / 2) * 2;                          // terraced basalt steps
  return q + (h - q) * 0.35;
}
function seabedH(x, z) {
  let h = SEABED + (fbm(x * 0.05 + 4.1, z * 0.07 - 2.2, 0, 3) - 0.5) * 3.0;
  h += Math.sin(x * 0.42 + z * 0.17 + fbm(x * 0.1, z * 0.1, 3, 2) * 5) * 0.5;
  for (const m of MOUNDS) {
    const d2 = ((x - m.x) ** 2 + (z - m.z) ** 2) / (m.r * m.r);
    if (d2 < 3) h = Math.max(h, SEABED + m.h * Math.exp(-d2 * 1.7) + (fbm(x * 0.3, z * 0.3, 7, 2) - 0.5) * 1.2);
  }
  h = Math.max(h, islandAHeight(x, z), islandBHeight(x, z));
  return h;
}

// sand-art strata (bottom of the bottle shows through the glass)
const STRATA = [[-60, 0x30386b], [-29.6, 0x4a56a2], [-27.4, 0x3c9ba6], [-25.6, 0x8fd2b9], [-24.2, 0xf4e8c4], [-22.9, 0xf2b987], [-21.6, 0xe27c55], [-20.3, 0xb64e3d], [-19.2, 0xf1dfae], [-10, 0xe9d6a3]];
function strataColor(x, y, z) {
  const w = y + 1.3 * Math.sin(x * 0.11 + z * 0.19) + 0.9 * Math.sin(z * 0.33 - x * 0.05) + (ihash(x, y, z) - 0.5) * 0.35 + (fbm(x * 0.1, y * 0.4, z * 0.1, 2) - 0.5) * 1.5;
  let c = STRATA[0][1];
  for (let i = 1; i < STRATA.length; i++) { if (w >= STRATA[i][0]) c = STRATA[i][1]; else break; }
  return jit(c, 0.045, x, y, z);
}

const TERR = { top: null, x0: 0, z0: 0, nx: 0, nz: 0 };
function terrainTop(x, z) {
  x = Math.round(x); z = Math.round(z);
  const i = x - TERR.x0, j = z - TERR.z0;
  if (i < 0 || j < 0 || i >= TERR.nx || j >= TERR.nz) return -999;
  return TERR.top[j * TERR.nx + i];
}

// surface colour of exposed terrain
function surfaceColor(x, y, z, S, slope) {
  const wet = y < SEA_Y + 0.6;
  const inA = ((x - ISL_A.cx) / (ISL_A.rx * 1.35)) ** 2 + ((z - ISL_A.cz) / (ISL_A.rz * 1.35)) ** 2 < 1;
  const inB = ((x - ISL_B.cx) / (ISL_B.rx * 1.3)) ** 2 + ((z - ISL_B.cz) / (ISL_B.rz * 1.3)) ** 2 < 1;
  const n = fbm(x * 0.35, z * 0.35, y * 0.2, 2), h = ihash(x, y, z);
  if (inB && y > SEA_Y - 8) {                                // dark volcanic rock, mossy on top
    let c = mixc(0x4d4a5c, 0x7a7488, n);
    if (y > SEA_Y + 1.5 && slope < 0.9 && n > 0.5) c = mixc(0x4d7a3a, 0x6b9b45, h);
    if (y < SEA_Y + 1.2 && y > SEA_Y - 1.5) c = mixc(c, 0x2d2c38, 0.35);
    return jit(c, 0.07, x, y, z);
  }
  if (inA && y > SEA_Y + 0.8) {
    const grassy = y > SEA_Y + 2.4 && slope < 1.7;
    if (slope > 2.1 && y > SEA_Y + 3) return jit(mixc(0x77726a, 0xa39a8c, n), 0.08, x, y, z);      // cliff rock
    if (grassy) {
      let g = mixc(0x3e9a3c, 0x7bc144, fbm(x * 0.22, z * 0.22, 1, 2));
      if (h > 0.965) g = pick([0xf4c542, 0xf06292, 0xffffff, 0xff7043]);                           // wildflowers
      return jit(g, 0.05, x, y, z);
    }
    return jit(mixc(0xf2e2b0, 0xe6cf92, n), 0.04, x, y, z);                                        // beach
  }
  // sea floor / wet shore
  const rip = 0.5 + 0.5 * Math.sin(x * 0.9 + z * 0.35 + fbm(x * 0.12, z * 0.12) * 6);
  let c = mixc(0xe6d09b, 0xf3e4b9, rip * 0.7 + n * 0.3);
  if (wet) c = mixc(c, 0xc9b27d, 0.25);
  if (y < SEA_Y - 8) c = mixc(c, 0xb9a77f, 0.3);
  return jit(c, 0.04, x, y, z);
}

// Fill the shared world model with sand, strata and islands. Returns nothing; heights are recorded in TERR.
function buildTerrain(W) {
  const x0 = W.x0, x1 = W.x1, z0 = W.z0, z1 = W.z1;
  TERR.x0 = x0; TERR.z0 = z0; TERR.nx = x1 - x0 + 1; TERR.nz = z1 - z0 + 1;
  TERR.top = new Int16Array(TERR.nx * TERR.nz).fill(-999);
  const sh = new Float32Array(TERR.nx * TERR.nz);
  for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) sh[(z - z0) * TERR.nx + (x - x0)] = seabedH(x, z);
  const hAt = (x, z) => sh[clamp(z - z0, 0, TERR.nz - 1) * TERR.nx + clamp(x - x0, 0, TERR.nx - 1)];
  for (let z = z0; z <= z1; z++) {
    for (let x = x0; x <= x1; x++) {
      const rc = rIn(x) - 0.62;
      if (rc <= 0 || Math.abs(z) >= rc) continue;
      const S = hAt(x, z);
      const yTop = Math.round(S);
      const yLow = Math.ceil(-Math.sqrt(rc * rc - z * z));
      if (yTop < yLow) continue;
      const slope = Math.max(Math.abs(hAt(x + 1, z) - hAt(x - 1, z)), Math.abs(hAt(x, z + 1) - hAt(x, z - 1))) * 0.5 * 2;
      TERR.top[(z - z0) * TERR.nx + (x - x0)] = yTop;
      for (let y = yLow; y <= yTop; y++) {
        if (x < BT.xBase + BT.wall + BT.puntDepth + 0.5 && !inCavity(x, Math.hypot(y, z) + 0.5)) continue;
        const depth = yTop - y;
        let c, dry = 0;
        if (depth <= 1 || (depth <= 2 && slope < 0.6 && y > SEA_Y - 4)) c = surfaceColor(x, y, z, S, slope);
        else { c = strataColor(x, y, z); dry = 8; }
        W.put(x, y, z, c, dry);
      }
    }
  }
}

// ======================================================================
// 52_scenery.js
// ======================================================================
// ---------------------------------------------------------------------------
// Scenery: palms, bushes, skull rock, hut, pier, chest, lighthouse, cottage …  (built into the big world model)
// ---------------------------------------------------------------------------
const SCENE = { campfire: null, lighthouse: null, chest: null, hutLight: null, pier: null, chimney: null, flagpole: null, wreck: null, gold: [], skull: null };

function groundY(x, z) { return terrainTop(x, z) + 1; }                 // y of the first free voxel above the terrain
function isLand(x, z, minAboveSea = 1.2) { return terrainTop(x, z) > SEA_Y + minAboveSea; }

function buildPalm(W, bx, bz, h, leanAng, leanAmt, seed) {
  const by = groundY(bx, bz) - 1;
  const trunk = (x, y, z) => jit(((y + 100) % 3 === 0) ? 0x7b5331 : 0x9a6f40, 0.05, x, y, z);
  let px = bx, py = by, pz = bz;
  const N = Math.ceil(h * 1.4);
  for (let i = 1; i <= N; i++) {
    const t = i / N, x = bx + Math.cos(leanAng) * leanAmt * t * t, y = by + t * h, z = bz + Math.sin(leanAng) * leanAmt * t * t;
    W.capsule(px, py, pz, x, y, z, lerp(1.45, 0.8, (i - 1) / N), lerp(1.45, 0.8, t), trunk, 0, Math.round(t * 3));
    px = x; py = y; pz = z;
  }
  const tx = px, ty = py, tz = pz;
  W.ball(tx, ty + 0.4, tz, 1.4, 0x5f8a2b, 0, 4);
  for (let k = 0; k < 3; k++) { const a = k * 2.1 + seed; W.ball(tx + Math.cos(a) * 1.3, ty - 0.5, tz + Math.sin(a) * 1.3, 0.95, 0x5a3b1e, 0, 4); }
  const nF = 8;
  for (let k = 0; k < nF; k++) {
    const phi = k / nF * TAU + seed * 0.7 + (ihash(k, seed | 0, 3) - 0.5) * 0.4;
    const len = 5.4 + ihash(k, 9, seed | 0) * 2.6, el0 = 0.55 + ihash(k, 4, seed | 0) * 0.35;
    const cp = Math.cos(phi), sp = Math.sin(phi);
    for (let s = 0.5; s <= len; s += 0.45) {
      const d = s * Math.cos(el0), y = ty + 0.6 + s * Math.sin(el0) - 0.078 * s * s;
      const x = tx + cp * d, z = tz + sp * d;
      const sway = Math.max(4, Math.min(15, Math.round(4 + s * 1.5)));
      const f = s / len;
      const spine = f > 0.8 ? 0x9fd35a : 0x2e7d32;
      W.set(x, y, z, jit(spine, 0.06, Math.round(x), Math.round(y), Math.round(z)), 0, sway);
      const width = Math.round(2.6 * Math.sin(Math.PI * Math.min(1, f * 1.05)));
      for (let w = 1; w <= width; w++) {
        const droop = Math.floor(w * 0.55);
        const leaf = jit(f > 0.7 ? 0x7fc650 : (w % 2 ? 0x3fa83a : 0x57bd47), 0.07, Math.round(x) + w, Math.round(y), Math.round(z));
        W.set(x - sp * w, y - droop, z + cp * w, leaf, 0, sway);
        W.set(x + sp * w, y - droop, z - cp * w, leaf, 0, sway);
      }
    }
  }
}

function buildBush(W, x, z, r, flowers) {
  const by = groundY(x, z);
  const n = 3 + Math.floor(rnd() * 3);
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, d = rnd() * r * 0.7, rr = r * (0.55 + rnd() * 0.45);
    W.ball(x + Math.cos(a) * d, by + rr * 0.5, z + Math.sin(a) * d, rr, (xx, yy, zz) => jit(mixc(0x2f8c3a, 0x63b947, ihash(xx, yy, zz)), 0.07, xx, yy, zz), 0, 3);
  }
  if (flowers) for (let i = 0; i < 6; i++) {
    const a = rnd() * TAU, d = r * (0.5 + rnd() * 0.6);
    W.set(x + Math.cos(a) * d, by + r * (0.4 + rnd() * 0.9), z + Math.sin(a) * d, pick(flowers), 1, 3);
  }
}

function buildRock(W, x, z, r, palette = [0x7b7a85, 0x9a97a3, 0x62606c]) {
  const by = terrainTop(x, z);
  const c = (xx, yy, zz) => jit(palette[Math.floor(ihash(xx >> 1, yy >> 1, zz >> 1) * palette.length)], 0.06, xx, yy, zz);
  W.ell(x, by + r * 0.5, z, r * (0.9 + rnd() * 0.4), r * (0.65 + rnd() * 0.3), r * (0.9 + rnd() * 0.4), c);
}

function buildFlora(W) {
  seedRng(4242);
  // palms
  const palms = [[-72, 3, 12, 3.3, 3.5], [-69, -9, 10, 4.0, 3], [-57, -1, 14, 0.15, 4.5], [-46, -5, 11, 5.6, 3.5], [-45, 11, 9, 0.5, 2.5], [-66, 14, 9, 2.2, 3], [-49, 2, 8, 5.9, 2.5]];
  palms.forEach((p, i) => { if (isLand(p[0], p[1], 2.2)) buildPalm(W, p[0], p[1], p[2], p[3], p[4], i * 1.7); });
  // bushes with tropical flowers
  const fl = [0xff5d8f, 0xffd447, 0xff8a3d, 0xffffff];
  [[-64, 3, 2.1], [-53, 10, 1.8], [-58, 8, 1.6], [-49, 2, 1.7], [-72, 4, 1.9], [-62, -3, 2.2], [-54, -9, 1.9], [-67, 12, 1.5]].forEach(([x, z, r]) => { if (isLand(x, z, 2.0)) buildBush(W, x, z, r, fl); });
  // grass tufts + tiny flowers over the green parts
  for (let x = -80; x <= -40; x++) for (let z = -20; z <= 20; z++) {
    const t = terrainTop(x, z);
    if (t < SEA_Y + 2.6) continue;
    const r = ihash(x, 7, z);
    if (r < 0.2 && !W.has(x, t + 1, z)) {
      W.set(x, t + 1, z, jit(mixc(0x4da83c, 0x9ad04a, ihash(z, x, 3)), 0.06, x, 1, z), 0, 9);
      if (r < 0.08) W.set(x, t + 2, z, 0x9bd64f, 0, 15);
    } else if (r > 0.992) W.set(x, t + 1, z, pick([0xff5d8f, 0xffd447, 0xffffff, 0xff8a3d]), 1, 4);
  }
  // beach stones and shells
  for (let k = 0; k < 14; k++) {
    const a = rnd() * TAU, d = 0.82 + rnd() * 0.2, x = Math.round(ISL_A.cx + Math.cos(a) * ISL_A.rx * d), z = Math.round(ISL_A.cz + Math.sin(a) * ISL_A.rz * d);
    const t = terrainTop(x, z);
    if (t > SEA_Y - 0.5 && t < SEA_Y + 2.8 && !W.has(x, t + 1, z)) W.set(x, t + 1, z, pick([0xf4a6a0, 0xffffff, 0xe0c0a0, 0xd0d0d8, 0xff9f5a]), 0, 0);
  }
  for (const [x, z, r] of [[-47, -6, 1.6], [-44, 8, 1.4], [-74, 6, 1.6], [-72, -9, 2.0], [-53, 14, 1.5], [-68, 15, 1.3]]) if (terrainTop(x, z) > SEA_Y - 1) buildRock(W, x, z, r);
}

// ---- structures ----------------------------------------------------------------------
function buildSkullRock(W, cx, cz) {
  const base = terrainTop(cx, cz) + 1;
  const bone = (x, y, z) => jit(mixc(0xcfc8b6, 0xe9e3d3, ihash(x >> 1, y >> 1, z >> 1)), 0.05, x, y, z);
  const cy = base + 4.6;
  W.ell(cx, cy, cz, 5.4, 4.7, 4.6, bone);                                            // cranium
  W.ell(cx, cy - 3.6, cz + 0.8, 3.7, 2.2, 3.5, bone);                                // jaw block
  // eye sockets, nose, teeth gaps
  W.ellDel(cx - 2.2, cy + 0.3, cz + 3.8, 1.55, 1.75, 1.8); W.ellDel(cx + 2.2, cy + 0.3, cz + 3.8, 1.55, 1.75, 1.8);
  W.ellDel(cx, cy - 1.6, cz + 4.2, 0.7, 1.0, 1.2);
  for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) W.set(cx + sx * 0.5 + (sx > 0 ? i : -i) * 0.0, cy - 3.2, cz + 4.3, bone);
  W.boxDel(cx - 2, cy - 4, cz + 3.2, cx + 2, cy - 3, cz + 4.4);                      // mouth cavity
  for (let i = -2; i <= 2; i += 1) { W.set(cx + i, cy - 3, cz + 4, i % 2 ? 0xfffbe8 : bone); W.set(cx + i, cy - 4, cz + 4, 0xfffbe8); }
  // glowing eyes deep inside the sockets (red, always faint, bright at night)
  for (const sx of [-2.2, 2.2]) { W.ball(cx + sx, cy + 0.3, cz + 2.9, 1.0, 0xff3a2a, 4); }
  // moss on top + dangling roots
  for (let i = 0; i < 22; i++) { const a = rnd() * TAU, d = rnd() * 3.5; W.set(cx + Math.cos(a) * d, cy + 4.2 - d * 0.35, cz + Math.sin(a) * d * 0.8, pick([0x4d9a3c, 0x6bb347]), 0, 4); }
  SCENE.skull = { x: cx, y: cy, z: cz + 3 };
}

function buildHut(W, cx, cz, floorY) {
  const wall = (x, y, z) => jit(((x + z) % 2 === 0) ? 0xd9b66a : 0xc9a255, 0.05, x, y, z);
  // stilts down to the ground
  for (const [dx, dz] of [[-3, -2], [3, -2], [-3, 2], [3, 2], [0, -2], [0, 2]]) {
    for (let y = floorY - 1; y > floorY - 9; y--) { if (W.has(cx + dx, y, cz + dz) && y < floorY - 1) break; W.put(cx + dx, y, cz + dz, jit(0x6f4a2c, 0.07, dx, y, dz)); }
  }
  W.box(cx - 4, floorY, cz - 3, cx + 4, floorY, cz + 3, (x, y, z) => ((z + 20) % 2 ? 0xa97b4a : 0xb98a55));
  // walls with a door (front, +z) and windows
  for (let y = floorY + 1; y <= floorY + 4; y++) for (let x = cx - 3; x <= cx + 3; x++) for (const z of [cz - 2, cz + 2]) W.put(x, y, z, wall);
  for (let y = floorY + 1; y <= floorY + 4; y++) for (const x of [cx - 3, cx + 3]) for (let z = cz - 2; z <= cz + 2; z++) W.put(x, y, z, wall);
  W.boxDel(cx - 1, floorY + 1, cz + 2, cx, floorY + 3, cz + 2);                                    // door opening
  W.box(cx - 1, floorY + 1, cz + 1, cx, floorY + 3, cz + 1, 0x24170e);                              // dark interior behind it
  W.box(cx - 2, floorY + 3, cz + 2, cx - 2, floorY + 3, cz + 2, 0xffd36a, 4); W.set(cx + 2, floorY + 3, cz + 2, 0xffd36a, 4);
  W.set(cx - 3, floorY + 3, cz, 0xffd36a, 4); W.set(cx + 3, floorY + 3, cz, 0xffd36a, 4);
  // thatched roof (ridge along x)
  for (let layer = 0; layer < 5; layer++) {
    const y = floorY + 5 + layer, hw = 3.6 - layer * 0.8, xr = 4.8 - layer * 0.4;
    for (let x = Math.round(cx - xr); x <= Math.round(cx + xr); x++) for (let z = Math.round(cz - hw); z <= Math.round(cz + hw); z++) {
      if (layer > 0 && Math.abs(z - cz) < hw - 1.2 && Math.abs(x - cx) < xr - 1) continue;
      W.put(x, y, z, (xx, yy, zz) => jit(mixc(0xd6a84a, 0xb88a35, ihash(xx, layer, zz)), 0.08, xx, yy, zz), 0, 2);
    }
  }
  W.box(cx - 5, floorY + 9, cz, cx + 5, floorY + 9, cz, 0xb88a35);
  // porch + bamboo railing + a hanging lantern
  W.box(cx - 2, floorY, cz + 4, cx + 1, floorY, cz + 5, 0xb98a55);
  for (const x of [cx - 2, cx + 1]) { W.box(x, floorY + 1, cz + 5, x, floorY + 3, cz + 5, 0x8a6a3a); }
  W.set(cx - 2, floorY + 3, cz + 4, 0xffcf5a, 4);
  SCENE.hutLight = { x: cx, y: floorY + 3, z: cz + 5 };
}

function buildPier(W, x0, z0, len, deckY) {
  for (let i = 0; i < len; i++) {
    const x = x0 + i;
    for (const dz of [0, 1]) W.put(x, deckY, z0 + dz, jit((i % 2) ? 0x9c7040 : 0xb08050, 0.06, x, deckY, z0 + dz));
    if (i % 3 === 0) for (const dz of [-1, 2]) { for (let y = deckY + 1; y >= SEA_Y - 12; y--) { if (W.has(x, y - 1, z0 + dz) && y < deckY - 2) break; W.put(x, y, z0 + dz, 0x5c3d24); } W.put(x, deckY + 1, z0 + dz, 0x5c3d24); }
  }
  SCENE.pier = { x: x0 + len, z: z0 + 0.5, y: deckY };
}

function buildCampfire(W, x, z) {
  const y = terrainTop(x, z) + 1;
  for (let a = 0; a < 8; a++) { const t = a / 8 * TAU; W.ball(x + Math.cos(t) * 2.5, y, z + Math.sin(t) * 2.5, 0.9, pick([0x7d7a86, 0x9b98a4, 0x6a6874])); }
  W.capsule(x - 1.5, y, z - 0.6, x + 1.2, y + 0.9, z + 0.7, 0.55, 0.55, 0x4a2f1a);
  W.capsule(x + 0.4, y, z - 1.5, x - 0.5, y + 0.9, z + 1.4, 0.55, 0.55, 0x5a3a20);
  W.set(x, y, z, 0x2b2b2b);
  // a log seat + crate + barrel
  W.capsule(x + 5.5, y, z + 1, x + 5.5, y, z + 5, 0.9, 0.9, 0x8b5a33);
  W.box(x - 6, y, z + 2, x - 5, y + 1, z + 3, jitterFn(0xb98650, 0.07)); W.cylY(x - 5, z - 3, 1.2, y, y + 2, (xx, yy, zz) => (yy === y + 1 ? 0xc9a03a : jit(0xa67b4a, 0.07, xx, yy, zz)));
  SCENE.campfire = { x, y: y + 1, z };
}

function buildChest(W, x, z) {
  const y = terrainTop(x, z) + 1;
  const wood = (xx, yy, zz) => jit(0x8b5530, 0.07, xx, yy, zz);
  W.box(x - 2, y, z - 1, x + 2, y + 2, z + 1, wood);
  W.box(x - 2, y + 3, z - 1, x + 2, y + 3, z + 1, wood); W.box(x - 1, y + 4, z - 1, x + 1, y + 4, z + 1, wood);
  for (const dx of [-2, 2]) W.box(x + dx, y, z - 1, x + dx, y + 3, z + 1, 0xd9a93f);
  W.box(x, y + 2, z + 2, x, y + 3, z + 2, 0xd9a93f);
  // lid ajar with a glint of gold coins
  W.box(x - 1, y + 3, z - 1, x + 1, y + 3, z + 1, (xx, yy, zz) => (ihash(xx, yy, zz) > 0.5 ? 0xffd34d : 0xf0b429), 5);

const CORAL_PAL = [[0xff5d8f, 0xff9ab5], [0xff8a3d, 0xffc08a], [0xb06bff, 0xd9b0ff], [0xffd447, 0xfff0a0], [0x3fd1c8, 0x9af0ea], [0xff4d4d, 0xff9a9a], [0x7bd957, 0xc6f2a8]];

function coralBrain(W, x, y, z, r, pal) {

}
function coralBranch(W, x, y, z, dx, dy, dz, len, rad, depth, pal) {
  const nx = x + dx * len, ny = y + dy * len, nz = z + dz * len;
  W.capsule(x, y, z, nx, ny, nz, rad, rad * 0.8, depth === 0 ? pal[1] : pal[0], 0, 0);
  if (depth === 0) return;
  const n = depth > 2 ? 3 : 2;
  for (let i = 0; i < n; i++) {
    let ax = dx + (rnd() - 0.5) * 1.3, ay = dy * 0.7 + 0.45 + rnd() * 0.3, az = dz + (rnd() - 0.5) * 1.3;
    const l = Math.hypot(ax, ay, az); ax /= l; ay /= l; az /= l;
    coralBranch(W, nx, ny, nz, ax, ay, az, len * (0.72 + rnd() * 0.15), Math.max(0.5, rad * 0.82), depth - 1, pal);
  }
}
function coralTubes(W, x, y, z, pal) {
  const n = 4 + Math.floor(rnd() * 4);
  for (let i = 0; i < n; i++) {
    const a = rnd() * TAU, d = rnd() * 2.2, h = 2.5 + rnd() * 3.5, cx = x + Math.cos(a) * d, cz = z + Math.sin(a) * d;
    W.cylY(cx, cz, 1.0, y, y + h, (xx, yy, zz) => (yy > y + h - 0.6 ? pal[1] : pal[0]));
    W.del(cx, y + h, cz);

}
function coralFan(W, x, y, z, r, pal, rot) {
  const rib = (u) => (Math.sin(u * 14) > 0.15 ? pal[0] : pal[1]);
  for (let u = -r; u <= r; u += 0.5) for (let v = 0; v <= r * 1.2; v += 0.5) {
    const rad = Math.hypot(u, v - 0.2 * r);
    if (rad > r || rad < 0.8) continue;
    const ang = Math.atan2(u, v);
    const px = rot ? x : x + u, pz = rot ? z + u : z;
    W.set(px, y + 1 + v, pz, rib(ang), 0, Math.round(3 + v * 2));
  }

}
function coralTable(W, x, y, z, r, pal) {
  W.cylY(x, z, 0.8, y, y + 2, pal[0]);
  W.cylY(x, z, r, y + 3, y + 3, (xx, yy, zz) => (Math.hypot(xx - x, zz - z) > r - 1.1 ? pal[1] : pal[0]));
  W.cylY(x, z, r * 0.6, y + 4, y + 4, pal[0]);
}
function anemone(W, x, y, z) {
  const base = 0xd44a8d, tip = pick([0xffa6d9, 0xc8ff6a, 0xfff08a]);
  W.ell(x, y + 0.5, z, 1.5, 1.1, 1.5, base);

  }
}
function urchin(W, x, y, z) {
  W.ball(x, y + 1, z, 1.0, 0x2a1d3c);
  for (let i = 0; i < 14; i++) { const a = rnd() * TAU, e = rnd() * 1.4 - 0.1; W.line(x, y + 1, z, x + Math.cos(a) * Math.cos(e) * 2.4, y + 1 + Math.sin(e) * 2.4, z + Math.sin(a) * Math.cos(e) * 2.4, 0x4b2f6e); }
}
function starfish(W, x, y, z, col) {

}
function kelp(W, x, z, h) {

function reefAt(W, cx, cz, rad, count) {

function buildWreck(W, cx, cz) {
  const baseY = terrainTop(cx, cz) + 1;
  const lean = 0.16;
  const wood = (x, y, z) => { const n = ihash(x, y, z); return n > 0.88 ? 0x5f8f6a : mixc(0x4a3a30, 0x6a5240, n); };
  const P = (x, y, z, c, e = 0, w = 0) => W.set(cx + x, baseY + y + z * lean + 1.2, cz + z, c, e, w);
  // keel + ribs (the near/starboard side has collapsed, the far side still stands)
  for (let x = -11; x <= 11; x++) P(x, 0, 0, wood);
  for (let x = -10; x <= 10; x += 2) {
    const wmax = 3.6 * Math.cos(x / 11 * 1.25);

      const w = wmax * Math.sin(Math.min(1, (y + 0.8) / 5.2) * Math.PI * 0.5 + 0.35) * 0.95;

    const wmax = 3.6 * Math.cos(x / 11 * 1.25);
    for (let y = 0; y <= 4; y++) { if (ihash(x, y, 11) < 0.62 + 0.3 * (4 - y) / 4) { const w = wmax * Math.sin(Math.min(1, (y + 0.8) / 5.2) * Math.PI * 0.5 + 0.35) * 0.95; P(x, y, -Math.round(w), (xx, yy, zz) => wood(xx, yy, zz)); } }
  }

  for (let x = -8; x <= 6; x += 3) for (let z = -3; z <= 3; z++) P(x, 3, z, 0x5a4636);
  for (let x = -8; x <= 0; x++) for (let z = -3; z <= 0; z++) if (ihash(x, z, 4) > 0.35) P(x, 3, z, mixc(0x6a5240, 0x3e6b52, ihash(x, 9, z)));

  for (let i = 0; i < 4; i++) P(-1, topY + 1, 1 + i, 0x1b1b21, 0, 8 + i * 2);

  W.capsule(cx - 6, baseY + 0.5, cz + 5, cx - 2, baseY + 1.2, cz + 6, 0.9, 0.9, 0x2b2e35);
  W.line(cx + 8, baseY, cz + 4, cx + 8, baseY + 4, cz + 4, 0x3a3d46); W.line(cx + 7, baseY + 1, cz + 4, cx + 9, baseY + 1, cz + 4, 0x3a3d46); W.line(cx + 7, baseY, cz + 4, cx + 9, baseY, cz + 4, 0x3a3d46);
  for (const [x, z] of [[-9, 4], [-8, 6]]) { W.ell(cx + x, baseY + 1.5, cz + z, 1, 1.6, 1, (xx, yy, zz) => jit(0xc9703a, 0.1, xx, yy, zz)); W.set(cx + x, baseY + 3.5, cz + z, 0xc9703a); }
  // treasure

  W.box(cx + 1, gy, cz + 5, cx + 4, gy + 1, cz + 7, 0x7a5532);
  for (let i = 0; i < 16; i++) W.set(cx + 1 + rnd() * 3.5, gy + 1 + (rnd() < 0.6 ? 1 : 0), cz + 5 + rnd() * 3, pick([0xffd34d, 0xf0b429, 0xffe58a]), 5);
  W.set(cx + 2, gy + 3, cz + 6, 0xff4d6d, 6); W.set(cx + 3, gy + 2, cz + 7, 0x4dd0ff, 6);

  if (typeof buildUnderwater === 'function') stages.push(['Growing the reef…', 0.6, () => buildUnderwater(W)]);
  for (const [msg, p, fn] of stages) { setLoad(msg, p); await nextFrame(); fn(); }

  setLoad('Meshing ' + W.count.toLocaleString() + ' voxels…', 0.7); await nextFrame();
  const geo = voxGeometry(W);
  WORLD.terrainFaces = geo.userData.faces;
  const mat = makeVoxMat({ clip: true, uw: true, sway: true, reveal: true });

  mesh.castShadow = true; mesh.receiveShadow = true; mesh.frustumCulled = false;
  scene.add(mesh);

  // water
  setLoad('Filling the bottle…', 0.78); await nextFrame();

  shell.frustumCulled = false; shell.renderOrder = 5; shell.layers.set(1);
  scene.add(shell);
  WORLD.waterTop = top; WORLD.shell = shell;
  water.setSea(GAME.seaLevel);
  water.update(0);
  updaters.push((dt) => { water.setSea(GAME.seaLevel); water.update(dt); });

  if (typeof buildFX === 'function') await buildFX(scene);
  if (typeof buildLife === 'function') { setLoad('Waking the sea life…', 0.84); await nextFrame(); await buildLife(scene); }
  if (typeof buildShip === 'function') { setLoad('Launching the ship…', 0.9); await nextFrame(); await buildShip(scene); }
  if (typeof buildSerpent === 'function') await buildSerpent(scene);
  if (typeof buildSky === 'function') { setLoad('Hanging the sun…', 0.95); await nextFrame(); await buildSky(scene); }
}

// ---------------------------------------------------------------------------
// Water: shallow-water solver + analytic swell, quantised into voxel columns on the GPU
// ---------------------------------------------------------------------------
class Water {
  constructor() {
    const nx = WG.nx, nz = WG.nz, n = nx * nz;
    this.nx = nx; this.nz = nz; this.n = n;
    this.h = new Float32Array(n);          // simulated displacement (wakes, splashes, sloshing)
    this.qx = new Float32Array(n);         // flux through the +x face
    this.qz = new Float32Array(n);         // flux through the +z face
    this.src = new Float32Array(n);        // height added this frame (sources)
    this.foam = new Float32Array(n);
    this.tot = new Float32Array(n);        // total height offset (swell + sim)
    this.hq = new Int8Array(n);            // quantised voxel offset with hysteresis
    this.mask = new Uint8Array(n);
    this.c2 = new Float32Array(n);
    this.depth = new Float32Array(n);
    this.edge = new Float32Array(n);
    this.env = new Float32Array(n);
    this.bed = new Float32Array(n);
    this.phi = [];                         // per-wave static phase fields
    this.data = new Float32Array(n * 4);
    this.tex = new THREE.DataTexture(this.data, nx, nz, THREE.RGBAFormat, THREE.FloatType);
    this.tex.minFilter = this.tex.magFilter = THREE.NearestFilter; this.tex.generateMipmaps = false; this.tex.needsUpdate = true;
    U.waterTex.value = this.tex;
    this.t = 0; this.amp = 0.62; this.windSpeed = 8;
    const mk = (lambda, deg, a, ph) => { const k = TAU / lambda, d = deg * Math.PI / 180; return { kx: k * Math.cos(d), kz: k * Math.sin(d), om: Math.sqrt(G * k), a, ph }; };
    this.waves = [mk(27, -10, 1.0, 0.3), mk(17, 36, 0.52, 1.7), mk(10.5, -50, 0.26, 4.1), mk(44, 7, 0.62, 2.4)];
    this.initMask();
    this.liftT = 0;                        // intro: water rises from the floor (0..1)
  }
  initMask() {
    const { nx, nz, n } = this;
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
      const idx = j * nx + i, x = WG.x0 + i, z = WG.z0 + j;
      const bed = seabedH(x, z); this.bed[idx] = bed;
      const rc = rIn(x) - 0.3;
      const inside = rc > 0 && (SEA_Y * SEA_Y + (Math.abs(z) + 0.5) ** 2) < rc * rc;
      const ok = inside && bed < SEA_Y - 0.6;
      this.mask[idx] = ok ? 1 : 0;
      this.depth[idx] = ok ? SEA_Y - bed : 0;
      this.c2[idx] = G * clamp(this.depth[idx], 0.6, 3.4);
    }
    // distance to the nearest dry/solid cell (chamfer)
    const e = this.edge;
    for (let k = 0; k < n; k++) e[k] = this.mask[k] ? 99 : 0;
    for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) {
      const k = j * nx + i; if (!e[k]) continue;
      let m = e[k]; if (i > 0) m = Math.min(m, e[k - 1] + 1); if (j > 0) m = Math.min(m, e[k - nx] + 1); e[k] = m;
    }
    for (let j = nz - 1; j >= 0; j--) for (let i = nx - 1; i >= 0; i--) {
      const k = j * nx + i; if (!e[k]) continue;
      let m = e[k]; if (i < nx - 1) m = Math.min(m, e[k + 1] + 1); if (j < nz - 1) m = Math.min(m, e[k + nx] + 1); e[k] = m;
    }
    for (let k = 0; k < n; k++) this.env[k] = this.mask[k] ? sstep(0.4, 4.5, this.depth[k]) * sstep(0.2, 4.0, e[k]) : 0;
    for (const w of this.waves) {
      const f = new Float32Array(n);
      for (let j = 0; j < nz; j++) for (let i = 0; i < nx; i++) f[j * nx + i] = w.kx * (WG.x0 + i) + w.kz * (WG.z0 + j) + w.ph;
      this.phi.push(f);
    }
  }
  setSea(level) {                          // 0 calm .. 2 storm
    this.amp = level < 1 ? lerp(0.32, 0.62, level) : lerp(0.62, 1.55, level - 1);
    this.windSpeed = level < 1 ? lerp(4, 8, level) : lerp(8, 17, level - 1);
  }
  step(dt) {
    const { nx, nz, h, qx, qz, src, mask, c2 } = this;
    const damp = Math.max(0, 1 - 0.5 * dt);
    for (let j = 0; j < nz; j++) {
      let idx = j * nx;
      for (let i = 0; i < nx; i++, idx++) {
        if (!mask[idx]) { qx[idx] = 0; qz[idx] = 0; continue; }
        if (i < nx - 1 && mask[idx + 1]) qx[idx] = (qx[idx] - dt * 0.5 * (c2[idx] + c2[idx + 1]) * (h[idx + 1] - h[idx])) * damp; else qx[idx] = 0;
        if (j < nz - 1 && mask[idx + nx]) qz[idx] = (qz[idx] - dt * 0.5 * (c2[idx] + c2[idx + nx]) * (h[idx + nx] - h[idx])) * damp; else qz[idx] = 0;
      }
    }
    for (let j = 0; j < nz; j++) {
      let idx = j * nx;
      for (let i = 0; i < nx; i++, idx++) {
        if (!mask[idx]) { h[idx] = 0; src[idx] = 0; continue; }
        const l = i > 0 ? qx[idx - 1] : 0, d = j > 0 ? qz[idx - nx] : 0;
        let sv = src[idx]; sv = sv > 0.3 ? 0.3 : (sv < -0.3 ? -0.3 : sv);
        let nh = h[idx] + dt * (-(qx[idx] - l) - (qz[idx] - d)) + sv;
        if (nh > 3.2) nh = 3.2 + (nh - 3.2) * 0.3; else if (nh < -3.2) nh = -3.2 + (nh + 3.2) * 0.3;
        h[idx] = nh; src[idx] = 0;
        // tiny numerical viscosity keeps grid-scale noise away
        h[idx] *= 1 - 0.02 * dt;
      }
    }
  }
  update(dt) {
    this.t += dt;
    if (dt > 0) this.step(Math.min(dt, 1 / 30));
    const { n, tot, h, env, mask, waves, phi, t, amp, foam } = this;
    const om = waves.map((w) => w.om * t);
    const crest = 0.85 * amp + 0.7;
    const fdecay = Math.exp(-dt / 3.2);
    for (let k = 0; k < n; k++) {
      if (!mask[k]) { tot[k] = 0; continue; }
      let s = 0;
      for (let w = 0; w < 4; w++) { const p = phi[w][k] - om[w]; s += waves[w].a * Math.sin(p + 0.35 * Math.sin(p)); }
      const v = s * amp * env[k] + h[k];
      tot[k] = v;
      let f = foam[k] * fdecay;
      if (v > crest) f += (v - crest) * dt * (0.8 + amp * 0.5);
      if (this.edge[k] < 2.1 && Math.abs(h[k]) > 0.12) f += Math.abs(h[k]) * dt * 1.2;
      foam[k] = f > 1 ? 1 : f;
      // quantise with hysteresis so the steps don't flicker
      const q = this.hq[k];
      if (Math.abs(v - q) > 0.62) this.hq[k] = Math.round(clamp(v, -12, 12));
    }
    this.writeTexture();
  }
  writeTexture() {
    const { n, data, mask, hq, foam, bed } = this;
    for (let k = 0; k < n; k++) {
      const o = k * 4;
      if (!mask[k]) { data[o] = SEA_Y; data[o + 1] = 0; data[o + 2] = 0; data[o + 3] = 0; continue; }
      const top = SEA_Y + hq[k];
      data[o] = top; data[o + 1] = foam[k]; data[o + 2] = Math.max(top - bed[k], 0.3); data[o + 3] = 1;
    }
    this.tex.needsUpdate = true;
  }
  // continuous surface offset (relative to SEA_Y) at world x,z
  height(x, z) {
    const u = x - WG.x0, v = z - WG.z0;
    const i = Math.floor(u), j = Math.floor(v);
    if (i < 0 || j < 0 || i >= this.nx - 1 || j >= this.nz - 1) return 0;
    const fx = u - i, fz = v - j, a = j * this.nx + i, t = this.tot;
    const top = t[a] + (t[a + 1] - t[a]) * fx, bot = t[a + this.nx] + (t[a + this.nx + 1] - t[a + this.nx]) * fx;
    return top + (bot - top) * fz;
  }
  isWater(x, z) {
    const i = Math.round(x - WG.x0), j = Math.round(z - WG.z0);
    return i >= 0 && j >= 0 && i < this.nx && j < this.nz && this.mask[j * this.nx + i] === 1;
  }
  depthAt(x, z) {
    const i = Math.round(x - WG.x0), j = Math.round(z - WG.z0);
    return (i >= 0 && j >= 0 && i < this.nx && j < this.nz) ? this.depth[j * this.nx + i] : 0;
  }
  // bilinear splat helpers
  _splat(arr, x, z, v) {
    const u = x - WG.x0, w = z - WG.z0, i = Math.floor(u), j = Math.floor(w);
    if (i < 0 || j < 0 || i >= this.nx - 1 || j >= this.nz - 1) return;
    const fx = u - i, fz = w - j, a = j * this.nx + i, m = this.mask;
    if (m[a]) arr[a] += v * (1 - fx) * (1 - fz);
    if (m[a + 1]) arr[a + 1] += v * fx * (1 - fz);
    if (m[a + this.nx]) arr[a + this.nx] += v * (1 - fx) * fz;
    if (m[a + this.nx + 1]) arr[a + this.nx + 1] += v * fx * fz;
  }
  splat(x, z, v) { this._splat(this.src, x, z, v); }
  addFoam(x, z, v) { this._splat(this.foam, x, z, v); }
  // an instantaneous Gaussian bump (rain drop, cannonball, finger…)
  bump(x, z, amp, sigma = 1.3, foamAmt = 0.6) {
    const r = Math.ceil(sigma * 3);
    const cx = Math.round(x - WG.x0), cz = Math.round(z - WG.z0);
    for (let dj = -r; dj <= r; dj++) for (let di = -r; di <= r; di++) {
      const i = cx + di, j = cz + dj;
      if (i < 0 || j < 0 || i >= this.nx || j >= this.nz) continue;
      const k = j * this.nx + i; if (!this.mask[k]) continue;
      const dx = WG.x0 + i - x, dz = WG.z0 + j - z, g = Math.exp(-(dx * dx + dz * dz) / (2 * sigma * sigma));
      this.h[k] += amp * g; this.foam[k] = Math.min(1, this.foam[k] + foamAmt * g);
    }
  }
  poke(x, z) {
    if (!this.isWater(x, z)) return;
    this.bump(x, z, -1.2, 1.1, 0.8);
    this.bump(x, z, 1.0, 2.4, 0.2);
    if (WORLD.fx) WORLD.fx.splash(x, SEA_Y + this.height(x, z), z, 1.2);
    if (typeof audioSplash === 'function') audioSplash(0.9);
  }
  // horizontal sloshing from an accelerating bottle: pushes the fluxes
  slosh(ax, az, dt) {
    const { nx, nz, qx, qz, mask, c2 } = this;
    for (let k = 0; k < this.n; k++) if (mask[k]) { qx[k] -= ax * dt * this.depth[k] * 0.4; qz[k] -= az * dt * this.depth[k] * 0.4; }
  }
}

// ---- GPU-driven column mesh --------------------------------------------------------
function buildWaterTopGeometry(water) {
  const FA = [1, 0, 0, 2, 2], FS = [1, 1, -1, 1, -1], FU = [2, 1, 2, 0, 1], FV = [0, 2, 1, 1, 0];
  const nCells = water.mask.reduce((a, b) => a + b, 0);
  const pos = new Float32Array(nCells * 20 * 3), nor = new Float32Array(nCells * 20 * 3), cel = new Float32Array(nCells * 20 * 3);
  const idx = new Uint32Array(nCells * 30);
  let vi = 0, ii = 0;
  const p = [0, 0, 0];
  for (let j = 0; j < water.nz; j++) for (let i = 0; i < water.nx; i++) {
    if (!water.mask[j * water.nx + i]) continue;
    for (let f = 0; f < 5; f++) {
      const base = vi;
      for (let k = 0; k < 4; k++) {
        p[0] = p[1] = p[2] = 0;
        p[FA[f]] = 0.5 * FS[f]; p[FU[f]] = 0.5 * CU[k]; p[FV[f]] = 0.5 * CV[k];
        pos[vi * 3] = p[0]; pos[vi * 3 + 1] = p[1] + 0.5; pos[vi * 3 + 2] = p[2];
        nor[vi * 3 + FA[f]] = FS[f];
        cel[vi * 3] = i; cel[vi * 3 + 1] = j; cel[vi * 3 + 2] = f;
        vi++;
      }
      idx[ii++] = base; idx[ii++] = base + 1; idx[ii++] = base + 2; idx[ii++] = base; idx[ii++] = base + 2; idx[ii++] = base + 3;
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setAttribute('aCell', new THREE.BufferAttribute(cel, 3));
  g.setIndex(new THREE.BufferAttribute(idx, 1));
  g.boundingSphere = new THREE.Sphere(new THREE.Vector3(-10, -10, 0), 140);
  return g;
}

function makeWaterTopMaterial() {
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff, transparent: true, depthWrite: false });
  mat.customProgramCacheKey = () => 'watertop';

      .replace('#include <project_vertex>', `#include <project_vertex>

    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', `#include <common>
${GLSL_UNI}${GLSL_FUNCS}
uniform sampler2D uDepthTex; uniform float uDepthBase; uniform vec2 uRes;
varying float vFoam; varying float vDepth; varying float vTop; varying float vFace; varying vec3 vWPos;`)
      .replace('void main() {', `void main() {
{ float rc0 = bottleR(vWPos.x); if (dot(vWPos.yz, vWPos.yz) > rc0 * rc0) discard; }`)

      .replace('#include <aomap_fragment>', `#include <aomap_fragment>
{
  vec3 Vv = normalize(cameraPosition - vWPos);

  };

}

// inner-wall "shell" that tints the water seen through the glass (an aquarium side window)
function buildShellGeometry() {
  const pts = PROFILE.inner.filter((p) => p[0] <= 68);
  const seg = 128, nP = pts.length, row = seg + 1;
  const pos = new Float32Array(nP * row * 3), nor = new Float32Array(nP * row * 3);
  for (let i = 0; i < nP; i++) {
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(nP - 1, i + 1)];
    let tx = b[0] - a[0], tr = b[1] - a[1]; const l = Math.hypot(tx, tr) || 1; tx /= l; tr /= l;
    const nx = -tr, nr = tx, r = Math.max(0, pts[i][1] - 0.04);
    for (let j = 0; j <= seg; j++) {
      const ph = j / seg * TAU, cp = Math.cos(ph), sp = Math.sin(ph), k = i * row + j;
      pos[k * 3] = pts[i][0]; pos[k * 3 + 1] = r * cp; pos[k * 3 + 2] = r * sp;
      nor[k * 3] = nx; nor[k * 3 + 1] = nr * cp; nor[k * 3 + 2] = nr * sp;
    }
  }
  const idx = [];
  for (let i = 0; i < nP - 1; i++) for (let j = 0; j < seg; j++) {
    const a = i * row + j, b = a + 1, c = a + row, d = c + 1;
    idx.push(a, b, c, b, d, c);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.BufferAttribute(nor, 3));
  g.setIndex(idx); g.computeBoundingSphere();
  return g;
}
function makeShellMaterial() {
  return new THREE.ShaderMaterial({
    uniforms: Object.assign({ uDepthTex: U.depthTex, uDepthBase: U.depthBase, uRes: U.res }, sharedUniforms()),

        vec3 toF = vP - cameraPosition; float tEntry = length(toF); vec3 rd = toF / tEntry;
