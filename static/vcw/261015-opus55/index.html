<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ship in a Bottle — Voxel Diorama</title>
<style>
  :root { color-scheme: dark; --panel: rgba(18, 22, 34, 0.62); --line: rgba(255, 236, 200, 0.16); --ink: #f3ead8; --dim: #b9ae98; --gold: #e8b860; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07080d; color: var(--ink);
    font-family: ui-serif, Georgia, "Times New Roman", serif; }
  canvas { display: block; touch-action: none; outline: none; }
  #title { position: fixed; top: 16px; left: 20px; pointer-events: none; text-shadow: 0 2px 12px rgba(0,0,0,.6); }
  #title h1 { margin: 0; font-size: 26px; letter-spacing: .06em; font-weight: 600; color: var(--gold); }
  #title p { margin: 4px 0 0; font: 13px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #efe4cc; text-shadow: 0 1px 3px rgba(0,0,0,.9), 0 0 14px rgba(0,0,0,.6); }
  #hud { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-wrap: wrap; gap: 8px;
    align-items: center; justify-content: center; padding: 10px 12px; max-width: calc(100vw - 32px); box-sizing: border-box;
    background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px); font: 13px ui-sans-serif, system-ui, "Segoe UI", sans-serif; }
  .btn { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,.04); color: var(--ink);
    padding: 7px 12px; border-radius: 9px; cursor: pointer; font: inherit; transition: background .15s, border-color .15s; white-space: nowrap; }
  .btn:hover { background: rgba(255,255,255,.1); }
  .btn.on { background: rgba(232,184,96,.22); border-color: rgba(232,184,96,.65); color: #fff4dc; }
  #hud label { display: flex; align-items: center; gap: 8px; color: var(--dim); padding: 0 4px; }
  #tod { width: 120px; accent-color: var(--gold); }
  #clock { min-width: 44px; color: var(--ink); font-variant-numeric: tabular-nums; }
  #help { position: fixed; top: 14px; right: 16px; font: 12px/1.6 ui-sans-serif, system-ui, "Segoe UI", sans-serif; color: #d8ccb4;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    text-align: right; pointer-events: none; text-shadow: 0 1px 8px rgba(0,0,0,.7); }
  #help b { color: var(--ink); font-weight: 600; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #1b2233, #07080d 70%);
    z-index: 10; transition: opacity .8s; font-size: 18px; letter-spacing: .08em; color: var(--gold); }
  #loading small { display: block; margin-top: 10px; font: 12px ui-sans-serif, system-ui, sans-serif; color: var(--dim); letter-spacing: 0; text-align: center; }
  #loading.done { opacity: 0; pointer-events: none; }
  @media (max-width: 640px) { #help { display: none; } #title h1 { font-size: 20px; } #tod { width: 90px; } }
</style>
</head>
<body>
<div id="loading"><div>Rigging the ship &amp; filling the bottle…<small id="loadmsg">loading three.js</small></div></div>
<div id="title"><h1>Ship in a Bottle</h1><p>A voxel world adrift in glass</p></div>
<div id="help">
  <div><b>Drag</b> orbit · <b>Wheel</b> zoom</div>
  <div><b>Right-drag</b> tilt the bottle · <b>Click</b> the sea to drop cargo</div>
  <div><b>S</b> storm · <b>K</b> shake · <b>N</b> day/night · <b>F</b> follow ship</div>
</div>
<div id="hud">
  <button class="btn" id="bStorm">Storm</button>
  <button class="btn" id="bShake">Shake bottle</button>
  <button class="btn" id="bRock">Rock gently</button>
  <button class="btn on" id="bCycle">Day cycle</button>
  <label>Time <input id="tod" type="range" min="0" max="1" step="0.001" value="0.36" /><span id="clock">08:38</span></label>
  <button class="btn" id="bFollow">Follow ship</button>
  <button class="btn" id="bOrbit">Auto orbit</button>
  <button class="btn" id="bSound">Sound off</button>
</div>
<script>
  window.addEventListener('error', (e) => {
    const m = document.getElementById('loadmsg');
    if (m) m.textContent = 'Error: ' + (e.message || e.error);
  });
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

document.getElementById('loadmsg').textContent = 'building voxels';

// =====================================================================
//  CORE: math, noise, colour helpers, voxel mesher, renderer, materials
// =====================================================================
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);
const sstep = (a, b, x) => smooth(clamp((x - a) / (b - a), 0, 1));
function mulberry32(a) {
  return () => { a |= 0; a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const rand = mulberry32(20261015);
const rr = (a, b) => a + (b - a) * rand();
const ri = (a, b) => Math.floor(a + (b - a + 1) * rand());
const pick = (arr) => arr[Math.floor(rand() * arr.length)];
function hash2(x, y) {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const hash3 = (x, y, z) => hash2((x | 0) + Math.imul(z | 0, 1013904223), (y | 0) ^ Math.imul(z | 0, 1664525));
function noise2(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), u = smooth(x - xi), v = smooth(y - yi);
  return lerp(lerp(hash2(xi, yi), hash2(xi + 1, yi), u), lerp(hash2(xi, yi + 1), hash2(xi + 1, yi + 1), u), v);
}
function fbm2(x, y, o = 4) {
  let s = 0, a = 0.5, n = 0;
  for (let i = 0; i < o; i++) { s += a * noise2(x, y); n += a; x = x * 2.03 + 17.1; y = y * 2.03 - 9.7; a *= 0.5; }
  return s / n;
}
// colours are packed 0xRRGGBB ints (sRGB); converted to linear when meshed
const S2L = new Float32Array(256);
for (let i = 0; i < 256; i++) { const c = i / 255; S2L[i] = c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4); }
function shade(c, f) {
  const r = Math.min(255, ((c >> 16) & 255) * f) | 0, g = Math.min(255, ((c >> 8) & 255) * f) | 0, b = Math.min(255, (c & 255) * f) | 0;
  return (r << 16) | (g << 8) | b;
}
function mixc(a, b, t) {
  return ((lerp((a >> 16) & 255, (b >> 16) & 255, t) | 0) << 16) | ((lerp((a >> 8) & 255, (b >> 8) & 255, t) | 0) << 8) | (lerp(a & 255, b & 255, t) | 0);
}
const vary = (c, amt = 0.07) => shade(c, 1 + (rand() * 2 - 1) * amt);

// ---------------------------------------------------------------------
//  Bottle geometry constants (bottle-local space; bottle axis = +X)
// ---------------------------------------------------------------------
const R_IN = 7.0, R_OUT = 7.28, WL = -1.5, Y_BODY = WL - 0.9;
const X_BASE = -15.6, X_SH = 11.0, X_NECK = 15.0, R_NECK = 2.1, X_LIP = 19.7;
function innerR(x) {
  if (x <= X_SH) return R_IN;
  if (x >= X_NECK) return R_NECK;
  const t = (x - X_SH) / (X_NECK - X_SH);
  return R_NECK + (R_IN - R_NECK) * (0.5 + 0.5 * Math.cos(Math.PI * t));
}
const insideBottle = (x, y, z, m = 0) => x > X_BASE + 0.3 + m && x < X_LIP && Math.hypot(y, z) < innerR(x) - m;

// ---------------------------------------------------------------------
//  Voxel model + mesher (hidden-face culling, per-vertex ambient occlusion)
// ---------------------------------------------------------------------
const KX = 1024; // keys stay below 2^30 so V8 keeps them as small ints
const vkey = (x, y, z) => ((x + 512) * KX + (y + 512)) * KX + (z + 512);
const AO_F = [0.52, 0.7, 0.86, 1.0];
class VoxelModel {
  constructor() { this.map = new Map(); }
  set(x, y, z, c) { this.map.set(vkey(x, y, z), c); }
  get(x, y, z) { return this.map.get(vkey(x, y, z)); }
  has(x, y, z) { return this.map.has(vkey(x, y, z)); }
  del(x, y, z) { this.map.delete(vkey(x, y, z)); }
  box(x0, y0, z0, x1, y1, z1, c) {
    for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++)
      this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
  }
  ball(cx, cy, cz, r, c, sy = 1) {
    const R = Math.ceil(r);
    for (let x = -R; x <= R; x++) for (let y = -R; y <= R; y++) for (let z = -R; z <= R; z++)
      if (x * x + (y * y) / (sy * sy) + z * z <= r * r) this.set(cx + x, cy + y, cz + z, typeof c === 'function' ? c(cx + x, cy + y, cz + z) : c);
  }
  line(x0, y0, z0, x1, y1, z1, c, th = 0) {
    const n = Math.max(1, Math.ceil(Math.max(Math.abs(x1 - x0), Math.abs(y1 - y0), Math.abs(z1 - z0))));
    for (let i = 0; i <= n; i++) {
      const t = i / n, x = Math.round(lerp(x0, x1, t)), y = Math.round(lerp(y0, y1, t)), z = Math.round(lerp(z0, z1, t));
      if (th) this.box(x, y, z, x + th, y + th, z + th, c); else this.set(x, y, z, typeof c === 'function' ? c(x, y, z) : c);
    }
  }
  // builds an indexed BufferGeometry of exposed faces; size = voxel edge, off = voxel-space offset
  geometry(size = 0.1, off = [0, 0, 0]) {
    const map = this.map, has = (x, y, z) => map.has(vkey(x, y, z));
    const pos = [], nor = [], col = [], idx = [];
    const v = [0, 0, 0], p = [0, 0, 0], q = [0, 0, 0], ao = [0, 0, 0, 0], ord = [0, 0, 0, 0], e = [0, 0, 0, 0];
    let vi = 0;
    for (const [k, c] of map) {
      v[2] = (k % KX) - 512; const t = Math.floor(k / KX); v[1] = (t % KX) - 512; v[0] = Math.floor(t / KX) - 512;
      const cr = S2L[(c >> 16) & 255], cg = S2L[(c >> 8) & 255], cb = S2L[c & 255];
      for (let a = 0; a < 3; a++) {
        const u = (a + 1) % 3, w = (a + 2) % 3;
        for (let s = -1; s <= 1; s += 2) {
          p[0] = v[0]; p[1] = v[1]; p[2] = v[2]; p[a] += s;
          if (has(p[0], p[1], p[2])) continue;
          for (let ci = 0; ci < 4; ci++) {
            const du = (ci === 1 || ci === 2) ? 1 : -1, dw = ci >= 2 ? 1 : -1;
            q[0] = p[0]; q[1] = p[1]; q[2] = p[2]; q[u] += du; const s1 = has(q[0], q[1], q[2]) ? 1 : 0;
            q[u] -= du; q[w] += dw; const s2 = has(q[0], q[1], q[2]) ? 1 : 0;
            q[u] += du; const cc = has(q[0], q[1], q[2]) ? 1 : 0;
            ao[ci] = s1 && s2 ? 0 : 3 - (s1 + s2 + cc);
          }
          if (s > 0) { ord[0] = 0; ord[1] = 1; ord[2] = 2; ord[3] = 3; } else { ord[0] = 0; ord[1] = 3; ord[2] = 2; ord[3] = 1; }
          for (let j = 0; j < 4; j++) {
            const cn = ord[j], cu = (cn === 1 || cn === 2) ? 1 : 0, cw = cn >= 2 ? 1 : 0;
            q[a] = v[a] + (s > 0 ? 1 : 0); q[u] = v[u] + cu; q[w] = v[w] + cw;
            pos.push((q[0] + off[0]) * size, (q[1] + off[1]) * size, (q[2] + off[2]) * size);
            nor.push(a === 0 ? s : 0, a === 1 ? s : 0, a === 2 ? s : 0);
            const f = AO_F[ao[cn]]; e[j] = ao[cn];
            col.push(cr * f, cg * f, cb * f);
          }
          if (e[0] + e[2] >= e[1] + e[3]) idx.push(vi, vi + 1, vi + 2, vi, vi + 2, vi + 3);
          else idx.push(vi + 1, vi + 2, vi + 3, vi + 1, vi + 3, vi);
          vi += 4;
        }
      }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(vi > 65535 ? new THREE.Uint32BufferAttribute(idx, 1) : new THREE.Uint16BufferAttribute(idx, 1));
    g.computeBoundingSphere();
    return g;
  }
}

// ---------------------------------------------------------------------
//  Renderer, scene, camera, post-processing
// ---------------------------------------------------------------------
let PR = Math.min(window.devicePixelRatio || 1, 1.75);
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(PR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.1, 500);
camera.position.set(-5, 8, 38);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(2, -1.2, 0);
controls.enableDamping = true; controls.dampingFactor = 0.07;
controls.enablePan = false;
controls.minDistance = 7; controls.maxDistance = 80;
controls.maxPolarAngle = Math.PI * 0.64;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: null };

const composerRT = new THREE.WebGLRenderTarget(innerWidth * PR, innerHeight * PR, { type: THREE.HalfFloatType, samples: 4 });
const composer = new EffectComposer(renderer, composerRT);
composer.setPixelRatio(PR);
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.55, 0.88);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

// everything inside (and including) the bottle lives in this group, so the bottle can be tilted as one
const bottle = new THREE.Group();
scene.add(bottle);

// ---------------------------------------------------------------------
//  Shared uniforms + materials (inside-bottle material gets caustics + depth tint)
// ---------------------------------------------------------------------
const U = {
  uTime: { value: 0 }, uWL: { value: WL }, uSlope: { value: new THREE.Vector3(0, 0, -2.2) },
  uBInv: { value: new THREE.Matrix4() }, uDay: { value: 1 }, uCaus: { value: 1 },
  uDeep: { value: new THREE.Color(0x0b5170) }, uFlash: { value: 0 },
};
const CAUSTIC_GLSL = `
vec2 cH(vec2 p){ p = vec2(dot(p, vec2(127.1, 311.7)), dot(p, vec2(269.5, 183.3))); return fract(sin(p) * 43758.5453); }
float cVor(vec2 p, float t){
  vec2 ip = floor(p), fp = fract(p); float d1 = 8.0, d2 = 8.0;
  for (int y = -1; y <= 1; y++) for (int x = -1; x <= 1; x++) {
    vec2 g = vec2(float(x), float(y)); vec2 o = cH(ip + g);
    o = 0.5 + 0.42 * sin(t + 6.2831 * o);
    float d = length(g + o - fp);
    if (d < d1) { d2 = d1; d1 = d; } else if (d < d2) { d2 = d; }
  }
  return 1.0 - smoothstep(0.0, 0.16, d2 - d1);
}
float caustic(vec2 p, float t){
  p += 0.3 * vec2(sin(p.y * 1.7 + t * 0.6), cos(p.x * 1.3 - t * 0.5));
  return pow(cVor(p, t * 0.9), 2.0) * 0.6 + pow(cVor(p * 1.8 + 3.7, t * 1.25), 2.0) * 0.4;
}`;
function insideMaterial(params = {}) {
  const m = new THREE.MeshStandardMaterial(Object.assign({ vertexColors: true, roughness: 0.86, metalness: 0 }, params));
  m.onBeforeCompile = (sh) => {
    for (const k of ['uTime', 'uWL', 'uSlope', 'uBInv', 'uDay', 'uCaus', 'uDeep']) sh.uniforms[k] = U[k];
    sh.vertexShader = sh.vertexShader
      .replace('#include <common>', '#include <common>\nuniform mat4 uBInv;\nvarying vec3 vBL;')
      .replace('#include <project_vertex>', `#include <project_vertex>
        vec4 blp = vec4(transformed, 1.0);
        #ifdef USE_INSTANCING
          blp = instanceMatrix * blp;
        #endif
        vBL = (uBInv * modelMatrix * blp).xyz;`);
    sh.fragmentShader = sh.fragmentShader
      .replace('#include <common>', '#include <common>\nuniform float uTime, uWL, uDay, uCaus;\nuniform vec3 uSlope, uDeep;\nvarying vec3 vBL;\n' + CAUSTIC_GLSL)
      .replace('#include <color_fragment>', `#include <color_fragment>
        {
          float wl = uWL + uSlope.x * (vBL.x - uSlope.z) + uSlope.y * vBL.z;
          float dep = wl - vBL.y;
          if (dep > 0.0 && length(vBL.yz) < 7.05) {
            vec3 fn = normalize(cross(dFdx(vBL), dFdy(vBL)));
            float up = clamp(abs(fn.y), 0.0, 1.0) * 0.8 + 0.2;
            float c = caustic(vBL.xz * 1.15, uTime * 1.2) * up * uCaus * exp(-dep * 0.28);
            diffuseColor.rgb = diffuseColor.rgb * (1.0 + c * 1.3) + vec3(0.25, 0.45, 0.5) * c * 0.25;
            diffuseColor.rgb = mix(diffuseColor.rgb, uDeep, clamp(0.04 + dep * 0.06, 0.0, 0.42));
          }
        }`);
  };
  return m;
}
const voxMat = insideMaterial();
const voxMatOut = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.82, metalness: 0 });
const glowMat = new THREE.MeshBasicMaterial({ vertexColors: true });
glowMat.userData.base = 1;

function voxMesh(model, size, mat = voxMat, off = [0, 0, 0], shadow = true) {
  const mesh = new THREE.Mesh(model.geometry(size, off), mat);
  mesh.castShadow = shadow; mesh.receiveShadow = shadow;
  return mesh;
}

// =====================================================================
//  TERRAIN: sea floor, central island, volcano islet, sea arch, headland
// =====================================================================
const ISL = { x: -4.0, z: 0.0, ax: 3.9, az: 2.5 };     // tropical island (ellipse at waterline)
const VOL = { x: -13.8, z: 5.1 };                      // little volcano
const ARCH = { x: 6.1, z: 4.9 };                       // sea arch
const LH = { x: 11.7, z: 0.0 };                        // lighthouse on the headland
const REEFS = [{ x: -11.8, z: -3.6, r: 1.7, h: 1.3 }, { x: 2.6, z: -4.4, r: 1.4, h: 1.1 }, { x: -6.5, z: 4.1, r: 1.2, h: 0.8 }, { x: -1.0, z: -4.9, r: 1.0, h: 0.7 }];
const SEABED = WL - 3.7;

function islandProfile(r) {              // height above waterline, r = normalised elliptic radius
  if (r < 0.38) return 1.5 + 0.7 * (1 - r / 0.38);
  if (r < 0.75) return lerp(1.5, 0.45, (r - 0.38) / 0.37);
  if (r < 1.0) return lerp(0.45, -0.08, (r - 0.75) / 0.25);
  if (r < 1.4) return lerp(-0.08, -1.15, smooth((r - 1.0) / 0.4));
  if (r < 2.1) return lerp(-1.15, -3.9, smooth((r - 1.4) / 0.7));
  return -3.9;
}
function terrainH(x, z) {
  const n = fbm2(x * 0.33 + 3.1, z * 0.33 - 1.7, 3);
  let h = SEABED + (n - 0.5) * 0.8 + 0.22 * Math.sin(x * 0.55 + 1.3) * Math.cos(z * 0.6);
  // island
  const ix = (x - ISL.x) / ISL.ax, iz = (z - ISL.z) / ISL.az;
  const r = Math.hypot(ix, iz) * (1 + (n - 0.5) * 0.22);
  h = Math.max(h, WL + islandProfile(r) + (r < 0.8 ? (n - 0.5) * 0.35 : 0));
  // volcano cone with crater
  const dv = Math.hypot(x - VOL.x, z - VOL.z);
  let vh = WL + 3.1 - dv * 2.0;
  if (dv < 0.5) vh = WL + 2.1 - (0.5 - dv) * 1.6;
  h = Math.max(h, vh + (dv > 0.5 ? (n - 0.5) * 0.35 : 0));
  // sea arch pillars on a rocky base
  for (const s of [-1, 1]) {
    const dp = Math.hypot(x - (ARCH.x + s * 0.8), z - ARCH.z);
    if (dp < 0.5) h = Math.max(h, WL + 2.0 + (n - 0.5) * 0.3);
  }
  const da = Math.hypot((x - ARCH.x) / 1.6, (z - ARCH.z) / 1.0);
  if (da < 1.6) h = Math.max(h, WL - 0.35 - da * 1.6 + (n - 0.5) * 0.5);
  // reefs
  for (const f of REEFS) { const d = Math.hypot(x - f.x, z - f.z) / f.r; if (d < 1) h = Math.max(h, SEABED + f.h * (1 - d * d) + (n - 0.5) * 0.4); }

  return {
    get on() { return on; },
    toggle() { if (!ctx) init(); on = !on; ctx.resume(); master.gain.setTargetAtTime(on ? 0.6 : 0, ctx.currentTime, 0.4); return on; },
    update(t, storm) { if (!on) return; sea.gain.setTargetAtTime(0.18 + 0.14 * Math.sin(t * 0.55) ** 2 + storm * 0.25, ctx.currentTime, 0.3); wind.gain.setTargetAtTime(0.015 + storm * 0.12, ctx.currentTime, 0.5); },
    thunder() { burst(3.2, 140, 'lowpass', 1.2, 0.25); burst(1.2, 400, 'lowpass', 0.5, 0.2); },
    splash(k = 0.5) { burst(0.35 + k * 0.3, 1400, 'bandpass', 0.25 * k); },
  };
})();

// =====================================================================
//  STATE, UI, INPUT
// =====================================================================
const state = { storm: 0, stormT: 0, tod: 0.36, cycle: true, rock: false, follow: false, orbit: false, idle: 0 };
const tilt = { rx: 0, vx: 0, rz: 0, vz: 0, tx: 0, tz: 0, drag: false, shake: 0 };
const $ = (id) => document.getElementById(id);
const setOn = (id, v) => $(id).classList.toggle('on', !!v);
function toggleStorm() { state.storm = state.storm ? 0 : 1; setOn('bStorm', state.storm); }
function shake() {
  tilt.vx += rr(-1.6, 1.6) || 1; tilt.vz += rr(-0.35, 0.35); tilt.shake = 0.6;
  ocean.kick(rr(-0.12, 0.12), rr(-0.2, 0.2));
  for (let i = 0; i < 18; i++) { const x = rr(-14, 9), z = rr(-5, 5); if (ocean.isWet(x, z)) { ocean.disturb(x, z, rr(0.15, 0.35), 0.6); if (i % 3 === 0) fx.splash(x, z, 1.2); } }
  ship.kick(rr(-0.8, 0.8), rr(-0.4, 0.4), rr(0.5, 1.2));
  for (const f of floaters) { f.vel.add(new THREE.Vector3(rr(-1.5, 1.5), rr(1, 3), rr(-1.5, 1.5))); f.w.add(new THREE.Vector3(rr(-4, 4), rr(-4, 4), rr(-4, 4))); }
  SCARE.x = -4; SCARE.y = -3.5; SCARE.z = 0; SCARE.t = U.uTime.value;
  for (let i = 0; i < 14; i++) fx.ember(PROPS.vent.x, PROPS.vent.y + 0.2, PROPS.vent.z, rr(-1.2, 1.2), rr(3, 5), rr(-1.2, 1.2));
  AUDIO.splash(1);
}
function setFollow(v) { state.follow = v; setOn('bFollow', v); }
$('bStorm').onclick = toggleStorm;
$('bShake').onclick = shake;
$('bRock').onclick = () => { state.rock = !state.rock; setOn('bRock', state.rock); };
$('bCycle').onclick = () => { state.cycle = !state.cycle; setOn('bCycle', state.cycle); };
$('bFollow').onclick = () => setFollow(!state.follow);
$('bOrbit').onclick = () => { state.orbit = !state.orbit; controls.autoRotate = state.orbit; setOn('bOrbit', state.orbit); };
$('bSound').onclick = () => { const v = AUDIO.toggle(); $('bSound').textContent = v ? 'Sound on' : 'Sound off'; setOn('bSound', v); };
$('tod').oninput = (e) => { state.tod = +e.target.value; state.cycle = false; setOn('bCycle', false); };
controls.autoRotateSpeed = 0.5;
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  const k = e.key.toLowerCase();
  if (k === 's') toggleStorm(); else if (k === 'k') shake(); else if (k === 'f') setFollow(!state.follow);
  else if (k === 'n') { state.tod = state.tod > 0.25 && state.tod < 0.75 ? 0.92 : 0.4; state.cycle = false; setOn('bCycle', false); }
  else if (k === 'r') $('bRock').onclick(); else if (k === 'o') $('bOrbit').onclick();
});
const cvs = renderer.domElement;
cvs.addEventListener('contextmenu', (e) => e.preventDefault());
let down = null;
cvs.addEventListener('pointerdown', (e) => { down = { x: e.clientX, y: e.clientY, b: e.button, t: performance.now() }; if (e.button === 2) { tilt.drag = true; cvs.setPointerCapture(e.pointerId); } state.idle = 0; });
cvs.addEventListener('pointermove', (e) => {
  if (!tilt.drag || !down) return;
  tilt.tx = clamp(tilt.tx + e.movementX * 0.003, -0.16, 0.16); tilt.tz = clamp(tilt.tz - e.movementY * 0.001, -0.06, 0.06);
});
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
cvs.addEventListener('pointerup', (e) => {
  if (e.button === 2) { tilt.drag = false; tilt.tx = 0; tilt.tz = 0; }
  if (down && e.button === 0 && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 6 && performance.now() - down.t < 400) dropCargo(e);
  down = null;
});
function dropCargo(e) {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const inv = bottle.matrixWorld.clone().invert(), o = ray.ray.origin.clone().applyMatrix4(inv), d = ray.ray.direction.clone().transformDirection(inv);
  if (Math.abs(d.y) < 1e-4) return;
  const t = (WL - o.y) / d.y; if (t < 0) return;
  const x = o.x + d.x * t, z = o.z + d.z * t;
  if (!ocean.isWet(x, z)) return;
  const kind = pick(['barrel', 'barrel', 'crate', 'crate', 'ring', 'bottle']);
  const top = Math.min(4.5, Math.sqrt(Math.max(0, (innerR(x) - 0.8) ** 2 - z * z)));
  spawnFloater(kind, x, top, z);
}

// =====================================================================
//  MAIN LOOP
// =====================================================================
const clock = new THREE.Clock();
const _g = new THREE.Vector3(), _iq = new THREE.Quaternion(), _sw = new THREE.Vector3(), _follow = new THREE.Vector3();
let t = 0, frames = 0, perfAcc = 0, perfN = 0, ventT = 0, emberT = 3, boltT = 4;
function frame() {
  requestAnimationFrame(frame);
  tick(Math.min(clock.getDelta(), 1 / 30));
}
function tick(dt) {
  t += dt; U.uTime.value = t;
  // weather + time of day
  state.stormT = lerp(state.stormT, state.storm, 1 - Math.exp(-dt * 0.35));
  const storm = state.stormT;
  WIND.str = 1 + storm * 1.5 + (noise2(t * 0.25, 3.3) - 0.5) * (0.4 + storm);
  U.uWave.value = 0.7 + WIND.str * 0.45;
  if (state.cycle) { state.tod = (state.tod + dt / 160) % 1; $('tod').value = state.tod; }
  const hh = Math.floor(state.tod * 24), mm = Math.floor((state.tod * 24 - hh) * 60);
  if (frames % 15 === 0) $('clock').textContent = String(hh).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
  // bottle rocking on its cradle (damped pendulum) -> local gravity -> slosh target
  if (state.rock && !tilt.drag) { tilt.tx = Math.sin(t * 0.75) * 0.16; tilt.tz = Math.sin(t * 0.5) * 0.035; }
  else if (!tilt.drag) { tilt.tx = 0; tilt.tz = 0; }
  tilt.vx += (9 * (tilt.tx - tilt.rx) - 1.2 * tilt.vx) * dt; tilt.rx += tilt.vx * dt;
  tilt.vz += (14 * (tilt.tz - tilt.rz) - 2.0 * tilt.vz) * dt; tilt.rz += tilt.vz * dt;
  tilt.shake = Math.max(0, tilt.shake - dt);
  bottle.rotation.set(tilt.rx, 0, tilt.rz);
  bottle.position.set(Math.sin(t * 60) * tilt.shake * 0.12, Math.cos(t * 47) * tilt.shake * 0.08, 0);
  bottle.updateMatrixWorld(true);
  U.uBInv.value.copy(bottle.matrixWorld).invert();
  _iq.copy(bottle.quaternion).invert(); _g.set(0, -1, 0).applyQuaternion(_iq);
  ocean.target.set(-_g.x / _g.y, -_g.z / _g.y);
  // lighting
  const L = updateSky(state.tod, storm, t);
  U.uDay.value = L.day; U.uCaus.value = L.day * (1 - storm * 0.6) + 0.08;
  glassMat.uniforms.uSun.value.copy(sunLight.position).normalize();
  glassMat.uniforms.uSunCol.value.copy(sunLight.color).multiplyScalar(sunLight.intensity * 0.5);
  glassMat.uniforms.uNight.value = L.night;
  fx.uniforms.uSun.value.copy(sunLight.position).normalize(); fx.uniforms.uAmb.value = 0.55; fx.uniforms.uLight.value = 0.35 + 0.75 * L.day;
  candleLight.intensity = (0.6 + L.night * 9) * (0.85 + 0.15 * Math.sin(t * 19) * Math.sin(t * 6.1));
  candleLight.userData.flame.scale.set(1, 1 + Math.sin(t * 15) * 0.12, 1);
  renderer.toneMappingExposure = 1.05 + L.night * 0.35;
  bloomPass.strength = 0.42 + L.night * 0.38;
  // physics + life
  ocean.update(dt, t, storm);
  ship.update(dt, t, storm);
  stepFloaters(dt * 0.5); stepFloaters(dt * 0.5);
  fishSchools.update(dt, t); dolphins.update(dt, t); turtle.update(dt, t); gulls.update(dt, t); crabs.update(dt, t);
  for (const s of PROPS.swayers) { s.mesh.rotation.z = Math.sin(t * 1.2 + s.ph) * s.amp * (1 + storm * 2.5); s.mesh.rotation.x = Math.cos(t * 0.9 + s.ph) * s.amp * 0.7 * (1 + storm * 2.5); }
  updateClouds(dt, storm);
  // emitters: campfire, chimney, volcano, lava hissing, bubbles, fireflies
  if (rand() < dt * 30) fx.fire(PROPS.fire.x, PROPS.fire.y, PROPS.fire.z);
  if (rand() < dt * 1.4) fx.smoke(PROPS.chimney.x, PROPS.chimney.y, PROPS.chimney.z, 0.6, false);
  ventT -= dt; if (ventT < 0) { ventT = rr(0.12, 0.3); fx.smoke(PROPS.vent.x, PROPS.vent.y + 0.15, PROPS.vent.z, 1, true); }
  emberT -= dt; if (emberT < 0) { emberT = rr(4, 9); for (let i = 0; i < ri(5, 12); i++) fx.ember(PROPS.vent.x, PROPS.vent.y + 0.2, PROPS.vent.z, rr(-1, 1), rr(2.5, 4.5), rr(-1, 1)); }
  for (const p of PROPS.lavaEnd || []) if (rand() < dt * 3) fx.steam(p.x, p.y, p.z);
  for (const b of PROPS.bubblers) if (rand() < dt * 2.5) fx.bubble(b.x, b.y, b.z);
  if (L.night > 0.6 && rand() < dt * 1.5) fx.firefly(ISL.x + rr(-2.5, 2.5), WL + rr(0.8, 2.2), ISL.z + rr(-1.5, 1.5));
  if (storm > 0.6) { boltT -= dt; if (boltT < 0) { boltT = rr(2.5, 7); const c = pick(clouds).mesh.position; lightning.strike(c.x + rr(-1, 1), c.y - 0.4, c.z); } }
  fx.update(dt); lightning.update(dt);
  U.uFlash.value = lightning.flash;
  hemi.intensity += lightning.flash * 2.5;
  AUDIO.update(t, storm);
  // camera
  if (state.follow) {
    bottle.localToWorld(_follow.set(ship.st.x, ship.st.y + 0.8, ship.st.z));
    _sw.copy(_follow).sub(controls.target).multiplyScalar(1 - Math.exp(-dt * 2));
    controls.target.add(_sw); camera.position.add(_sw);
  }
  controls.update();
  composer.render();
  // adaptive resolution keeps things smooth on slower GPUs
  frames++; perfAcc += dt; perfN++;
  if (perfN === 90) { const avg = perfAcc / perfN; perfAcc = 0; perfN = 0; if (avg > 1 / 38 && PR > 0.8) { PR = Math.max(0.75, PR - 0.25); renderer.setPixelRatio(PR); composer.setPixelRatio(PR); } }
  if (frames === 2) $('loading').classList.add('done');
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight); bloomPass.resolution.set(innerWidth, innerHeight);
});
window.__bottle = { camera, controls, state, ship, ocean, fx, floaters, renderer, scene, bottle, tilt, get PR() { return PR; }, run(n, dt = 1 / 60) { for (let i = 0; i < n; i++) tick(dt); } };
frame();
</script>
